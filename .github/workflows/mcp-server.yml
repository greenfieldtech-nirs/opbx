name: mcp-server

on:
  push:
    branches: [develop, main]
    paths:
      - "mcp-server/**"
      - "docs/opbx-openapi/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "docs/opbx-openapi/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test                       # unit + contract + security (integration is env-gated)
      - run: npm run validate:opbx-api      # OpenAPI drift check (also part of npm test; explicit gate)
      - run: npm run build

  integration:
    # Full-stack: boots OPBX from the repo's compose file and runs the live suite.
    # Manual + develop pushes only (heavy).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Prepare OPBX env
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env || true

          # The app entrypoint and validate-env.sh fail fast on empty/weak
          # secrets (APP_KEY, DB_PASSWORD, DB_ROOT_PASSWORD, MINIO_ACCESS_KEY,
          # MINIO_SECRET_KEY). .env.example leaves them blank/default, which would
          # abort the container with exit 1 in CI. Generate strong throwaway
          # values for the ephemeral CI stack.
          APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          DB_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          DB_ROOT_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          MINIO_ACCESS_KEY="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          MINIO_SECRET_KEY="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"

          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
          sed -i "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}|" .env
          sed -i "s|^MINIO_ACCESS_KEY=.*|MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}|" .env
          sed -i "s|^MINIO_SECRET_KEY=.*|MINIO_SECRET_KEY=${MINIO_SECRET_KEY}|" .env

      - name: Prepare docker compose file
        # docker-compose.yml is gitignored (local, may contain secrets); the repo
        # ships docker-compose.yml.example as the canonical template. Without
        # generating it, `docker compose up` fails with "no configuration file
        # provided: not found".
        run: cp docker-compose.yml.example docker-compose.yml

      - name: Boot OPBX stack
        # COMPOSE_FILE layers docker-compose.ci.yml over the generated
        # docker-compose.yml so the `app` service is NOT bind-mounted to the repo
        # (the CI checkout has no vendor/; the app image bakes its own).
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: docker compose up -d mysql redis minio app nginx

      - name: Resolve OPBX public URL
        id: baseurl
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          # nginx publishes ${APP_PORT:-80}:80. Resolve the actual host port so the
          # health check and the MCP integration tests talk to the right endpoint
          # instead of assuming plain http://localhost (which may be a different
          # service or unavailable on the runner).
          PORT=$(docker compose port nginx 80 | head -1 | sed 's/.*://')
          echo "Resolved nginx host port: ${PORT}"
          echo "base_url=http://127.0.0.1:${PORT}" >> "$GITHUB_OUTPUT"

      - name: Wait for OPBX health
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${{ steps.baseurl.outputs.base_url }}/api/health" | grep -q healthy; then exit 0; fi
            sleep 5
          done
          echo "OPBX did not become healthy"; docker compose logs app | tail -80; exit 1

      - name: Create integration test token
        id: token
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          TOKEN=$(docker compose exec -T app php artisan tinker --execute='
            $org = App\Models\Organization::first() ?? App\Models\Organization::create(["name"=>"CI Org","slug"=>"ci-org","status"=>"active","timezone"=>"UTC"]);
            $u = App\Models\User::withoutGlobalScopes()->firstOrCreate(["email"=>"mcp-ci@example.com"],["organization_id"=>$org->id,"name"=>"CI","password"=>bcrypt("ci"),"role"=>"owner","status"=>"active"]);
            $u->organization_id = $org->id; $u->save();
            // The ring-group cycle test needs at least one USER extension in the org.
            \App\Scopes\OrganizationScope::bypass(function () use ($org, $u) {
              if (!\App\Models\Extension::where("organization_id", $org->id)->where("type", "user")->exists()) {
                \App\Models\Extension::create([
                  "organization_id" => $org->id,
                  "user_id" => $u->id,
                  "extension_number" => "9000",
                  "password" => bin2hex(random_bytes(16)),
                  "type" => "user",
                  "status" => "active",
                ]);
              }
            });
            echo "TK:".$u->createToken("ci")->plainTextToken;' | grep -oE 'TK:[0-9]+\|[A-Za-z0-9]+' | sed 's/TK://')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        working-directory: mcp-server
        env:
          OPBX_TEST_BASE_URL: ${{ steps.baseurl.outputs.base_url }}
          OPBX_TEST_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          npm ci
          # Live integration tests drive many OPBX API calls (validate_configuration
          # fans out across every collection). The default vitest 10s timeout is too
          # tight on a CI runner, so allow 60s per test.
          npx vitest run --testTimeout 60000 tests/integration
