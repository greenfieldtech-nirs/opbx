apiVersion: 1

# Force-recreate so the uid stays "loki" even for instances whose datasource
# was created before the uid was pinned (provisioning never rewrites uids).
deleteDatasources:
  - name: Loki

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
