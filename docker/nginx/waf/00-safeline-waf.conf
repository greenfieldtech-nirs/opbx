# SafeLine WAF hook (PoC). http context: every location inherits it.
# Rendered by docker-compose.waf.yml: __WAF_MODE__ (off|monitor|block) and
# __WAF_DETECTOR_HOST__ (safeline-detector TCP listener, port 8000).
access_by_lua_block {
    -- try_files -> /index.php is an internal redirect; inspect each request once.
    if ngx.req.is_internal() then
        return
    end

    local mode = "__WAF_MODE__"
    local uri = ngx.var.uri

    -- Cloudonix call-control callbacks are signature-verified and must answer
    -- CXML; a WAF 403 drops the live call. Inspect them, never block them.
    if mode == "block"
        and (uri:find("^/api/webhooks/") or uri:find("^/api/voice/") or uri:find("^/api/callbacks/"))
    then
        mode = "monitor"
    end

    local t1k = require "resty.t1k"
    local ok, err, result = t1k.do_access({
        mode = mode,
        host = "__WAF_DETECTOR_HOST__",
        port = 8000,
        -- Fail open fast: a slow or dead detector must not stall the PBX.
        connect_timeout = 200,
        send_timeout = 500,
        read_timeout = 500,
        -- Last X-Forwarded-For hop = what the trusted TLS proxy saw; the first
        -- hop is client-controlled. Falls back to $remote_addr when absent.
        remote_addr = "http_x_forwarded_for: -1",
    }, true) -- true: t1k answers 403 itself when mode == "block"

    if not ok then
        ngx.log(ngx.ERR, "safeline-waf: detection failed, failing open: ", err)
        return
    end

    -- Reached only when not blocked (monitor, or exempted callback in block mode).
    if result and result.action == "?" then
        ngx.log(ngx.WARN, "safeline-waf: would block (", mode, ") event_id=", result.event_id,
            " ", ngx.var.request_method, " ", uri)
    end
}
