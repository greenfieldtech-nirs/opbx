server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Use container DNS resolver
    resolver 10.89.0.1 valid=10s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/opbx_access.log;
    error_log /var/log/nginx/opbx_error.log;

    # API routes -> Laravel
    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve static files directly (exclude API routes)
    location ~* ^/(?!ui/|api/).*\.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot|mp3|wav|ogg|m4a|aac|flac)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, immutable";
    }

    # Frontend routes -> Vite with /ui prefix
    location / {
        # Add /ui prefix if not already present (302 redirect)
        if ($uri !~ ^/ui/) {
            return 302 /ui$uri;
        }

        proxy_pass http://opbx_frontend:3000;

        # WebSocket upgrade for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # PHP-FPM for API routes
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ ^/\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /(\.env|composer\.(json|lock)|package\.json|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
