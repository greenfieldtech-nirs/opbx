server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Use the Docker embedded DNS resolver. On a user-defined bridge network
    # Docker always exposes its DNS at 127.0.0.11. This is required for the
    # request-time (lazy) upstream resolution used by the proxy_pass blocks
    # below, which look up service names via a variable instead of at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers. X-Frame-Options and Permissions-Policy are driven by
    # $embed_xfo / $embed_permissions (see maps in nginx.conf) so the embedded
    # dialer routes can be framed cross-origin and use the microphone. An empty
    # add_header value emits no header line.
    add_header X-Frame-Options "$embed_xfo" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Logging
    access_log /var/log/nginx/opbx_access.log;
    error_log /var/log/nginx/opbx_error.log;

    # WebSocket proxy for Soketi (port 6001)
    location /app/ {
        # Lazy resolve at request time (see note in `location /`) so nginx does
        # not abort on boot if soketi has not started yet.
        set $soketi_upstream "soketi:6001";
        proxy_pass http://$soketi_upstream;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (keep connections alive longer)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # AMD Worker WebSocket proxy
    # Cloudonix <Start><Stream> connects here via the public URL
    location /ws/amd/ {
        # Lazy resolve at request time (see note in `location /`). Because the
        # upstream is a variable, nginx passes the request URI unchanged, so we
        # must reproduce the /ws/amd/ -> /ws/ rewrite explicitly.
        set $amd_upstream "amd-worker:8082";
        rewrite ^/ws/amd/(.*)$ /ws/$1 break;
        proxy_pass http://$amd_upstream;

        # WebSocket upgrade headers (required)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts - keep connections alive for up to 2 minutes
        # (matches max AMD detection timeout of 120s, but we hardcode 45s)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # API routes -> Laravel
    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Embedded dialer: loader.js and the iframe document are DYNAMIC Laravel
    # routes, not static files. Must be declared before the static-file regex
    # below (which would otherwise serve /embed/loader.js as a missing file ->
    # 404). Framing/mic headers are handled by the $embed_* maps at server
    # scope. /embed/assets/* stay static (real files in public/).
    location ~ ^/embed/(loader\.js|dialer)$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve static files directly (exclude frontend/api routes)
    # Note: Exclude /node_modules/, /@vite/, /src/, /ui/, /api/ - these go to Vite/Laravel
    location ~* ^/(?!ui/|api/|node_modules/|@|src/).*\.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot|mp3|wav|ogg|m4a|aac|flac)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, immutable";
    }

    # Frontend routes -> Vite (handles both public homepage and /ui/* app routes)
    location / {
        # Resolve the Vite dev server lazily at request time (via the resolver
        # on line 8) instead of at config-load time. This prevents nginx from
        # aborting on boot with "host not found in upstream" when the frontend
        # container has not started yet (nginx only depends_on app).
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;

        # WebSocket upgrade for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # PHP-FPM for API routes
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files
    location ~ ^/\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /(\.env|composer\.(json|lock)|package\.json|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
