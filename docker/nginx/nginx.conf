user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Embedded-dialer routes must be framable cross-origin by allowed host
    # sites and need mic access for WebRTC. The global X-Frame-Options and
    # microphone=() Permissions-Policy (set at server scope, inherited by the
    # .php handler that ultimately serves /embed/dialer via try_files) would
    # break that, so these maps blank out those two headers for embed paths.
    # Framing is instead governed by the controller's per-token frame-ancestors
    # CSP. Keyed on $request_uri (the original request line) because try_files
    # internally rewrites $uri to /index.php before add_header is evaluated;
    # $request_uri is immune to that rewrite. It may carry a ?query, so match a
    # prefix rather than anchoring the end.
    map $request_uri $embed_xfo {
        default                  "SAMEORIGIN";
        ~^/embed/dialer(\?|$)     "";
        ~^/embed/loader\.js(\?|$) "";
    }
    map $request_uri $embed_permissions {
        default                  "geolocation=(), microphone=(), camera=()";
        ~^/embed/dialer(\?|$)     "geolocation=(), microphone=(self), camera=()";
        ~^/embed/loader\.js(\?|$) "geolocation=(), microphone=(self), camera=()";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
