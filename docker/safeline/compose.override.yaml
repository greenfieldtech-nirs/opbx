# OPBX deltas on top of the vendored upstream compose.yaml (keep that file verbatim).
# Picked up automatically: docker compose --project-directory docker/safeline -p safeline ...
services:
  mgt:
    # Upstream publishes the admin console on every interface. Publish nothing:
    # the console is reached through OPBX nginx (docker-compose.waf.yml, WAF_CONSOLE_ENABLED=true).
    ports: !reset []
