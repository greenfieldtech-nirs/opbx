# OPBX deltas on top of the vendored upstream compose.yaml (keep that file verbatim).
# Picked up automatically: docker compose --project-directory docker/safeline -p safeline ...
services:
  mgt:
    # Upstream publishes the admin console on every interface. Loopback only;
    # reach it remotely through an SSH tunnel: ssh -L 9443:127.0.0.1:9443 host
    ports: !override
      - 127.0.0.1:${MGT_PORT:-9443}:1443
