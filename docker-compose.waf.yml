# Opt-in SafeLine WAF for the edge nginx (PoC). Requires the SafeLine stack
# (docker/safeline, project "safeline") to be up: it owns the external
# `safeline-ce` network and the detector this nginx calls on port 8000.
#
#   docker compose --project-directory docker/safeline -p safeline up -d
#   docker compose -f docker-compose.yml -f docker-compose.waf.yml up -d nginx
#
# WAF_MODE: off | monitor (default: log would-be blocks) | block.
services:
  nginx:
    image: opbx-nginx-waf:poc
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile.waf
    environment:
      WAF_MODE: ${WAF_MODE:-monitor}
      WAF_DETECTOR_HOST: ${WAF_DETECTOR_HOST:-safeline-detector}
    volumes:
      - ./docker/nginx/waf:/etc/nginx/templates/waf.d:ro
    networks:
      - opbx
      - safeline-ce

networks:
  safeline-ce:
    external: true
