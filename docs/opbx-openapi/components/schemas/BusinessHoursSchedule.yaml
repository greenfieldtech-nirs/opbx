type: object
description: Business Hours Schedule
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (the destination was deleted). The API rejects `unavailable` when creating a resource (422, "Choose a destination.") and accepts it on update.
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Business Hours
  timezone:
    type: string
    example: America/New_York
  status:
    type: string
    enum: [active, inactive]
  configuration:
    type: object
    description: Schedule configuration
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - timezone
  - status
