type: object
description: IVR Menu
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (the destination was deleted). The API rejects `unavailable` when creating a resource (422, "Choose a destination.") and accepts it on update.
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Main Menu
  greeting_message:
    type: string
    example: Thank you for calling
  voice:
    type: string
    example: en-US-Standard-A
  status:
    type: string
    enum: [active, inactive]
  options:
    type: array
    description: IVR menu options
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - status
