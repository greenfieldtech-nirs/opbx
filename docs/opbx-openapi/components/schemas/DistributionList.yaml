type: object
description: Distribution List for auto-dialer campaigns
properties:
  id:
    type: integer
    description: Unique list identifier
    readOnly: true
    example: 1
  name:
    type: string
    description: List name
    example: Sales Leads Q1
  description:
    type:
    - string
    - 'null'
    description: List description
    example: Qualified sales leads for Q1 2024
  version_number:
    type: integer
    description: Version number of this list
    example: 1
  is_latest_version:
    type: boolean
    description: Whether this is the latest version
    example: true
  status:
    type: string
    enum:
    - draft
    - pending
    - processing
    - ready
    - in_use
    - used
    - failed
    - archived
    description: Current list status
    example: ready
  status_label:
    type: string
    description: Human-readable status label
    example: Ready
  status_color:
    type: string
    enum: [gray, yellow, blue, green, red, purple, orange]
    description: Badge color for the status (draft and archived are gray, pending yellow, processing
      blue, ready green, failed red, in_use purple, used orange)
    example: green
  campaign_id:
    type:
    - integer
    - 'null'
    description: ID of the campaign this list is assigned to
    example: 5
  used_by_campaign_id:
    type:
    - integer
    - 'null'
    description: ID of the campaign that used this list
    example: 3
  used_at:
    type:
    - string
    - 'null'
    description: When the list was assigned to a campaign (`Y-m-d H:i:s`)
    example: '2024-01-15 14:30:00'
  statistics:
    type: object
    description: List statistics (the counters are `null` in the create response)
    properties:
      total_rows:
        type:
        - integer
        - 'null'
        description: Total number of rows in the list
        example: 1000
      valid_rows:
        type:
        - integer
        - 'null'
        description: Number of valid rows
        example: 950
      invalid_rows:
        type:
        - integer
        - 'null'
        description: Number of invalid rows
        example: 50
  parent_list_id:
    type:
    - integer
    - 'null'
    description: For a "(Part N)" list, the ID of the list a large upload was split from
    example: null
  has_versions:
    type: boolean
    description: Whether previous versions of the list are kept (destinations replaced by a
      re-upload; see the versions endpoint)
    example: false
  parent_list:
    type:
    - object
    - 'null'
    description: The list this "(Part N)" list was split from. Present in the show response only.
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
        example: Fall Webinar Leads
  parts_count:
    type: integer
    description: Number of "(Part N)" lists a large upload into this list was split into;
      deleting the list deletes them too. Returned by the list index and show endpoints.
    example: 0
  can_archive:
    type: boolean
    description: Status is ready, failed or used, and the list is not assigned to a campaign
    example: true
  can_assign:
    type: boolean
    description: Status is ready
    example: true
  can_upload:
    type: boolean
    description: Status is draft, pending or failed (destinations can be uploaded or added)
    example: true
  can_delete:
    type: boolean
    description: The list is not assigned to a campaign (role rules still apply, see Delete distribution list)
    example: true
  can_unassign:
    type: boolean
    description: The list is assigned to a campaign that is not active, and every destination is still pending with zero dial attempts
    example: false
  unassign_refusal:
    type:
    - string
    - 'null'
    description: Why an assigned list cannot be unassigned now (its campaign is active, or its entries have started processing); null when it can, or when it is not assigned
    example: 'Cannot unassign list: its campaign is active. Pause the campaign first.'
  can_copy:
    type: boolean
    description: Status is ready, in_use, used or archived
    example: true
  created_at:
    type: string
    description: Creation timestamp (`Y-m-d H:i:s`)
    example: '2024-01-10 08:00:00'
  processed_at:
    type:
    - string
    - 'null'
    description: When the last upload finished processing (`Y-m-d H:i:s`)
    example: '2024-01-10 08:05:00'
  archived_at:
    type:
    - string
    - 'null'
    description: When the list was archived (`Y-m-d H:i:s`)
    example: null
  campaign:
    type:
    - object
    - 'null'
    description: Assigned campaign. Present in the list, show and parts responses;
      omitted in the create and copy responses.
    properties:
      id:
        type: integer
        example: 5
      name:
        type: string
        example: Q1 Sales Campaign
  used_by_campaign:
    type:
    - object
    - 'null'
    description: Campaign that used this list. Present in the list and show responses;
      omitted in the create, copy and parts responses.
    properties:
      id:
        type: integer
        example: 3
      name:
        type: string
        example: Previous Campaign
required:
- id
- name
- version_number
- is_latest_version
- status
