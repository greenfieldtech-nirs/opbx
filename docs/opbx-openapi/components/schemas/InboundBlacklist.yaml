type: object
description: Inbound Blacklist entry (serialized model)
properties:
  id:
    type: integer
  organization_id:
    type: integer
  match_type:
    type: string
    enum:
    - exact
    - prefix
    - wildcard
    example: exact
  caller_id_pattern:
    type: string
    example: '+1234567890'
  is_global:
    type: boolean
    description: Applies to all DIDs when true; otherwise only to `did_numbers`
  rejection_strategy:
    type: string
    enum:
    - drop
    - reject
    - torment
  torment_room_prefix:
    type:
    - string
    - 'null'
  torment_music_timeout:
    type:
    - integer
    - 'null'
  status:
    type: string
    enum:
    - active
    - inactive
  blocked_count:
    type: integer
  did_numbers:
    type: array
    description: DIDs the entry applies to (DID-specific entries)
    items:
      type: object
      properties:
        id:
          type: integer
        phone_number:
          type: string
        friendly_name:
          type:
          - string
          - 'null'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
- caller_id_pattern
- match_type
- status
