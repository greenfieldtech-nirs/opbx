type: object
description: Inbound Blacklist entry
properties:
  id:
    type: integer
  organization_id:
    type: integer
  phone_number:
    type: string
    example: '+1234567890'
  match_type:
    type: string
    enum:
    - exact
    - prefix
    - pattern
    example: exact
  description:
    type:
    - string
    - 'null'
    example: Spam caller
  status:
    type: string
    enum:
    - active
    - inactive
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
- phone_number
- match_type
- status
