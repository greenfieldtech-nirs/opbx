type: object
description: Conference room for multi-party calls
properties:
  id:
    type: integer
    readOnly: true
    example: 321
  organization_id:
    type: integer
    example: 1
  name:
    type: string
    description: Conference room name
    example: Weekly Standup
  description:
    type: string
    nullable: true
    example: Team weekly meeting
  max_participants:
    type: integer
    description: Maximum number of participants
    example: 25
  status:
    type: string
    enum:
      - active
      - inactive
    example: active
  pin:
    type: string
    nullable: true
    description: Participant PIN
    example: '1234'
  pin_required:
    type: boolean
    description: Whether PIN is required to join
    example: true
  host_pin:
    type: string
    nullable: true
    description: Host PIN for moderator access
    example: '5678'
  recording_enabled:
    type: boolean
    example: false
  recording_auto_start:
    type: boolean
    example: false
  recording_webhook_url:
    type: string
    format: uri
    nullable: true
    example: https://example.com/webhooks/recording
  wait_for_host:
    type: boolean
    description: Wait for host to join before starting
    example: true
  mute_on_entry:
    type: boolean
    example: true
  announce_join_leave:
    type: boolean
    example: true
  music_on_hold:
    type: boolean
    example: true
  talk_detection_enabled:
    type: boolean
    example: false
  talk_detection_webhook_url:
    type: string
    format: uri
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - max_participants
  - status
