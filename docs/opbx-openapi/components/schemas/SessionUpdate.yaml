type: object
description: Session Update
properties:
  id:
    type: integer
  session_token:
    type: string
  session_id:
    type: integer
  call_id:
    type: string
  status:
    type: string
    enum: [initiated, active, on_hold, transferred, completed, failed]
  from_number:
    type: string
  to_number:
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - session_token
  - status
