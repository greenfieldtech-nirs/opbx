type: object
description: Cloudonix session-update webhook payload (validated by SessionUpdateRequest)
properties:
  id:
    type: integer
    description: Cloudonix session ID
  token:
    type:
    - string
    - 'null'
    description: Session token
  eventId:
    type:
    - string
    - 'null'
  domainId:
    type:
    - integer
    - 'null'
  domain:
    type:
    - string
    - 'null'
    description: Cloudonix domain name (required by the authentication middleware unless `owner.domain` is sent; also used to identify the organization)
  subscriberId:
    type:
    - integer
    - 'null'
  outgoingSubscriberId:
    type:
    - integer
    - 'null'
  callerId:
    type:
    - string
    - 'null'
  destination:
    type: string
  direction:
    type:
    - string
    - 'null'
    enum: [incoming, outgoing, internal, application, null]
  status:
    type:
    - string
    - 'null'
    description: Session status, lower-cased before filtering
    example: connected
  createdAt:
    type: string
  modifiedAt:
    type: string
  callStartTime:
    type:
    - integer
    - 'null'
  callAnswerTime:
    type:
    - integer
    - 'null'
  answerTime:
    type:
    - string
    - 'null'
  startTime:
    type:
    - string
    - 'null'
  timeLimit:
    type:
    - integer
    - 'null'
  vappServer:
    type:
    - string
    - 'null'
  action:
    type: string
  reason:
    type:
    - string
    - 'null'
  lastError:
    type:
    - string
    - 'null'
  callIds:
    type:
    - array
    - 'null'
    items:
      type: string
  profile:
    type:
    - object
    - 'null'
    additionalProperties: true
required:
- id
- destination
- createdAt
- modifiedAt
- action
