type: object
description: Business hours schedule create/update request. All top-level fields are required on both create and update (full replacement).
properties:
  name:
    type: string
    minLength: 2
    maxLength: 255
    description: Unique within the organization
  status:
    type: string
    enum: [active, inactive]
  timezone:
    type: string
    description: Any valid timezone identifier
    example: America/New_York
  open_hours_action:
    $ref: '#/$defs/Action'
  closed_hours_action:
    $ref: '#/$defs/Action'
  schedule:
    type: object
    description: All seven days are required
    properties:
      monday:
        $ref: '#/$defs/Day'
      tuesday:
        $ref: '#/$defs/Day'
      wednesday:
        $ref: '#/$defs/Day'
      thursday:
        $ref: '#/$defs/Day'
      friday:
        $ref: '#/$defs/Day'
      saturday:
        $ref: '#/$defs/Day'
      sunday:
        $ref: '#/$defs/Day'
    required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
  exceptions:
    type:
      - array
      - 'null'
    maxItems: 100
    items:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Y-m-d
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [closed, special_hours]
        time_ranges:
          type:
            - array
            - 'null'
          items:
            $ref: '#/$defs/TimeRange'
      required: [date, name, type]
required:
  - name
  - status
  - timezone
  - open_hours_action
  - closed_hours_action
  - schedule
$defs:
  TimeRange:
    type: object
    properties:
      start_time:
        type: string
        pattern: ^\d{2}:\d{2}$
        description: H:i
        example: '09:00'
      end_time:
        type: string
        pattern: ^\d{2}:\d{2}$
        description: H:i, after start_time
        example: '17:00'
    required: [start_time, end_time]
  Day:
    type: object
    properties:
      enabled:
        type: boolean
      time_ranges:
        type:
          - array
          - 'null'
        items:
          $ref: '#/$defs/TimeRange'
    required: [enabled]
  Action:
    type: object
    properties:
      type:
        type: string
        enum: [extension, ring_group, conference_room, ivr_menu, ai_assistant, ai_load_balancer, call_queue, unavailable]
        description: '`unavailable` is rejected on create (422) and accepted on update'
      target_id:
        type: string
        maxLength: 255
    required: [type, target_id]
