type: object
description: AI Assistant
properties:
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Support Bot
  description:
    type:
      - string
      - 'null'
  status:
    type: string
    enum: [active, inactive]
  provider:
    type: string
    description: Provider key from the provider registry
    example: openai
  protocol:
    type:
      - string
      - 'null'
    enum: [sip, websocket, dummy, null]
    description: Derived from the provider
  configuration:
    type:
      - object
      - 'null'
    description: Provider-specific configuration
    additionalProperties: true
  usage_count:
    type: integer
    description: Show endpoint only. Number of extensions in `used_by_extensions` (the show endpoint loads at most 10).
  used_by_extensions:
    type: array
    description: Show endpoint only, omitted when no extension uses the assistant. At most 10 extensions.
    items:
      type: object
      properties:
        id:
          type: integer
        extension_number:
          type: string
        type:
          type: string
        status:
          type: string
        user:
          type: object
          description: Omitted when the extension has no user
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
  created_by:
    type: object
    description: Create and update responses only (when the creator is known)
    properties:
      id:
        type: integer
      name:
        type: string
  updated_by:
    type: object
    description: Create and update responses only (when the updater is known)
    properties:
      id:
        type: integer
      name:
        type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - provider
  - status
