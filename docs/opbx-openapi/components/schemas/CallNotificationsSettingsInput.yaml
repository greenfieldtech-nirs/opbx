type: object
description: Call notifications settings request. On create, webhook_url, auth_method and enabled_events are required.
properties:
  webhook_url:
    type: string
    format: uri
    maxLength: 2048
    description: Public http(s) URL
  auth_method:
    type: string
    enum: [bearer_token, basic_auth, none]
  auth_secret:
    type:
    - string
    - 'null'
    minLength: 16
    maxLength: 512
    description: Required on create when auth_method is bearer_token
  auth_username:
    type:
    - string
    - 'null'
    maxLength: 255
    description: Required on create when auth_method is basic_auth
  retry_attempts:
    type:
    - integer
    - 'null'
    minimum: 1
    maximum: 10
  retry_backoff_seconds:
    type:
    - integer
    - 'null'
    minimum: 10
    maximum: 3600
  request_timeout_seconds:
    type:
    - integer
    - 'null'
    minimum: 5
    maximum: 120
  enabled_events:
    type: array
    minItems: 1
    items:
      type: string
      enum: [new, ringing, connected, answered, busy, cancel, failed, congestion]
  rate_limit_per_minute:
    type:
    - integer
    - 'null'
    minimum: 100
    maximum: 5000
  is_active:
    type:
    - boolean
    - 'null'
