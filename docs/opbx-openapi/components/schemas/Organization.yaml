type: object
description: >-
  Organization (tenant), as returned by the platform manager endpoints.
properties:
  id:
    type: integer
    description: Unique organization identifier
    readOnly: true
    example: 1
  name:
    type: string
    description: Organization name
    example: Acme Corporation
  slug:
    type: string
    description: URL-friendly identifier
    example: acme-corporation
  status:
    type: string
    enum:
      - active
      - suspended
      - deleted
    description: Organization status
    example: active
  timezone:
    type: string
    description: Default timezone for the organization (IANA identifier, default `UTC`)
    example: America/New_York
  settings:
    type:
    - object
    - 'null'
    description: >-
      Free-form organization settings (JSON). Returned only by the platform manager
      endpoints. Known key: `default_outbound_caller_id_did_id` (organization-wide default
      outbound caller ID, used after the extension's and the whitelist rule's caller ID;
      see `GET /v1/phone-numbers/default-caller-id`).
    additionalProperties: true
  public_queues_token:
    type:
    - string
    - 'null'
    format: uuid
    description: >-
      Token of the public Queues Dashboard link (null when no link was generated).
      Returned only by the platform manager endpoints.
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
  deleted_at:
    type:
    - string
    - 'null'
    format: date-time
    readOnly: true
    description: Soft-delete timestamp (platform manager endpoints only)
required:
  - id
  - name
  - slug
  - status
  - timezone
