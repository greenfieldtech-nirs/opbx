type: object
description: Organization model representing a tenant
properties:
  id:
    type: integer
    description: Unique organization identifier
    readOnly: true
    example: 1
  name:
    type: string
    description: Organization name
    example: Acme Corporation
  slug:
    type: string
    description: URL-friendly identifier
    example: acme-corporation
  status:
    type: string
    enum:
      - active
      - inactive
      - suspended
    description: Organization status
    example: active
  timezone:
    type: string
    description: Default timezone for the organization
    example: America/New_York
  settings:
    type: object
    description: Organization-specific settings
    properties:
      features:
        type: object
        properties:
          call_recording:
            type: boolean
          voicemail:
            type: boolean
          music_on_hold:
            type: boolean
          call_waiting:
            type: boolean
      ui:
        type: object
        properties:
          language:
            type: string
          date_format:
            type: string
          time_format:
            type: string
      pbx:
        type: object
        properties:
          default_extension_length:
            type: integer
          extension_range_start:
            type: string
          extension_range_end:
            type: string
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - name
  - slug
  - status
  - timezone
