type: object
description: Phone Number (DID)
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (saved for future use).
  id:
    type: integer
  organization_id:
    type: integer
  phone_number:
    type: string
    example: '+1987654321'
  label:
    type:
    - string
    - 'null'
    example: Main Line
  status:
    type: string
    enum:
    - active
    - inactive
  routing_type:
    type: string
    enum:
    - extension
    - ring_group
    - ivr_menu
    - unavailable
    - ai_assistant
  routing_target_id:
    type:
    - integer
    - 'null'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
- phone_number
- status
