type: object
description: AI Assistant Load Balancer
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (the destination was deleted). The API rejects `unavailable` when creating a resource (422, "Choose a destination.") and accepts it on update.
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Support Load Balancer
  strategy:
    type: string
    enum: [round_robin, priority, weighted, least_connections]
    example: round_robin
  members:
    type: array
    description: Load balancer members
  status:
    type: string
    enum: [active, inactive]
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - strategy
  - status
