type: object
description: >
  A scoped, long-lived API key. Created by organization Owners only. The key's
  permissions are the sole authorization gate for requests authenticated with it;
  the user role model is not consulted. Keys never expire but can be revoked.
  The plaintext key value is only ever returned once, at creation time.
properties:
  id:
    type: integer
  name:
    type: string
    example: CI deploy key
  permissions:
    type: array
    items:
      $ref: './ApiKeyPermission.yaml'
  last_used_at:
    type: [string, 'null']
    format: date-time
    description: When the key last authenticated a request. Write is throttled to at most once per 5 seconds per key.
  revoked_at:
    type: [string, 'null']
    format: date-time
    description: When the key was revoked. Null for active keys.
  created_at:
    type: [string, 'null']
    format: date-time
required:
  - id
  - name
  - permissions
