type: object
description: Real-time monitor summary for all active campaigns
properties:
  campaigns:
    type: array
    description: List of active and paused campaigns with monitoring data
    items:
      type: object
      properties:
        id:
          type: integer
          description: Campaign ID
          example: 1
        name:
          type: string
          description: Campaign name
          example: Q1 Sales Campaign
        status:
          type: string
          enum:
          - active
          - paused
          description: Campaign status
          example: active
        progress_percentage:
          type: integer
          description: (completed + failed) / total_destinations x 100, rounded; 0 when the campaign has no destinations
          example: 76
        total_destinations:
          type: integer
          description: Destinations across all lists assigned to the campaign
          example: 1000
        completed_calls:
          type: integer
          description: Destinations in `completed` status
          example: 755
        failed_calls:
          type: integer
          description: Destinations in `failed` status
          example: 45
        voicemail_calls:
          type: integer
          description: Calls where the AMD worker detected a voicemail
          example: 12
        pending_calls:
          type: integer
          description: Destinations in `pending` status
          example: 200
        dialing_calls:
          type: integer
          description: Destinations in `dialing` status
          example: 3
        concurrent_active_calls:
          type: integer
          description: Maximum allowed concurrent calls
          example: 10
        active_calls:
          type: integer
          description: Active calls reported by the dialer worker (always 0 for a paused campaign)
          example: 5
        cac_utilization:
          type: number
          format: float
          description: active_calls / concurrent_active_calls x 100, one decimal
          example: 50.0
        rate_limit_status:
          type: object
          properties:
            is_rate_limited:
              type: boolean
              description: True when the campaign is paused with pause_reason `cloudonix_rate_limit`
              example: false
            pause_reason:
              type:
              - string
              - 'null'
              description: Reason for pause
              example: null
            resumes_at:
              type:
              - string
              - 'null'
              format: date-time
              description: When the campaign can resume
              example: null
        caller_id:
          type: string
          description: Campaign caller ID
          example: '+14155551212'
        routing_destination_type:
          type: string
          enum:
          - ai_assistant
          - ai_load_balancer
          - hangup
          description: Routing destination type
          example: ai_assistant
        routing_destination_label:
          type: string
          description: Label of the routing destination type (AI Assistant, AI Load Balancer or Hangup)
          example: AI Assistant
        start_date:
          type: string
          format: date
          description: Campaign start date
          example: '2024-01-01'
        end_date:
          type: string
          format: date
          description: Campaign end date
          example: '2024-12-31'
  totals:
    type: object
    description: Aggregated totals across all campaigns
    properties:
      active_campaigns:
        type: integer
        description: Number of active campaigns
        example: 3
      paused_campaigns:
        type: integer
        description: Number of paused campaigns
        example: 1
      total_active_calls:
        type: integer
        description: Total active calls across all campaigns
        example: 15
      total_cac_capacity:
        type: integer
        description: Total CAC capacity across all campaigns
        example: 50
      overall_utilization:
        type: number
        description: total_active_calls / total_cac_capacity x 100, one decimal (0 when there is no capacity)
        example: 30.0
  worker_health:
    type: object
    description: |
      Dialer worker health, read from the worker's health URL (`DIALER_WORKER_HEALTH_URL`, 5-second timeout).
      The worker reports only its status, so the three counters are 0.
    properties:
      status:
        type: string
        enum:
        - healthy
        - offline
        - unknown
        description: '`healthy` when the health check answers 200, `offline` when it fails, `unknown` when no health URL is configured'
        example: healthy
      active_campaigns:
        type: integer
        description: Taken from the health response when present, otherwise 0
        example: 0
      active_calls:
        type: integer
        description: Taken from the health response when present, otherwise 0
        example: 0
      queue_depth:
        type: integer
        description: Taken from the health response when present, otherwise 0
        example: 0
required:
- campaigns
- totals
- worker_health
