type: object
description: AI assistant create/update request. `protocol` is not accepted; it is derived from the provider.
properties:
  name:
    type: string
    maxLength: 255
    description: Unique within the organization
  description:
    type:
      - string
      - 'null'
    maxLength: 1000
  status:
    type:
      - string
      - 'null'
    enum: [active, inactive, null]
    description: >-
      Defaults to `active` when omitted or null on create. Cannot be null on update. AI
      assistants have no `pending` status; any value other than `active` or `inactive` is a 422.
  provider:
    type: string
    maxLength: 100
    description: Provider key (see `GET /v1/ai-assistant/providers`)
  configuration:
    type: object
    description: |
      Provider-specific configuration, keyed by the provider's `config_fields` names. Must be
      present on create (may be `{}` for providers without required fields).
    additionalProperties: true
