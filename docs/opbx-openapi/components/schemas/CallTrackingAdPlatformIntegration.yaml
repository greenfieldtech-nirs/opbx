type: object
description: Ad platform integration settings for conversion upload
properties:
  organization_id:
    type: integer
    description: ID of the organization these settings belong to
    example: 1
  google_ads:
    type: object
    description: Google Ads conversion upload configuration
    properties:
      enabled:
        type: boolean
        description: Whether Google Ads conversion upload is enabled
        example: true
      is_configured:
        type: boolean
        description: Whether customer ID, developer token, refresh token and conversion action resource name are all stored
        example: true
  meta:
    type: object
    description: Meta (Facebook) pixel conversion configuration
    properties:
      enabled:
        type: boolean
        description: Whether Meta conversion upload is enabled
        example: false
      is_configured:
        type: boolean
        description: Whether the pixel ID and access token are both stored
        example: false
  updated_at:
    type:
    - string
    - 'null'
    format: date-time
    description: Last update timestamp (null when no settings were saved yet)
    example: '2024-01-15T12:00:00Z'
required:
- organization_id
- google_ads
- meta
