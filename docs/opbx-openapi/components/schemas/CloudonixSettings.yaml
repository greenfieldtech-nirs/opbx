type: object
description: >-
  Cloudonix settings as returned by the settings endpoints. Keys are masked: the first 4
  characters, `***`, then the last 4 (a key of 8 characters or fewer is all asterisks).
properties:
  id:
    type: integer
  organization_id:
    type: integer
  domain_uuid:
    type:
    - string
    - 'null'
    format: uuid
  domain_name:
    type:
    - string
    - 'null'
    example: example.cloudonix.io
  domain_api_key:
    type:
    - string
    - 'null'
    description: Cloudonix domain API key, masked
    example: XI12***abcd
  domain_requests_api_key:
    type:
    - string
    - 'null'
    description: Bearer key Cloudonix sends on voice webhooks, masked
  webhook_base_url:
    type:
    - string
    - 'null'
    format: uri
  embed_allowed_domains:
    type: array
    description: Origins allowed to embed the dialer widget (GET only; an empty array when unset)
    items:
      type: string
  no_answer_timeout:
    type: integer
  call_recording_mode:
    type: string
    enum: [disabled, inbound, outbound, internal, inbound_outbound, all]
  recording_format:
    type: string
    enum: [wav, mp3]
  cloudonix_package:
    type:
    - string
    - 'null'
    description: >-
      GET only. The Cloudonix package tier, read live from the domain profile
      (`tenant.billingPlan.package.name`) and cached per organization for one hour; null
      when unknown. Not stored and not accepted on update.
  is_configured:
    type: boolean
    description: True when both `domain_uuid` and `domain_api_key` are set
  has_webhook_auth:
    type: boolean
    description: True when `domain_requests_api_key` is set
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
