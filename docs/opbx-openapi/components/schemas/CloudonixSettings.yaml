type: object
description: Cloudonix Settings as returned by the settings endpoints (keys masked)
properties:
  id:
    type: integer
  organization_id:
    type: integer
  domain_uuid:
    type:
    - string
    - 'null'
    format: uuid
  domain_name:
    type:
    - string
    - 'null'
    example: example.cloudonix.io
  domain_api_key:
    type:
    - string
    - 'null'
    description: Cloudonix domain API key, masked
  domain_requests_api_key:
    type:
    - string
    - 'null'
    description: Bearer key Cloudonix sends on voice webhooks, masked
  webhook_base_url:
    type:
    - string
    - 'null'
    format: uri
  embed_allowed_domains:
    type: array
    description: Origins allowed to embed the dialer widget (GET only)
    items:
      type: string
  no_answer_timeout:
    type: integer
  call_recording_mode:
    type: string
    enum: [disabled, inbound, outbound, internal, inbound_outbound, all]
  recording_format:
    type: string
    enum: [wav, mp3]
  cloudonix_package:
    type:
    - string
    - 'null'
    description: GET only
  is_configured:
    type: boolean
  has_webhook_auth:
    type: boolean
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
