type: object
description: Auto Dialer Campaign for outbound calling with rate limiting and scheduling
properties:
  id:
    type: integer
    description: Unique campaign identifier
    readOnly: true
    example: 1
  organization_id:
    type: integer
    description: ID of the organization this campaign belongs to
    example: 1
  name:
    type: string
    description: Campaign name
    example: Q1 Sales Campaign
  description:
    type:
    - string
    - 'null'
    description: Campaign description
    example: Outbound campaign for Q1 sales leads
  status:
    type: string
    enum:
    - draft
    - active
    - paused
    - completed
    - archived
    description: Current campaign status
    example: active
  status_label:
    type: string
    description: Human-readable status label
    example: Active
  auto_start:
    type: boolean
    description: Whether the campaign should auto-start when ready
    example: false
  routing_destination_type:
    type: string
    enum:
    - ai_assistant
    - ai_load_balancer
    - hangup
    description: Type of destination for connected calls
    example: ai_assistant
  routing_destination_label:
    type: string
    description: Human-readable label for routing destination type
    example: AI Assistant
  routing_destination_id:
    type:
    - integer
    - 'null'
    description: ID of the routing destination (AI assistant or load balancer)
    example: 5
  dial_timeout:
    type: integer
    description: Timeout in seconds for dial attempts
    example: 30
  destination_connect:
    type: string
    enum:
    - connected
    - immediately
    description: When to connect the destination
    example: connected
  caller_id:
    type: string
    description: Default Caller ID in E.164 format (legacy single Caller ID)
    example: '+14155551212'
  caller_id_pool_enabled:
    type: boolean
    description: Whether Caller ID Pooling is enabled
    example: true
  caller_id_strategy:
    type: string
    enum:
    - round_robin
    - random
    - least_recently_used
    description: Distribution strategy for Caller ID Pool
    example: round_robin
  caller_id_strategy_label:
    type: string
    description: Human-readable label for the strategy
    example: Round Robin
  caller_id_pool:
    type: array
    description: Array of Caller IDs in the pool
    items:
      type: object
      properties:
        did_id:
          type: integer
          description: ID of the DID number
          example: 1
        phone_number:
          type: string
          description: Phone number in E.164 format
          example: '+12127773456'
        friendly_name:
          type:
          - string
          - 'null'
          description: Friendly name for the Caller ID
          example: Sales Line 1
        weight:
          type: integer
          description: Weight for distribution (default 1)
          example: 1
  caller_id_stats:
    type: object
    description: Statistics for Caller ID usage
    properties:
      total_calls:
        type: integer
        description: Total calls across all Caller IDs
        example: 150
      by_did:
        type: array
        description: Breakdown per Caller ID
        items:
          type: object
          properties:
            did_id:
              type: integer
              example: 1
            phone_number:
              type: string
              example: '+12127773456'
            friendly_name:
              type:
              - string
              - 'null'
              example: Sales Line 1
            total_calls:
              type: integer
              example: 50
            completed:
              type: integer
              example: 45
            failed:
              type: integer
              example: 5
            success_rate:
              type: number
              format: float
              example: 90.0
  max_dial_attempts:
    type: integer
    minimum: 1
    maximum: 5
    description: Maximum number of dial attempts per destination
    example: 3
  concurrent_active_calls:
    type: integer
    minimum: 1
    maximum: 50
    description: Maximum concurrent active calls (CAC)
    example: 10
  calls_per_second:
    type: integer
    minimum: 1
    maximum: 30
    description: Calls per second rate (CPS)
    example: 1
  max_cac:
    type: integer
    description: Maximum allowed CAC value
    example: 50
  max_cps:
    type: integer
    description: Maximum allowed CPS value
    example: 30
  api_interval_ms:
    type: integer
    description: API interval in milliseconds (1000 / CPS)
    example: 1000
  days_active:
    type: array
    items:
      type: string
    description: Days of the week when campaign is active
    example:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
  start_time:
    type: integer
    description: Start hour (0-23)
    example: 9
  end_time:
    type: integer
    description: End hour (0-23)
    example: 17
  start_date:
    type: string
    format: date
    description: Campaign start date
    example: '2024-01-01'
  end_date:
    type: string
    format: date
    description: Campaign end date
    example: '2024-12-31'
  timezone:
    type: string
    description: Timezone for scheduling
    example: America/New_York
  schedule:
    type: object
    description: Full schedule configuration with daily time ranges
    properties:
      monday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                end_time:
                  type: string
                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
      tuesday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      wednesday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      thursday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      friday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      saturday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      sunday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
  time_limit:
    type:
    - integer
    - 'null'
    description: Maximum call duration in seconds
    example: 300
  record_calls:
    type: boolean
    description: Whether to record calls
    example: true
  amd_enabled:
    type: boolean
    description: Whether answering machine detection is enabled
    example: true
  amd_mode:
    type: string
    enum:
    - Enabled
    - DetectMessageEnd
    description: AMD detection mode
    example: DetectMessageEnd
  amd_timeout:
    type:
    - integer
    - 'null'
    description: AMD timeout in seconds
    example: 30
  amd_speech_threshold:
    type:
    - integer
    - 'null'
    description: AMD speech threshold in milliseconds
    example: 2500
  amd_speech_end_threshold:
    type:
    - integer
    - 'null'
    description: AMD speech end threshold in milliseconds
    example: 2500
  amd_silence_timeout:
    type:
    - integer
    - 'null'
    description: AMD silence timeout in milliseconds
    example: 2500
  statistics:
    type: object
    description: Campaign statistics
    properties:
      total_destinations:
        type: integer
        description: Total number of destinations
        example: 1000
      completed_calls:
        type: integer
        description: Number of completed calls
        example: 750
      failed_calls:
        type: integer
        description: Number of failed calls
        example: 50
      pending_calls:
        type: integer
        description: Number of pending calls
        example: 200
      progress_percentage:
        type: number
        format: float
        description: Campaign progress percentage
        example: 75.0
  started_at:
    type:
    - string
    - 'null'
    format: date-time
    description: When the campaign started
    example: '2024-01-15 09:00:00'
  completed_at:
    type:
    - string
    - 'null'
    format: date-time
    description: When the campaign completed
    example: '2024-01-20 17:00:00'
  is_runnable:
    type: boolean
    description: Whether the campaign can be started
    example: true
  has_list:
    type: boolean
    description: Whether the campaign has a distribution list assigned
    example: true
  created_at:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2024-01-10 08:00:00'
  updated_at:
    type: string
    format: date-time
    description: Last update timestamp
    example: '2024-01-15 12:00:00'
required:
- id
- organization_id
- name
- status
- routing_destination_type
- caller_id
- caller_id_pool_enabled
- caller_id_strategy
- concurrent_active_calls
