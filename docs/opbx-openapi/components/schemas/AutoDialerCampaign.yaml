type: object
description: Auto Dialer Campaign for outbound calling with rate limiting and scheduling
properties:
  id:
    type: integer
    description: Unique campaign identifier
    readOnly: true
    example: 1
  organization_id:
    type: integer
    description: ID of the organization this campaign belongs to
    example: 1
  name:
    type: string
    description: Campaign name
    example: Q1 Sales Campaign
  description:
    type:
    - string
    - 'null'
    description: Campaign description
    example: Outbound campaign for Q1 sales leads
  status:
    type: string
    enum:
    - draft
    - active
    - paused
    - completed
    - archived
    description: Current campaign status
    example: active
  status_label:
    type: string
    description: Human-readable status label (Draft, Active, Paused, Completed, Archived)
    example: Active
  auto_start:
    type: boolean
    description: Whether the campaign should auto-start when ready
    example: false
  routing_destination_type:
    type: string
    enum:
    - ai_assistant
    - ai_load_balancer
    - ring_group
    - call_queue
    - hangup
    description: Type of destination for connected calls
    example: ai_assistant
  routing_destination_label:
    type: string
    description: Label of the routing destination type (AI Assistant, AI Load Balancer, Hangup)
    example: AI Assistant
  routing_destination_id:
    type:
    - integer
    - 'null'
    description: ID of the routing destination (AI assistant or load balancer)
    example: 5
  dial_timeout:
    type: integer
    description: Timeout in seconds for dial attempts
    example: 30
  destination_connect:
    type: string
    enum:
    - connected
    - immediately
    description: When to connect the destination
    example: connected
  caller_id:
    type: string
    description: Default Caller ID in E.164 format (legacy single Caller ID)
    example: '+14155551212'
  caller_id_pool_enabled:
    type: boolean
    description: Whether Caller ID Pooling is enabled (always true for campaigns created through the API)
    example: true
  caller_id_strategy:
    type: string
    enum:
    - round_robin
    - random
    - least_recently_used
    description: Distribution strategy for Caller ID Pool
    example: round_robin
  caller_id_strategy_label:
    type: string
    description: Human-readable label for the strategy (Round Robin, Random, Least Recently Used)
    example: Round Robin
  caller_id_pool:
    type: array
    description: |
      Caller IDs in the pool. Filled by list, get, create and update; the start, pause,
      resume and archive responses (and the dialer worker endpoints) return an empty array.
    items:
      type: object
      properties:
        did_id:
          type: integer
          description: ID of the DID number
          example: 1
        phone_number:
          type: string
          description: Phone number in E.164 format
          example: '+12127773456'
        friendly_name:
          type:
          - string
          - 'null'
          description: Friendly name for the Caller ID
          example: Sales Line 1
        weight:
          type: integer
          description: Weight for distribution (default 1)
          example: 1
  max_dial_attempts:
    type: integer
    minimum: 1
    maximum: 5
    description: Maximum number of dial attempts per destination
    example: 3
  concurrent_active_calls:
    type: integer
    minimum: 1
    maximum: 50
    description: Maximum concurrent active calls (CAC)
    example: 10
  calls_per_second:
    type: integer
    minimum: 1
    maximum: 30
    description: Calls per second rate (CPS)
    example: 1
  max_cac:
    type: integer
    description: Maximum allowed CAC value
    example: 50
  max_cps:
    type: integer
    description: Maximum allowed CPS value
    example: 30
  api_interval_ms:
    type: number
    description: API interval in milliseconds (1000 / CPS)
    example: 1000
  days_active:
    type: array
    items:
      type: string
    description: Legacy. Days whose `schedule` entry is enabled (derived from `schedule` on create and on any update that sends it)
    example:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
  start_time:
    type:
    - integer
    - 'null'
    description: Legacy. Hour of the first time range of the first enabled day in `schedule` (9 when there is none)
    example: 9
  end_time:
    type:
    - integer
    - 'null'
    description: Legacy. Hour of the end of that same time range (17 when there is none)
    example: 17
  start_date:
    type: string
    format: date
    description: Campaign start date
    example: '2024-01-01'
  end_date:
    type: string
    format: date
    description: Campaign end date
    example: '2024-12-31'
  timezone:
    type: string
    description: Timezone for scheduling
    example: America/New_York
  schedule:
    type:
    - object
    - 'null'
    description: Full schedule configuration with daily time ranges (in `timezone`). Calls are placed only while the current time falls inside an enabled day's range; an end_time of 24:00 means 23:59
    properties:
      monday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                end_time:
                  type: string
                  pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
      tuesday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      wednesday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      thursday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      friday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      saturday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
      sunday:
        type: object
        properties:
          enabled:
            type: boolean
          time_ranges:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
  time_limit:
    type: integer
    description: Maximum call duration in seconds (600 when not defined, on create or when set to null on update)
    example: 300
  record_calls:
    type: boolean
    description: Whether to record calls
    example: true
  wait_for_available_agents:
    type: boolean
    default: false
    description: "Call queue campaigns only: while no agent of the queue is available, the dialer places no new calls"
    example: false
  action_voicemail:
    type:
    - string
    - 'null'
    enum: [HANGUP, CONTINUE, null]
    description: What to do when the AMD worker detects a voicemail. With AMD on (any action set), an empty or null action means HANGUP at call time
  action_human:
    type:
    - string
    - 'null'
    enum: [HANGUP, CONTINUE, null]
    description: What to do when a human answers. With AMD on (any action set), an empty or null action means HANGUP at call time
  action_unknown:
    type:
    - string
    - 'null'
    enum: [HANGUP, CONTINUE, null]
    description: What to do when detection is inconclusive. With AMD on (any action set), an empty or null action means HANGUP at call time
  retry_on_voicemail:
    type: boolean
    description: Retry the destination when a voicemail was detected
  retry_on_busy_no_answer:
    type: boolean
    description: Redial busy and no-answer destinations after the retry delay, within max_dial_attempts (default false). Cancelled and failed calls are never retried.
  retry_delay_minutes:
    type: integer
    minimum: 1
    maximum: 1440
    description: Minutes to wait before the FIRST busy / no-answer retry (default 15). Each further retry waits twice as long as the previous one (delay x 2^(attempt-1)), capped at 1440 minutes (24 hours).
  lists_count:
    type: integer
    description: Number of distribution lists assigned. Only the list endpoint counts them; every other response returns 0
  statistics:
    type: object
    description: Campaign statistics
    properties:
      total_destinations:
        type: integer
        description: Total number of destinations
        example: 1000
      completed_calls:
        type: integer
        description: Number of completed calls
        example: 750
      failed_calls:
        type: integer
        description: Number of failed calls
        example: 50
      voicemail_calls:
        type: integer
        description: Number of calls where the AMD worker detected a voicemail
        example: 20
      pending_calls:
        type: integer
        description: Number of pending calls
        example: 200
      progress_percentage:
        type: integer
        description: (completed_calls + failed_calls) / total_destinations x 100, rounded; 0 when total_destinations is 0
        example: 80
  started_at:
    type:
    - string
    - 'null'
    description: When the campaign was last started (`YYYY-MM-DD HH:MM:SS`, UTC)
    example: '2024-01-15 09:00:00'
  completed_at:
    type:
    - string
    - 'null'
    description: When the campaign completed (`YYYY-MM-DD HH:MM:SS`, UTC)
    example: '2024-01-20 17:00:00'
  is_runnable:
    type: boolean
    description: True when the campaign is `active` and, in its timezone, today is within start_date..end_date and the current time is inside an enabled `schedule` range
    example: true
  has_list:
    type: boolean
    description: Whether at least one distribution list is assigned to the campaign
    example: true
  created_at:
    type: string
    description: Creation timestamp (`YYYY-MM-DD HH:MM:SS`, UTC)
    example: '2024-01-10 08:00:00'
  updated_at:
    type: string
    description: Last update timestamp (`YYYY-MM-DD HH:MM:SS`, UTC)
    example: '2024-01-15 12:00:00'
required:
- id
- organization_id
- name
- status
- routing_destination_type
- caller_id
- caller_id_pool_enabled
- caller_id_strategy
- concurrent_active_calls
