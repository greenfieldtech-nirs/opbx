type: object
description: Ring Group for call distribution
properties:
  id:
    type: integer
    readOnly: true
    example: 789
  organization_id:
    type: integer
    example: 1
  name:
    type: string
    description: Ring group name
    example: Sales Team
  description:
    type: string
    nullable: true
    description: Optional description
    example: Main sales department ring group
  strategy:
    type: string
    enum:
      - simultaneous
      - round_robin
      - priority
      - weighted
      - memory
    description: Ring strategy
    example: simultaneous
  timeout:
    type: integer
    description: Ring timeout in seconds
    example: 30
  ring_turns:
    type: integer
    description: Number of ring cycles before fallback (for round_robin)
    example: 2
  fallback_action:
    type: string
    enum:
      - voicemail
      - extension
      - ring_group
      - ivr_menu
      - ai_assistant
      - ai_load_balancer
      - disconnect
    description: Action when no members answer
    example: voicemail
  fallback_extension_id:
    type: integer
    nullable: true
    description: Extension ID for fallback
  fallback_ring_group_id:
    type: integer
    nullable: true
    description: Ring group ID for fallback
  fallback_ivr_menu_id:
    type: integer
    nullable: true
    description: IVR menu ID for fallback
  fallback_ai_assistant_id:
    type: integer
    nullable: true
    description: AI assistant ID for fallback
  fallback_ai_load_balancer_id:
    type: integer
    nullable: true
    description: AI load balancer ID for fallback
  status:
    type: string
    enum:
      - active
      - inactive
    example: active
  members:
    type: array
    description: Ring group members
    items:
      type: object
      properties:
        id:
          type: integer
        extension_id:
          type: integer
        priority:
          type: integer
        weight:
          type: integer
        extension:
          $ref: './Extension.yaml'
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - organization_id
  - name
  - strategy
  - status
