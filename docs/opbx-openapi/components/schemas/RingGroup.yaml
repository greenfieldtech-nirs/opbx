type: object
description: Ring Group for call distribution
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (the destination was deleted). The API rejects `unavailable` when creating a resource (422, "Choose a destination.") and accepts it on update.
  id:
    type: integer
    readOnly: true
    example: 789
  organization_id:
    type: integer
    example: 1
  name:
    type: string
    description: Ring group name
    example: Sales Team
  description:
    type:
    - string
    - 'null'
    description: Optional description
    example: Main sales department ring group
  strategy:
    type: string
    enum:
    - simultaneous
    - round_robin
    - sequential
    description: Ring strategy
    example: simultaneous
  timeout:
    type: integer
    description: Ring timeout in seconds
    example: 30
  ring_turns:
    type: integer
    description: Number of ring cycles before fallback (for round_robin)
    example: 2
  fallback_action:
    type: string
    enum:
    - extension
    - ring_group
    - ivr_menu
    - ai_assistant
    - ai_load_balancer
    - call_queue
    - hangup
    - unavailable
    description: Action when no members answer
    example: hangup
  fallback_extension_id:
    type:
    - integer
    - 'null'
    description: Extension ID for fallback
  fallback_ring_group_id:
    type:
    - integer
    - 'null'
    description: Ring group ID for fallback
  fallback_ivr_menu_id:
    type:
    - integer
    - 'null'
    description: IVR menu ID for fallback
  fallback_ai_assistant_id:
    type:
    - integer
    - 'null'
    description: AI assistant ID for fallback
  fallback_ai_load_balancer_id:
    type:
    - integer
    - 'null'
    description: AI load balancer ID for fallback
  fallback_call_queue_id:
    type:
    - integer
    - 'null'
    description: Call queue ID for fallback
  status:
    type: string
    enum:
    - active
    - inactive
    example: active
  members:
    type: array
    description: Ring group members ordered by priority (present when loaded)
    items:
      type: object
      properties:
        id:
          type: integer
        extension_id:
          type: integer
        extension_number:
          type:
          - string
          - 'null'
        user_name:
          type:
          - string
          - 'null'
        priority:
          type: integer
  members_count:
    type: integer
    description: Number of members (list only)
  active_members_count:
    type: integer
    description: Members whose extension is active (list only)
  fallback_extension:
    type: object
    description: Fallback extension summary (present when loaded)
    properties:
      id:
        type: integer
      extension_number:
        type: string
  fallback_ai_load_balancer:
    type: object
    description: Fallback AI load balancer summary (present when loaded)
    properties:
      id:
        type: integer
      name:
        type: string
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
required:
- id
- organization_id
- name
- strategy
- status
