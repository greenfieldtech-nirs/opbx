type: object
description: Validation error response with field-level errors
properties:
  message:
    type: string
    description: The first validation error, followed by `(and N more error[s])` when there are more
    example: The email field is required. (and 1 more error)
  errors:
    type: object
    description: Field-level validation errors
    additionalProperties:
      type: array
      items:
        type: string
    example:
      email:
        - The email field is required.
      password:
        - The password field must be at least 8 characters.
required:
  - message
  - errors
