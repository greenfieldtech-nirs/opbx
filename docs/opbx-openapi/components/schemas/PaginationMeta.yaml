type: object
description: Pagination metadata for list responses
title: PaginationMeta
properties:
  current_page:
    type: integer
    description: Current page number
    example: 1
  per_page:
    type: integer
    description: Number of items per page
    example: 20
  total:
    type: integer
    description: Total number of items
    example: 150
  last_page:
    type: integer
    description: Last available page number
    example: 8
  from:
    type: integer
    nullable: true
    description: Index of first item on current page
    example: 1
  to:
    type: integer
    nullable: true
    description: Index of last item on current page
    example: 20
required:
  - current_page
  - per_page
  - total
  - last_page
