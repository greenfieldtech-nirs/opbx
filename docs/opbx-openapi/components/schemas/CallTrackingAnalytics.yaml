type: object
description: Aggregated call tracking analytics for a date range
properties:
  kpis:
    type: object
    description: Key performance indicators for the selected date range
    properties:
      total_calls:
        type: integer
        example: 150
      unique_callers:
        type: integer
        description: Distinct caller numbers
        example: 110
      answered_calls:
        type: integer
        example: 120
      missed_calls:
        type: integer
        example: 30
      average_duration:
        type: number
        description: Average call duration in seconds
        example: 84.2
      conversions:
        type: integer
        example: 98
      conversion_rate:
        type: number
        description: Conversions as a percentage of total calls (0-100)
        example: 65.33
    required:
    - total_calls
    - unique_callers
    - answered_calls
    - missed_calls
    - average_duration
    - conversions
    - conversion_rate
  time_series:
    type: array
    description: Calls and conversions per period, oldest first. Periods without calls are omitted.
    items:
      type: object
      properties:
        date_key:
          type: string
          description: Period key; `YYYY-MM-DD` for day, ISO `YYYY-WW` for week, `YYYY-MM` for month
          example: '2024-01-15'
        calls:
          type: integer
          example: 50
        conversions:
          type: integer
          example: 28
      required:
      - date_key
      - calls
      - conversions
  top_campaigns:
    type: array
    description: Up to 10 campaigns with the most calls
    items:
      type: object
      properties:
        campaign_id:
          type: integer
          example: 5
        campaign_name:
          type: string
          description: Campaign name recorded on the sessions
          example: Google Ads - Spring Sale
        calls:
          type: integer
          example: 100
        conversions:
          type: integer
          example: 65
      required:
      - campaign_id
      - campaign_name
      - calls
      - conversions
  top_sources:
    type: array
    description: Up to 10 marketing sources with the most calls (a missing source is returned as an empty string)
    items:
      type: object
      properties:
        source:
          type: string
          example: google
        calls:
          type: integer
          example: 80
        conversions:
          type: integer
          example: 52
      required:
      - source
      - calls
      - conversions
  filters:
    type: object
    description: Filters applied to the analytics query
    properties:
      start_date:
        type: string
        format: date
        description: Start date of the analytics range
        example: '2024-01-01'
      end_date:
        type: string
        format: date
        description: End date of the analytics range
        example: '2024-01-31'
      group_by:
        type: string
        enum:
        - day
        - week
        - month
        description: Time grouping applied to the time series
        example: day
required:
- kpis
- time_series
- top_campaigns
- top_sources
- filters
