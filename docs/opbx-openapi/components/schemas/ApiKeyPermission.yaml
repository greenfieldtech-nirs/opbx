type: object
description: A single resource grant on an API key. `write` implies `read`; `read` permits GET/HEAD only.
properties:
  resource:
    type: string
    description: Grantable resource slug (see GET /v1/api-keys/grantable-resources).
    enum:
      - users
      - extensions
      - conference-rooms
      - ai-assistants
      - ai-assistant-providers
      - ring-groups
      - call-queues
      - queue-calls
      - ai-assistant-load-balancers
      - ivr-menus
      - business-hours
      - phone-numbers
      - outbound-whitelist
      - inbound-blacklist
      - call-detail-records
      - recordings
      - call-tracking-campaigns
      - call-tracking-analytics
      - call-tracking-sessions
      - call-tracking-ad-platform-integrations
      - supervisors
      - auto-dialer-campaigns
      - distribution-lists
      - session-updates
      - call-notifications
      - dashboard
      - trunks
    example: business-hours
  level:
    type: string
    enum: [read, write]
    example: write
required:
  - resource
  - level
