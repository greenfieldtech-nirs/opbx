type: object
description: Call queue (ACD) with agent management and statistics
properties:
  is_unprovisioned:
    type: boolean
    readOnly: true
    description: True when any route of this resource is `unavailable` (the destination was deleted). The API rejects `unavailable` when creating a resource (422, "Choose a destination.") and accepts it on update.
  id:
    type: integer
    readOnly: true
    example: 12
  organization_id:
    type: integer
    example: 1
  name:
    type: string
    description: Queue name (unique within the organization)
    example: Support Queue
  description:
    type:
      - string
      - 'null'
    example: Tier-1 support
  strategy:
    type: string
    enum:
      - ring_all
      - round_robin
      - least_talk_time
      - fewest_calls
    description: Agent selection strategy
    example: ring_all
  agent_ring_timeout:
    type: integer
    description: Seconds to ring an agent per dial attempt
    example: 20
  max_wait_seconds:
    type: integer
    description: Maximum caller wait before overflow to the fallback destination
    example: 300
  wrap_up_seconds:
    type: integer
    description: Post-call agent pause
    example: 15
  announce_position:
    type: boolean
    description: Periodically announce the caller's queue position
  announce_position_timeout:
    type:
      - integer
      - 'null'
    description: Seconds between position announcements
  announce_position_language:
    type:
      - string
      - 'null'
  immediate_connect:
    type: boolean
  conference_ring_all:
    type: boolean
  moh_recording_id:
    type:
      - integer
      - 'null'
    description: Hold music recording (must be tagged is_moh)
    example: 42
  fallback_action:
    type: string
    enum:
      - extension
      - ring_group
      - ivr_menu
      - ai_assistant
      - ai_load_balancer
      - call_queue
      - hangup
      - unavailable
    example: extension
    description: Only the fallback_*_id matching this action is set; the others are null.
  fallback_extension_id:
    type:
      - integer
      - 'null'
  fallback_ring_group_id:
    type:
      - integer
      - 'null'
  fallback_ivr_menu_id:
    type:
      - integer
      - 'null'
  fallback_ai_assistant_id:
    type:
      - integer
      - 'null'
  fallback_ai_load_balancer_id:
    type:
      - integer
      - 'null'
  status:
    type: string
    enum:
      - active
      - inactive
    example: active
  agents:
    type: array
    description: Agent users. Not included in the toggle-status response.
    items:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        name:
          type: string
        extension_id:
          type:
            - integer
            - 'null'
        extension_number:
          type:
            - string
            - 'null'
  agents_count:
    type: integer
    description: List endpoint only
    example: 5
  moh_recording:
    $ref: '#/$defs/Ref'
    description: Hold music recording summary (`id`, `name`); null when none. Not included in the toggle-status response.
  fallback_extension:
    $ref: '#/$defs/Ref'
  fallback_ring_group:
    $ref: '#/$defs/Ref'
  fallback_ivr_menu:
    $ref: '#/$defs/Ref'
  fallback_ai_assistant:
    $ref: '#/$defs/Ref'
    description: |
      List endpoint only (as are `fallback_extension`, `fallback_ring_group` and
      `fallback_ivr_menu`). Null when that target is not set. There is no
      `fallback_ai_load_balancer` summary; use `fallback_ai_load_balancer_id`.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
$defs:
  Ref:
    type:
      - object
      - 'null'
    description: Related resource summary; `fallback_extension` carries `extension_number`, the others `name`
    properties:
      id:
        type: integer
      name:
        type: string
      extension_number:
        type: string
