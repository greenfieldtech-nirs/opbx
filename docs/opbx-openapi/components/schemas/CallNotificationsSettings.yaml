type: object
description: Call Notifications Settings
properties:
  id:
    type: integer
  organization_id:
    type: integer
  webhook_url:
    type:
    - string
    - 'null'
    format: uri
  events:
    type: array
    items:
      type: string
      enum:
      - call.initiated
      - call.answered
      - call.completed
      - call.missed
  enabled:
    type: boolean
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- id
- organization_id
- enabled
