type: object
description: Detailed monitor view for a single campaign
properties:
  campaign:
    type: object
    description: Campaign overview
    properties:
      id:
        type: integer
        description: Campaign ID
        example: 1
      name:
        type: string
        description: Campaign name
        example: Q1 Sales Campaign
      status:
        type: string
        enum:
        - active
        - paused
        - draft
        - completed
        - archived
        description: Campaign status
        example: active
      concurrent_active_calls:
        type: integer
        description: Maximum allowed concurrent calls
        example: 10
      active_calls:
        type: integer
        description: Active calls reported by the dialer worker (always 0 for a paused campaign)
        example: 5
      cac_utilization:
        type: number
        format: float
        description: active_calls / concurrent_active_calls x 100, one decimal
        example: 50.0
  statistics:
    type: object
    description: Campaign statistics
    properties:
      total_destinations:
        type: integer
        description: Destinations across all lists assigned to the campaign
        example: 1000
      completed_calls:
        type: integer
        description: Destinations in `completed` status
        example: 755
      failed_calls:
        type: integer
        description: Destinations in `failed` status
        example: 45
      voicemail_calls:
        type: integer
        description: Calls where the AMD worker detected a voicemail
        example: 12
      pending_calls:
        type: integer
        description: Destinations in `pending` status
        example: 200
      dialing_calls:
        type: integer
        description: Destinations in `dialing` status
        example: 3
      progress_percentage:
        type: integer
        description: (completed + failed) / total_destinations x 100, rounded; 0 when the campaign has no destinations
        example: 80
      avg_duration_seconds:
        type: integer
        description: Average duration of completed call sessions with a duration above 0 (rounded; 0 when none)
        example: 120
      avg_billsec_seconds:
        type: integer
        description: Average billable seconds of completed call sessions with billsec above 0 (rounded; 0 when none)
        example: 95
  dispositions:
    type: object
    description: |
      Call session dispositions, counted per session. Cloudonix spellings are normalized
      (`answer` -> answered, `no-answer`/`noanswer` -> no_answer, `cancel` -> cancelled);
      other dispositions are not counted. Every key is always present.
    properties:
      answered:
        type: integer
        description: Number of answered calls
        example: 700
      completed:
        type: integer
        description: Number of completed calls
        example: 650
      busy:
        type: integer
        description: Number of busy signals
        example: 25
      no_answer:
        type: integer
        description: Number of no-answer calls
        example: 50
      failed:
        type: integer
        description: Number of failed calls
        example: 30
      cancelled:
        type: integer
        description: Number of cancelled calls
        example: 10
      congestion:
        type: integer
        description: Number of congestion errors
        example: 5
  active_sessions:
    type: array
    description: |
      Call sessions in `initiated`, `ringing` or `answered` status that started in the last
      5 minutes, newest first. Never cached. Always empty for a paused campaign.
    items:
      type: object
      properties:
        id:
          type: integer
          description: Session ID
          example: 123
        phone_number:
          type:
          - string
          - 'null'
          description: Destination phone number
          example: '+14155551212'
        status:
          type: string
          enum:
          - initiated
          - ringing
          - answered
          description: Current call status
          example: answered
        call_id:
          type:
          - string
          - 'null'
          description: Cloudonix call ID (null until the call is placed)
          example: call-abc123
        initiated_at:
          type: string
          format: date-time
          description: When the call was initiated
          example: '2024-01-15T14:30:00Z'
        duration_seconds:
          type: integer
          description: Seconds since initiated_at
          example: 45
required:
- campaign
- statistics
- dispositions
- active_sessions
