type: object
description: Extension model representing a PBX extension
title: Extension
properties:
  id:
    type: integer
    description: Unique extension identifier
    readOnly: true
    example: 456
  organization_id:
    type: integer
    description: ID of the organization
    example: 1
  user_id:
    type:
    - integer
    - 'null'
    description: ID of the assigned user (for USER type extensions)
    example: 123
  ai_assistant_id:
    type:
    - integer
    - 'null'
    description: ID of the assigned AI assistant
  extension_number:
    type: string
    description: The extension number (e.g., 1001)
    example: '1001'
  name:
    type: string
    description: Name of the assigned user, or `Unassigned` when no user is assigned
    example: John Doe
  type:
    type: string
    enum:
    - user
    - conference
    - ring_group
    - ivr
    - ai_assistant
    - custom_logic
    - forward
    - queue
    - ai_load_balancer
    description: Extension type
    example: user
  status:
    type: string
    enum:
    - active
    - inactive
    - pending
    description: Extension status
    example: active
  voicemail_enabled:
    type: boolean
    description: Whether voicemail is enabled (USER type only)
    example: true
  configuration:
    type: object
    description: Type-specific configuration (see the create request for the keys each type uses)
    additionalProperties: true
    example:
      forward_to: '+1234567890'
  sip_config:
    type: object
    description: >-
      SIP registration metadata. Present only on `user` extensions. The password is never
      included; read it with `GET /v1/extensions/{extension}/password`.
    properties:
      username:
        type: string
        example: '1001'
      server:
        type: string
        example: sip.cloudonix.io
  user:
    description: Assigned user (present when loaded)
    $ref: ./User.yaml
  ai_assistant:
    description: Assigned AI assistant (present when loaded; null when none)
    oneOf:
    - $ref: ./AiAssistant.yaml
    - type: 'null'
  ai_load_balancer:
    type:
    - object
    - 'null'
    properties:
      id:
        type: integer
      name:
        type: string
      strategy:
        type: string
      members:
        type: array
        items:
          type: object
          properties:
            ai_assistant_id:
              type: integer
            ai_assistant_name:
              type:
              - string
              - 'null'
            priority:
              type: integer
            weight:
              type: integer
            position:
              type: integer
            status:
              type: string
  default_caller_id_did_id:
    type:
    - integer
    - 'null'
    description: >-
      ID of an active DID owned by the organization to present as the caller ID when
      this extension places an outbound call. Takes precedence over the matched
      outbound whitelist rule's caller ID. See the Outbound Calling Overview.
  default_caller_id:
    type:
    - object
    - 'null'
    description: Nested DID summary, present only when the relationship is loaded.
    properties:
      id:
        type: integer
      phone_number:
        type: string
      friendly_name:
        type:
        - string
        - 'null'
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
required:
- id
- organization_id
- extension_number
- type
- status
