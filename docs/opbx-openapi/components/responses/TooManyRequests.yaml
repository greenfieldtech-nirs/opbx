description: |
  Too Many Requests - Rate limit exceeded. The per-organization API limiter answers
  `Maximum <n> requests per <m> minute(s) allowed`; named throttles (`auth`, `sensitive`,
  and so on) answer with their own `error` and `message` text. Every 429 carries
  `retry_after` and a `Retry-After` header.
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: Rate limit exceeded
      message: Maximum 60 requests per 1 minute(s) allowed
      retry_after: 60
headers:
  X-RateLimit-Limit:
    $ref: ../headers/X-RateLimit-Limit.yaml
  X-RateLimit-Remaining:
    $ref: ../headers/X-RateLimit-Remaining.yaml
  X-RateLimit-Reset:
    $ref: ../headers/X-RateLimit-Reset.yaml
  Retry-After:
    schema:
      type: integer
    description: Seconds to wait before retrying
    example: 60
