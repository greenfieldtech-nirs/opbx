paths:
  /v1/platform/users:
    get:
      tags:
        - Platform
      summary: List all users (cross-tenant)
      operationId: listAllUsers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: organization_id
          in: query
          schema:
            type: integer
        - name: is_platform_manager
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
          description: Name or email
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, pbx_admin, pbx_user, reporter, supervisor]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, email, status, is_platform_manager, created_at]
            default: created_at
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Users across all organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: User (id, organization_id, name, email, role, status, is_platform_manager, created_at)
                      properties:
                        id:
                          type: integer
                        organization_id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        status:
                          type: string
                        is_platform_manager:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                  meta:
                    allOf:
                      - $ref: '../../components/schemas/PaginationMeta.yaml'
                      - type: object
                        properties:
                          has_more:
                            type: boolean
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
  
  /v1/platform/users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - Platform
      summary: Get user details
      operationId: getPlatformUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User (serialized model)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/User.yaml'
    
    put:
      tags:
        - Platform
      summary: Update user
      operationId: updatePlatformUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  format: password
                  minLength: 8
                role:
                  type: string
                  enum: [owner, pbx_admin, pbx_user, reporter, supervisor]
                status:
                  type:
                    - string
                    - 'null'
                  enum: [active, inactive, pending, null]
                  description: Defaults to active
                phone:
                  type:
                    - string
                    - 'null'
                  maxLength: 50
                street_address:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                city:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
                state_province:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
                postal_code:
                  type:
                    - string
                    - 'null'
                  maxLength: 20
                country:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/User.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    delete:
      tags:
        - Platform
      summary: Delete user
      operationId: deletePlatformUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Cannot delete yourself or the last owner of an organization

  /v1/platform/users/{user}/password:
    parameters:
      - name: user
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Platform
      summary: Update user password
      description: |
        Update a user's password (platform manager only).
        
        Allows platform managers to reset passwords for any user
        across all organizations.
      operationId: updatePlatformUserPassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: |
                    New password requirements:
                    - At least 8 characters
                    - Upper and lowercase letters
                    - At least one number
                  example: "NewSecurePass123"
                password_confirmation:
                  type: string
                  format: password
                  description: Password confirmation (must match password)
                  example: "NewSecurePass123"
              required:
                - password
                - password_confirmation
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password updated successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
