paths:
  /v1/platform/users:
    get:
      tags:
        - Platform
      summary: List all users (cross-tenant)
      description: |
        Users of every organization, each with its `organization` (`id`, `name`, `slug`).
        Platform managers only. `per_page` defaults to 25 (max 100). An unknown `sort_by`
        leaves the result unsorted; any `sort_direction` other than `asc` sorts descending.
      operationId: listAllUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: organization_id
          in: query
          schema:
            type: integer
        - name: is_platform_manager
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
          description: Substring match on name or email
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, pbx_admin, pbx_user, reporter, supervisor]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, email, status, is_platform_manager, created_at]
            default: created_at
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Users across all organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: User (id, organization_id, name, email, role, status, is_platform_manager, created_at, organization)
                      properties:
                        id:
                          type: integer
                        organization_id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        status:
                          type: string
                        is_platform_manager:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        organization:
                          type:
                            - object
                            - 'null'
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            slug:
                              type: string
                  meta:
                    allOf:
                      - $ref: '../../components/schemas/PaginationMeta.yaml'
                      - type: object
                        properties:
                          has_more:
                            type: boolean
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
  
  /v1/platform/users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - Platform
      summary: Get user details
      description: Any user in any organization, with its `organization` (`id`, `name`, `slug`). Platform managers only.
      operationId: getPlatformUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User (serialized model, without `password` and `remember_token`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '../../components/schemas/User.yaml'
                      - type: object
                        properties:
                          organization:
                            type:
                              - object
                              - 'null'
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              slug:
                                type: string
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
        '404':
          $ref: '../../components/responses/NotFound.yaml'
    
    put:
      tags:
        - Platform
      summary: Update user
      description: |
        Updates any user in any organization. Platform managers only. Every field is
        optional; omitted fields are unchanged. A `password` is hashed before it is stored.
        Writes a `user.updated` audit log entry.
      operationId: updatePlatformUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  format: password
                  minLength: 8
                role:
                  type: string
                  enum: [owner, pbx_admin, pbx_user, reporter, supervisor]
                status:
                  type: string
                  enum: [active, inactive, pending]
                phone:
                  type:
                    - string
                    - 'null'
                  maxLength: 50
                street_address:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                city:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
                state_province:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
                postal_code:
                  type:
                    - string
                    - 'null'
                  maxLength: 20
                country:
                  type:
                    - string
                    - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/User.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    delete:
      tags:
        - Platform
      summary: Delete user
      description: |
        Deletes any user in any organization. Platform managers only. Inside one
        transaction it first applies the deletion impact (see
        `GET /v1/platform/users/{user}/delete-impact`), then deletes the user. Writes a
        `user.deleted` audit log entry.
      operationId: deletePlatformUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          description: Cannot delete yourself, or the user is the last owner of the organization
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Cannot delete the last owner of an organization.

  /v1/platform/users/{user}/password:
    parameters:
      - name: user
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Platform
      summary: Update user password
      description: |
        Sets the password of any user in any organization (platform managers only).
        Writes a `user.password.updated` audit log entry.
      operationId: updatePlatformUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: New password, at least 8 characters
                  example: "NewSecurePass123"
                password_confirmation:
                  type: string
                  format: password
                  description: Password confirmation (must match password)
                  example: "NewSecurePass123"
              required:
                - password
                - password_confirmation
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password updated successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
