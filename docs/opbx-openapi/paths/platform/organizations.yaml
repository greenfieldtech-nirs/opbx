paths:
  /v1/platform/organizations:
    get:
      tags:
        - Platform
      summary: List all organizations
      description: |
        All organizations with user, extension and DID counts. Platform managers only.
        `per_page` defaults to 25 (max 100). An unknown `sort_by` value leaves the
        result unsorted; any `sort_direction` other than `asc` sorts descending.
      operationId: listOrganizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: search
          in: query
          schema:
            type: string
          description: Substring match on name or slug
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, deleted]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [id, name, status, created_at, users_count, extensions_count, dids_count]
            default: created_at
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Organizations with users/extensions/DID counts (per_page defaults to 25)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '../../components/schemas/Organization.yaml'
                        - type: object
                          properties:
                            users_count:
                              type: integer
                            extensions_count:
                              type: integer
                            dids_count:
                              type: integer
                        - type: object
                          properties:
                            public_queues_token:
                              type:
                                - string
                                - 'null'
                              format: uuid
                              description: Token of the public queues dashboard link (null until the link is first requested)
                            deleted_at:
                              type:
                                - string
                                - 'null'
                              format: date-time
                  meta:
                    allOf:
                      - $ref: '../../components/schemas/PaginationMeta.yaml'
                      - type: object
                        properties:
                          has_more:
                            type: boolean
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
    
  /v1/platform/organizations/{organization}:
    parameters:
      - name: organization
        in: path
        required: true
        schema:
          type: integer
    
    get:
      tags:
        - Platform
      summary: Get organization details
      description: |
        The organization with its users and counts. Platform managers only. Sensitive
        values under `settings.cloudonix` (`domain_api_key`, `domain_requests_api_key`,
        `domain_cdr_auth_key`, `api_key`, `api_secret`, `password`, `secret`, `token`)
        longer than 4 characters are masked to asterisks plus their last 4 characters.
      operationId: getOrganization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization with its users, counts and masked Cloudonix settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '../../components/schemas/Organization.yaml'
                      - type: object
                        properties:
                          users_count:
                            type: integer
                          extensions_count:
                            type: integer
                          dids_count:
                            type: integer
                          ring_groups_count:
                            type: integer
                          business_hours_count:
                            type: integer
                          public_queues_token:
                            type:
                              - string
                              - 'null'
                            format: uuid
                          deleted_at:
                            type:
                              - string
                              - 'null'
                            format: date-time
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                organization_id:
                                  type: integer
                                name:
                                  type: string
                                email:
                                  type: string
                                role:
                                  type: string
                                status:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
    
    put:
      tags:
        - Platform
      summary: Update organization
      description: |
        Updates the name, timezone and/or settings. Platform managers only. A field that
        is omitted or null is left unchanged. `settings` is merged into the existing
        settings at the top level (a key you send replaces that whole key). Writes an
        `organization.settings.updated` audit log entry. The response and the audit entry's
        before/after snapshots mask sensitive `settings.cloudonix` values the same way
        `GET` does (asterisks plus the last 4 characters); the real values are stored.
      operationId: updatePlatformOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                timezone:
                  type:
                    - string
                    - 'null'
                  description: A valid PHP timezone identifier
                  example: America/New_York
                settings:
                  type:
                    - object
                    - 'null'
                  description: Merged into the existing settings (top-level keys replace)
                  additionalProperties: true
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization updated successfully.
                  data:
                    allOf:
                      - $ref: '../../components/schemas/Organization.yaml'
                      - type: object
                        description: Sensitive `settings.cloudonix` values are masked as in `GET`.
                        properties:
                          public_queues_token:
                            type:
                              - string
                              - 'null'
                            format: uuid
                          deleted_at:
                            type:
                              - string
                              - 'null'
                            format: date-time
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
