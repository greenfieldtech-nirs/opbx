paths:
  /v1/platform/status:
    get:
      tags:
        - Platform
      summary: Platform component status
      description: >-
        Latest health result for every platform component plus the last 24 hours of history
        (5-minute buckets, worst status per bucket). Written every minute by `platform:health-check`.
        Platform managers only.
      operationId: getPlatformStatus
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Component statuses
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/PlatformStatus.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
  /v1/platform/status/check:
    post:
      tags:
        - Platform
      summary: Run all health checks now
      description: >-
        Runs and stores every check, then returns the same payload as GET. Platform managers
        only. Throttled to 6 requests per minute per user.
      operationId: runPlatformStatusCheck
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Fresh component statuses
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/PlatformStatus.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not a platform manager
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Forbidden. Platform manager access required.
        '429':
          description: Too many requests (Laravel `throttle:6,1`)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
