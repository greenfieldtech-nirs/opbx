paths:
  /v1/api-keys:
    get:
      tags:
        - API Keys
      summary: List API Keys
      description: >
        List all API keys (active and revoked) for the current organization,
        newest first, not paginated. Owner only. Never returns the plaintext key
        value. Requests authenticated with an API key get 403 on every
        `/v1/api-keys` route.
      operationId: listApiKeys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/ApiKey.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

    post:
      tags:
        - API Keys
      summary: Create API Key
      description: >
        Create a scoped API key. Owner only. The response includes the one-time
        plaintext `key` value in addition to the key resource — store it securely,
        it is never returned again.
      operationId: createApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: CI deploy key
                permissions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '../../components/schemas/ApiKeyPermission.yaml'
              required:
                - name
                - permissions
      responses:
        '201':
          description: API key created. `key` is the one-time plaintext value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/ApiKey.yaml'
                  key:
                    type: string
                    description: The one-time plaintext API key. Shown only on creation.
                    example: opbxk_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                required:
                  - data
                  - key
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/api-keys/grantable-resources:
    get:
      tags:
        - API Keys
      summary: List grantable resources
      description: >
        Return the allowlist of resource slugs that an API key may be granted
        access to. Only business/config resources are grantable; management
        endpoints (including API keys themselves) are never grantable.
      operationId: listGrantableResources
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of grantable resource slugs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - users
                      - extensions
                      - conference-rooms
                      - ai-assistants
                      - ai-assistant-providers
                      - ring-groups
                      - call-queues
                      - queue-calls
                      - ai-assistant-load-balancers
                      - ivr-menus
                      - business-hours
                      - phone-numbers
                      - outbound-whitelist
                      - inbound-blacklist
                      - call-detail-records
                      - recordings
                      - supervisors
                      - auto-dialer-campaigns
                      - distribution-lists
                      - session-updates
                      - call-notifications
                      - dashboard
                      - trunks
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

  /v1/api-keys/{apiKey}:
    parameters:
      - name: apiKey
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - API Keys
      summary: Get API Key
      description: Get a single API key. Owner only. Never returns the plaintext key value.
      operationId: getApiKey
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/ApiKey.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - API Keys
      summary: Update API Key
      description: >
        Update an API key's name and/or replace its permission set. Owner only.
        Permissions, when supplied, replace the existing set atomically and must
        contain at least one entry.
      operationId: updateApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: When sent, must not be empty
                permissions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '../../components/schemas/ApiKeyPermission.yaml'
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/ApiKey.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    patch:
      tags:
        - API Keys
      summary: Update API Key (partial)
      description: >
        Equivalent to `PUT /v1/api-keys/{apiKey}` — Laravel's `apiResource`
        routing registers both PUT and PATCH against the same update action.
        Both accept a full or partial body; there is no distinct partial-update
        semantic beyond what PUT already allows.
      operationId: patchApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: When sent, must not be empty
                permissions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '../../components/schemas/ApiKeyPermission.yaml'
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/ApiKey.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - API Keys
      summary: Revoke API Key
      description: >
        Revoke (soft-delete) an API key. Owner only. Revoked keys can no longer
        authenticate requests but remain visible in the list with a revocation timestamp.
        Revoking an already-revoked key succeeds and resets `revoked_at` to now.
      operationId: revokeApiKey
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/SuccessMessage.yaml'
              example:
                message: API key revoked.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
