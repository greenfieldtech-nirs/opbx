paths:
  /webhooks/cloudonix/cdr:
    post:
      tags:
        - Webhooks
      summary: CDR webhook
      description: |
        Call Detail Record webhook sent after call completion.
        
        Contains complete call information including:
        - Call duration and billable seconds
        - Cost information
        - Recording URL (if available)
        
        Middleware: webhook.signature, webhook.idempotency, rate_limit_org:webhook
      operationId: cdrWebhook
      security:
        - webhookBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/webhooks/CdrPayload.yaml'
      responses:
        '200':
          description: CDR processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: processed
        '400':
          $ref: '../../components/responses/BadRequest.yaml'
