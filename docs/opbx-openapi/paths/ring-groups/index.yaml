paths:
  /v1/ring-groups:
    get:
      tags:
        - Ring Groups
      summary: List ring groups
      operationId: listRingGroups
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of ring groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/RingGroup.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Ring Groups
      summary: Create ring group
      operationId: createRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Sales Team
                strategy:
                  type: string
                  enum: [simultaneous, round_robin, priority, weighted, memory]
                  example: simultaneous
                timeout:
                  type: integer
                  example: 30
                fallback_action:
                  type: string
                  enum: [voicemail, extension, ring_group, ivr_menu, ai_assistant, disconnect]
      responses:
        '201':
          description: Ring group created

  /v1/ring-groups/{ring_group}:
    parameters:
      - name: ring_group
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Ring Groups
      summary: Get ring group
      operationId: getRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Ring group details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'

    put:
      tags:
        - Ring Groups
      summary: Update ring group
      operationId: updateRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroup.yaml'
      responses:
        '200':
          description: Ring group updated
    patch:
      tags:
        - Ring Groups
      summary: Partially update ring group
      operationId: patchRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroup.yaml'
      responses:
        '200':
          description: Ring group updated

    delete:
      tags:
        - Ring Groups
      summary: Delete ring group
      operationId: deleteRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Ring group deleted
