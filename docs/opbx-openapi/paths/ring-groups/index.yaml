paths:
  /v1/ring-groups:
    get:
      tags:
        - Ring Groups
      summary: List ring groups
      operationId: listRingGroups
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum:
              - name
              - strategy
              - status
              - created_at
              - updated_at
            default: created_at
        - $ref: '../../components/parameters/query/SortOrder.yaml'
        - name: strategy
          in: query
          schema:
            type: string
            enum:
              - simultaneous
              - round_robin
              - sequential
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      description: Supervisors see only the ring groups assigned to them.
      responses:
        '200':
          description: List of ring groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/RingGroup.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Ring Groups
      summary: Create ring group
      operationId: createRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/RingGroupInput.yaml'
                - required:
                    - name
                    - strategy
                    - timeout
                    - ring_turns
                    - fallback_action
                    - status
                    - members
      responses:
        '201':
          description: Ring group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/ring-groups/{ring_group}:
    parameters:
      - name: ring_group
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Ring Groups
      summary: Get ring group
      operationId: getRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:read
      responses:
        '200':
          description: Ring group details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Ring Groups
      summary: Update ring group
      operationId: updateRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroupInput.yaml'
      responses:
        '200':
          description: Ring group updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Ring Groups
      summary: Partially update ring group
      operationId: patchRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroupInput.yaml'
      responses:
        '200':
          description: Ring group updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Ring Groups
      summary: Delete ring group
      description: Refused with 409 when the ring group is still referenced (for example as a fallback or from an extension). The 409 body lists the references.
      operationId: deleteRingGroup
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      responses:
        '204':
          description: Ring group deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
