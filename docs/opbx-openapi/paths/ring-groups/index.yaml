paths:
  /v1/ring-groups:
    get:
      tags:
        - Ring Groups
      summary: List ring groups
      operationId: listRingGroups
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum:
              - name
              - strategy
              - status
              - created_at
              - updated_at
            default: created_at
          description: Sort field; other values fall back to `created_at`.
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: strategy
          in: query
          schema:
            type: string
            enum:
              - simultaneous
              - round_robin
              - sequential
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: search
          in: query
          schema:
            type: string
          description: Matches name or description (substring). Unknown `strategy` or `status` values are ignored.
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      description: |
        Any role. Supervisors see only the ring groups assigned to them. Each item includes
        its members (ordered by priority), `fallback_extension`, `members_count` and
        `active_members_count`.
      responses:
        '200':
          description: List of ring groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/RingGroup.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Ring Groups
      summary: Create ring group
      description: |
        Owner and PBX Admin only. Omitted fields get defaults: `strategy` simultaneous,
        `timeout` 30, `ring_turns` 2, `fallback_action` hangup, `status` active. Members must
        be active `user` or `forward` extensions of the organization; a fallback target
        (extension, ring group, IVR menu, AI assistant, AI load balancer, call queue) must be
        active and, for `ai_assistant`, an AI assistant extension.
      operationId: createRingGroup
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/RingGroupInput.yaml'
                - required:
                    - name
                    - members
      responses:
        '201':
          description: Ring group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/ring-groups/{ring_group}:
    parameters:
      - name: ring_group
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Ring Groups
      summary: Get ring group
      description: |
        Owner, PBX Admin, PBX User and Reporter; a Supervisor only for an assigned ring
        group (otherwise 403). Includes members and `fallback_extension`.
      operationId: getRingGroup
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:read
      responses:
        '200':
          description: Ring group details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Ring Groups
      summary: Update ring group
      description: |
        Owner and PBX Admin only. Every field is optional (no defaults are applied); sent
        `members` replace the member list, omitted `members` are kept. The `fallback_*_id`
        matching the effective `fallback_action` is kept or replaced; the others are cleared.
        Answers 409 when another update of the same ring group holds its lock.
      operationId: updateRingGroup
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroupInput.yaml'
      responses:
        '200':
          description: Ring group updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          description: The ring group is being modified by another request
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Conflict
                message: Ring group is currently being modified. Please try again.
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Ring Groups
      summary: Partially update ring group
      description: Same as PUT.
      operationId: patchRingGroup
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/RingGroupInput.yaml'
      responses:
        '200':
          description: Ring group updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/RingGroup.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          description: The ring group is being modified by another request
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Conflict
                message: Ring group is currently being modified. Please try again.
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Ring Groups
      summary: Delete ring group
      description: Owner and PBX Admin only. Refused with 409 when the ring group is still referenced (for example as a fallback or from an extension). The 409 body lists the references.
      operationId: deleteRingGroup
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ring-groups:write
      responses:
        '204':
          description: Ring group deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
