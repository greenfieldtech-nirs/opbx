paths:
  /v1/config/application:
    get:
      tags:
      - Configuration
      summary: Get application configuration
      description: 'Get application-level configuration for the frontend.


        Returns configuration details including SaaS mode, webhook URL

        settings, reCAPTCHA configuration, and validation warnings.

        '
      operationId: getApplicationConfig
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - development
                    - production
                    description: Application deployment mode
                    example: production
                  is_production:
                    type: boolean
                    description: Whether the application is in production mode
                    example: true
                  has_application_webhook_url:
                    type: boolean
                    description: Whether an application webhook URL is configured
                    example: true
                  is_valid_configuration:
                    type: boolean
                    description: Whether the current configuration is valid
                    example: true
                  warnings:
                    type: array
                    description: Configuration warnings (if any)
                    items:
                      type: string
                      example: Production mode requires OPBX_APPLICATION_WEBHOOK_BASEURL to be set
                  hide_webhook_fields:
                    type: boolean
                    description: Whether webhook fields should be hidden in the UI
                    example: true
                  recaptcha:
                    type: object
                    description: reCAPTCHA configuration
                    properties:
                      enabled:
                        type: boolean
                        description: Whether reCAPTCHA is enabled
                        example: true
                      site_key:
                        type:
                        - string
                        - 'null'
                        description: reCAPTCHA site key (if enabled)
                        example: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
