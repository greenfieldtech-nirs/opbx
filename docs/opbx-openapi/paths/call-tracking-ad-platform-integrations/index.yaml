paths:
  /v1/call-tracking-ad-platform-integrations:
    get:
      tags:
        - Call Tracking Ad Platform Integrations
      summary: Get ad-platform integration settings
      description: |
        Returns the organization's Google Ads and Meta conversion-upload integration
        settings (singleton). When no integration exists a default disabled/unconfigured
        shape is returned (`updated_at` null). Credentials are stored encrypted
        and never echoed back. Owner and PBX Admin only.
      operationId: getAdPlatformIntegration
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-tracking-ad-platform-integrations:read
      responses:
        '200':
          description: Integration settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/CallTrackingAdPlatformIntegration'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
    put:
      tags:
        - Call Tracking Ad Platform Integrations
      summary: Update ad-platform integration settings
      description: |
        Creates or updates the organization's Google Ads and Meta conversion-upload
        integration settings. Only credential fields sent with a non-null value
        are written; omitting a credential (or sending null) leaves the stored
        value untouched, so a credential cannot be cleared here. When
        `google_ads_enabled` is true, each Google Ads credential is required
        unless one is already stored; the same applies to the Meta credentials
        when `meta_enabled` is true. Owner and PBX Admin only.
      operationId: updateAdPlatformIntegration
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-tracking-ad-platform-integrations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - google_ads_enabled
                - meta_enabled
              properties:
                google_ads_enabled:
                  type: boolean
                meta_enabled:
                  type: boolean
                google_ads_developer_token:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 1024
                google_ads_refresh_token:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 8192
                google_ads_customer_id:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 255
                google_ads_conversion_action_resource_name:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 1024
                meta_pixel_id:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 255
                meta_access_token:
                  type:
                    - string
                    - 'null'
                  minLength: 1
                  maxLength: 8192
      responses:
        '200':
          description: Updated integration settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Integration settings updated successfully.
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/CallTrackingAdPlatformIntegration'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '422':
          $ref: '../../openapi.yaml#/components/responses/ValidationError'
