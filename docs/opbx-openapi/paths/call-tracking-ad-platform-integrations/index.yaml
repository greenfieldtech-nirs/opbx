paths:
  /v1/call-tracking-ad-platform-integrations:
    get:
      tags:
      - Call Tracking Ad Platform Integrations
      summary: Get ad platform integrations
      description: |
        Get the ad platform integration status for the authenticated user's
        organization. Returns whether Google Ads and Meta integrations are
        enabled and fully configured.
      operationId: getCallTrackingAdPlatformIntegrations
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Ad platform integration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/CallTrackingAdPlatformIntegration.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
    put:
      tags:
      - Call Tracking Ad Platform Integrations
      summary: Update ad platform integrations
      description: |
        Update the ad platform integration settings for the organization. When
        enabling Google Ads or Meta for the first time, the corresponding
        credentials are required. Subsequent updates may omit credentials that
        are already stored.
      operationId: updateCallTrackingAdPlatformIntegrations
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                google_ads_enabled:
                  type: boolean
                  description: Whether Google Ads conversion upload is enabled
                  example: true
                google_ads_developer_token:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 1024
                  description: Google Ads developer token (required when enabling Google Ads for the first time)
                  example: dAbCdEfGhIjKlMnOpQrStUvWxYz
                google_ads_refresh_token:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 8192
                  description: Google Ads refresh token (required when enabling Google Ads for the first time)
                  example: 1//04xxxxxxxxxxxxxxxxxxxxxxxxxx
                google_ads_customer_id:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
                  description: Google Ads customer ID (required when enabling Google Ads for the first time)
                  example: '123-456-7890'
                google_ads_conversion_action_resource_name:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 1024
                  description: Google Ads conversion action resource name (required when enabling Google Ads for the first time)
                  example: customers/1234567890/conversionActions/0987654321
                meta_enabled:
                  type: boolean
                  description: Whether Meta conversion upload is enabled
                  example: false
                meta_pixel_id:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
                  description: Meta pixel ID (required when enabling Meta for the first time)
                  example: '123456789012345'
                meta_access_token:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 8192
                  description: Meta access token (required when enabling Meta for the first time)
                  example: EAAxxxxx
              required:
              - google_ads_enabled
              - meta_enabled
      responses:
        '200':
          description: Ad platform integrations updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Ad platform integrations updated successfully
                  data:
                    $ref: ../../components/schemas/CallTrackingAdPlatformIntegration.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
