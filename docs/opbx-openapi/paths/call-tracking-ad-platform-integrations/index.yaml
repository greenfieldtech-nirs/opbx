paths:
  /v1/call-tracking-ad-platform-integrations:
    get:
      tags:
        - Call Tracking Ad Platform Integrations
      summary: Get ad-platform integration settings
      description: |
        Returns the organization's Google Ads and Meta conversion-upload integration
        settings (singleton). When no integration exists a default disabled/unconfigured
        shape is returned. Secret credentials are never echoed back.
      operationId: getAdPlatformIntegration
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Integration settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/CallTrackingAdPlatformIntegration'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
    put:
      tags:
        - Call Tracking Ad Platform Integrations
      summary: Update ad-platform integration settings
      description: |
        Creates or updates the organization's Google Ads and Meta conversion-upload
        integration settings. Only supplied secret credential fields are written;
        omitting a credential leaves the stored value untouched.
      operationId: updateAdPlatformIntegration
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - google_ads_enabled
                - meta_enabled
              properties:
                google_ads_enabled:
                  type: boolean
                meta_enabled:
                  type: boolean
                google_ads_developer_token:
                  type:
                    - string
                    - 'null'
                google_ads_refresh_token:
                  type:
                    - string
                    - 'null'
                google_ads_customer_id:
                  type:
                    - string
                    - 'null'
                google_ads_conversion_action_resource_name:
                  type:
                    - string
                    - 'null'
                meta_pixel_id:
                  type:
                    - string
                    - 'null'
                meta_access_token:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Updated integration settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/CallTrackingAdPlatformIntegration'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '422':
          $ref: '../../openapi.yaml#/components/responses/ValidationError'
