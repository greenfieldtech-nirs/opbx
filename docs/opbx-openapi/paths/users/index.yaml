paths:
  /v1/users:
    get:
      tags:
      - Users
      summary: List users
      description: 'Get a paginated list of users in the organization, sorted by `sort_by`.
        Supervisors see only themselves and their assigned users. Each user includes
        its assigned `extension`.

        '
      operationId: listUsers
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - email
          - role
          - status
          - created_at
          - updated_at
          default: created_at
      - $ref: ../../components/parameters/query/SortOrder.yaml
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/User.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
    post:
      tags:
      - Users
      summary: Create user
      description: 'Create a new user in the organization.


        **Role Restrictions:**

        - Owner role cannot be assigned (single owner per organization)

        - PBX Admins can only create PBX Users or Reporters


        Default status is `active` if not specified.

        '
      operationId: createUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  description: Full name
                  example: Jane Smith
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Email address (unique within organization)
                  example: jane.smith@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 'Password requirements:

                    - At least 8 characters

                    - Upper and lowercase letters

                    - At least one number

                    '
                  example: SecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: User role (owner cannot be assigned; a PBX Admin cannot assign pbx_admin)
                  example: pbx_user
                status:
                  type:
                  - string
                  - 'null'
                  enum:
                  - active
                  - inactive
                  - pending
                  default: active
                  description: Account status
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                  example: +1-555-123-4567
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
              required:
              - name
              - email
              - password
              - role
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/users/{user}:
    get:
      tags:
      - Users
      summary: Get user
      description: Get a specific user by ID
      operationId: getUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:read
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - Users
      summary: Update user
      description: 'Update an existing user.


        **Restrictions:**

        - Users cannot change their own role

        - Owner role cannot be assigned

        - PBX Admins cannot modify Owner or PBX Admin users

        '
      operationId: updateUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: Jane Smith Updated
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: jane.smith.new@example.com
                password:
                  type:
                  - string
                  - 'null'
                  format: password
                  minLength: 8
                  description: Omit or send null to keep the current password. Same rules as on create (letters, mixed case, numbers).
                  example: NewSecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: Owner cannot be assigned; users cannot change their own role
                  example: pbx_admin
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - Users
      summary: Partially update user
      description: 'Update an existing user.


        **Restrictions:**

        - Users cannot change their own role

        - Owner role cannot be assigned

        - PBX Admins cannot modify Owner or PBX Admin users

        '
      operationId: patchUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: Jane Smith Updated
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: jane.smith.new@example.com
                password:
                  type:
                  - string
                  - 'null'
                  format: password
                  minLength: 8
                  description: Omit or send null to keep the current password. Same rules as on create (letters, mixed case, numbers).
                  example: NewSecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: Owner cannot be assigned; users cannot change their own role
                  example: pbx_admin
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - Users
      summary: Delete user
      description: 'Delete a user from the organization.


        **Restriction:** Cannot delete the last owner in the organization.

        '
      operationId: deleteUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: Cannot delete last owner
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                success: false
                message: Cannot delete the last owner in the organization.
                error_code: LAST_OWNER_DELETE_BLOCKED
