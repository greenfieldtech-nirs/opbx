paths:
  /v1/users:
    get:
      tags:
      - Users
      summary: List users
      description: 'Get a paginated list of users in the organization, sorted by `sort_by`
        (newest first by default). Owner and PBX Admin see every user; a Supervisor sees
        only themselves and their assigned users; PBX User and Reporter get 403. Each user
        includes its assigned `extension`.

        '
      operationId: listUsers
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - email
          - role
          - status
          - created_at
          - updated_at
          default: created_at
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/User.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
    post:
      tags:
      - Users
      summary: Create user
      description: 'Create a new user in the organization. Owner and PBX Admin only.


        **Role Restrictions:**

        - Owner role cannot be assigned (422)

        - A PBX Admin cannot create a PBX Admin (422)


        Default status is `active` if not specified. An Embedded Dialer token is created for
        the new user.

        '
      operationId: createUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  description: Full name
                  example: Jane Smith
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Email address (unique within organization)
                  example: jane.smith@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 'Password requirements:

                    - At least 8 characters

                    - Upper and lowercase letters

                    - At least one number

                    '
                  example: SecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: User role (owner cannot be assigned; a PBX Admin cannot assign pbx_admin)
                  example: pbx_user
                status:
                  type:
                  - string
                  - 'null'
                  enum:
                  - active
                  - inactive
                  - pending
                  default: active
                  description: Account status
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                  example: +1-555-123-4567
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
              required:
              - name
              - email
              - password
              - role
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/users/{user}:
    get:
      tags:
      - Users
      summary: Get user
      description: >-
        Get a specific user by ID. Owner and PBX Admin can read any user; a Supervisor
        themselves and their assigned users; PBX User and Reporter only themselves.
      operationId: getUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:read
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - Users
      summary: Update user
      description: 'Update an existing user. All fields are optional.


        **Restrictions:**

        - Owner and PBX Admin can update any user, except that only an Owner can update an Owner;
        a PBX User can update only themselves; Supervisor and Reporter get 403

        - Changing `role` is Owner-only and not allowed on yourself (403). Sending `role` when
        updating yourself, or `role: owner`, is rejected (422); a PBX Admin sending `role` for
        an Owner or PBX Admin, or `role: pbx_admin`, is rejected (422)

        - Changing `status` needs Owner or PBX Admin and is not allowed on yourself or on an
        Owner (403)

        - Setting `password` follows `PATCH /v1/users/{user}/password` authorization (403)

        '
      operationId: updateUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: Jane Smith Updated
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: jane.smith.new@example.com
                password:
                  type:
                  - string
                  - 'null'
                  format: password
                  minLength: 8
                  description: Omit or send null to keep the current password. Same rules as on create (letters, mixed case, numbers).
                  example: NewSecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: Owner cannot be assigned; users cannot change their own role
                  example: pbx_admin
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - Users
      summary: Partially update user
      description: 'Update an existing user. All fields are optional.


        **Restrictions:**

        - Owner and PBX Admin can update any user, except that only an Owner can update an Owner;
        a PBX User can update only themselves; Supervisor and Reporter get 403

        - Changing `role` is Owner-only and not allowed on yourself (403). Sending `role` when
        updating yourself, or `role: owner`, is rejected (422); a PBX Admin sending `role` for
        an Owner or PBX Admin, or `role: pbx_admin`, is rejected (422)

        - Changing `status` needs Owner or PBX Admin and is not allowed on yourself or on an
        Owner (403)

        - Setting `password` follows `PATCH /v1/users/{user}/password` authorization (403)

        '
      operationId: patchUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: Jane Smith Updated
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: jane.smith.new@example.com
                password:
                  type:
                  - string
                  - 'null'
                  format: password
                  minLength: 8
                  description: Omit or send null to keep the current password. Same rules as on create (letters, mixed case, numbers).
                  example: NewSecurePass123
                role:
                  type: string
                  enum:
                  - pbx_admin
                  - pbx_user
                  - reporter
                  - supervisor
                  description: Owner cannot be assigned; users cannot change their own role
                  example: pbx_admin
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully.
                  data:
                    $ref: ../../components/schemas/User.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - Users
      summary: Delete user
      description: 'Delete a user from the organization. Owner and PBX Admin only; you cannot
        delete yourself, and only an Owner can delete an Owner. The last Owner of the
        organization cannot be deleted (409).


        The user''s extensions are kept but unassigned, their ring group and call queue
        memberships are removed, and routing entries that pointed at their extensions are
        switched to `unavailable`. Preview this with `GET /v1/users/{user}/delete-impact`.

        '
      operationId: deleteUser
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: users:write
      parameters:
      - $ref: ../../components/parameters/path/UserId.yaml
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: >-
            The user is the organization's last Owner (`LAST_OWNER_DELETE_BLOCKED`), or the
            owner-deletion lock could not be acquired (`LOCK_ACQUISITION_FAILED`, retry)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  error_code:
                    type: string
                    enum:
                    - LAST_OWNER_DELETE_BLOCKED
                    - LOCK_ACQUISITION_FAILED
              example:
                success: false
                message: Cannot delete the last owner in the organization.
                error_code: LAST_OWNER_DELETE_BLOCKED
