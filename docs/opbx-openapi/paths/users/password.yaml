paths:
  /v1/users/{user}/password:
    parameters:
      - name: user
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Users
      summary: Update user password
      description: |
        Set another user's password. You cannot change your own password here (use
        `PUT /v1/profile/password`). An Owner can set any other user's password; a PBX Admin
        only the password of a PBX User or Reporter. Everyone else gets 403. Not available to
        API keys.
      operationId: updateUserPassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: New password, at least 8 characters.
                  example: "NewSecurePass123"
                password_confirmation:
                  type: string
                  format: password
                  description: Password confirmation (must match password)
                  example: "NewSecurePass123"
              required:
                - password
                - password_confirmation
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password updated successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not allowed to change this user's password
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You are not authorized to change this user's password.
                  error_code:
                    type: string
                    example: UNAUTHORIZED_PASSWORD_CHANGE
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
