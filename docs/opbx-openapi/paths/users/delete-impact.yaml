paths:
  /v1/users/{user}/delete-impact:
    parameters:
      - name: user
        in: path
        required: true
        description: User ID
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Users
      summary: Preview user deletion impact
      description: |
        Returns what deleting this user would change, without changing anything: the
        extensions it holds, the ring group and call queue memberships that would be
        removed, and the routing entries that would be cleared. Use it to confirm a
        delete. Authorization is the same as `DELETE /v1/users/{user}`.
      operationId: getUserDeleteImpact
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Deletion impact preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '../../components/schemas/UserDeletionImpact.yaml'
              example:
                data:
                  extensions:
                    - id: 12
                      extension_number: '1001'
                  memberships:
                    - type: ring_group
                      id: 7
                      name: Sales
                      becomes_empty: false
                  routes: []
                  empty_groups: 0
                  has_changes: true
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
