paths:
  /v1/broadcasting/auth:
    get:
      tags:
        - Broadcasting
      summary: Authenticate broadcasting channel (GET)
      description: |
        Equivalent to `POST /v1/broadcasting/auth`, registered by Laravel's
        `Broadcast::routes()` helper for client libraries that authenticate
        channels via GET with query parameters instead of a POST body.
      operationId: authenticateBroadcastingChannelGet
      security:
        - bearerAuth: []
      parameters:
        - name: socket_id
          in: query
          required: true
          schema:
            type: string
          example: "1234.5678"
        - name: channel_name
          in: query
          required: true
          schema:
            type: string
          example: "presence-org.1"
      responses:
        '200':
          description: Channel authentication payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: string
                    description: Signature in the form `<app-key>:<hmac>`
                  channel_data:
                    type: string
                    description: >-
                      Presence channels only: JSON string with `user_id` and
                      `user_info` (`id`, `name`, `email`, `role`)
                required:
                  - auth
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
    post:
      tags:
        - Broadcasting
      summary: Authenticate broadcasting channel
      description: |
        Laravel Echo broadcasting authentication endpoint.

        Returns the Pusher-protocol authentication payload needed to subscribe
        to private or presence channels from the SPA. The body may be JSON or
        form-encoded.

        Channels:
        - `presence-org.{organizationId}`: live call presence. Allowed for
          owners and PBX admins of that organization (supervisors and other
          roles are denied).
        - `private-user.{userId}`: only the user themselves.
        - `private-extension.{extensionId}`: users of the extension's organization.

        Requires an authenticated user in an active organization
        (`tenant.scope`). Denied channels return 403.
      operationId: authenticateBroadcastingChannel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                socket_id:
                  type: string
                  example: "1234.5678"
                channel_name:
                  type: string
                  example: "presence-org.1"
              required:
                - socket_id
                - channel_name
      responses:
        '200':
          description: Channel authentication payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: string
                    description: Signature in the form `<app-key>:<hmac>`
                  channel_data:
                    type: string
                    description: >-
                      Presence channels only: JSON string with `user_id` and
                      `user_info` (`id`, `name`, `email`, `role`)
                required:
                  - auth
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
