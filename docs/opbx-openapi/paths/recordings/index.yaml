paths:
  /v1/recordings:
    get:
      tags:
        - Recordings
      summary: List Recordings
      description: Get paginated list of Recordings
      operationId: listRecordings
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of Recordings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/Recording.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Recordings
      summary: Create Recording
      operationId: createRecording
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Recording created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/recordings/{recording}:
    parameters:
      - name: recording
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Recordings
      summary: Get Recording
      operationId: getRecording
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Recording details
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Recordings
      summary: Update Recording
      operationId: updateRecording
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Recording updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Recordings
      summary: Delete Recording
      operationId: deleteRecording
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Recording deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
