paths:
  /v1/outbound-whitelist:
    get:
      tags:
        - Outbound Whitelist
      summary: List outbound whitelist entries
      description: |
        Paginated list. Every authenticated user of the organization can list entries.
        `meta` has current_page, per_page, total, last_page, from and to. Unknown `sort_by`
        or `sort_order` values fall back to the defaults. Only list responses include the
        nested `default_caller_id` object.
      operationId: listOutboundWhitelistEntrys
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - name: per_page
          in: query
          description: Items per page (clamped to 1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [destination_country, destination_prefix, outbound_trunk_name, created_at, updated_at]
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: search
          in: query
          description: Substring match on name, destination_country, destination_prefix or outbound_trunk_name
          schema:
            type: string
      responses:
        '200':
          description: List of outbound whitelist entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/OutboundWhitelist.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

    post:
      tags:
        - Outbound Whitelist
      summary: Create Outbound Whitelist Entry
      operationId: createOutboundWhitelistEntry
      description: |
        Owner and PBX Admin only. `name`, `destination_country` and `outbound_trunk_name` are
        trimmed; runs of spaces in `destination_prefix` are collapsed. `status` cannot be set
        here: new entries are `active` (use toggle-status).
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - destination_country
                - outbound_trunk_name
              properties:
                name:
                  type: string
                  maxLength: 255
                destination_country:
                  type: string
                  maxLength: 100
                  description: Unique within the organization.
                destination_prefix:
                  type:
                    - string
                    - 'null'
                  maxLength: 12
                  pattern: ^[0-9+\-\s]+$
                  description: Digits, spaces, '+' and '-' only.
                outbound_trunk_name:
                  type: string
                  maxLength: 255
                default_caller_id_did_id:
                  type:
                    - integer
                    - 'null'
                  description: |
                    ID of a DID of the organization (any status). At call time it is used only
                    while the DID is active.
      responses:
        '201':
          description: Whitelist entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/OutboundWhitelist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/outbound-whitelist/{outbound_whitelist}:
    parameters:
      - name: outbound_whitelist
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Outbound Whitelist
      summary: Get Outbound Whitelist Entry
      operationId: getOutboundWhitelistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:read
      responses:
        '200':
          description: Whitelist entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/OutboundWhitelist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Outbound Whitelist
      summary: Update Outbound Whitelist Entry
      operationId: updateOutboundWhitelistEntry
      description: Owner and PBX Admin only. PUT and PATCH both require the full field set; `status` cannot be changed here (use toggle-status).
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - destination_country
                - outbound_trunk_name
              properties:
                name:
                  type: string
                  maxLength: 255
                destination_country:
                  type: string
                  maxLength: 100
                  description: Unique within the organization.
                destination_prefix:
                  type:
                    - string
                    - 'null'
                  maxLength: 12
                  pattern: ^[0-9+\-\s]+$
                  description: Digits, spaces, '+' and '-' only.
                outbound_trunk_name:
                  type: string
                  maxLength: 255
                default_caller_id_did_id:
                  type:
                    - integer
                    - 'null'
                  description: |
                    ID of a DID of the organization (any status). At call time it is used only
                    while the DID is active.
      responses:
        '200':
          description: Whitelist entry updated (update requires the same fields as create)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/OutboundWhitelist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Outbound Whitelist
      summary: Partially update Outbound Whitelist Entry
      operationId: patchOutboundWhitelistEntry
      description: Owner and PBX Admin only. PUT and PATCH both require the full field set; `status` cannot be changed here (use toggle-status).
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - destination_country
                - outbound_trunk_name
              properties:
                name:
                  type: string
                  maxLength: 255
                destination_country:
                  type: string
                  maxLength: 100
                  description: Unique within the organization.
                destination_prefix:
                  type:
                    - string
                    - 'null'
                  maxLength: 12
                  pattern: ^[0-9+\-\s]+$
                  description: Digits, spaces, '+' and '-' only.
                outbound_trunk_name:
                  type: string
                  maxLength: 255
                default_caller_id_did_id:
                  type:
                    - integer
                    - 'null'
                  description: |
                    ID of a DID of the organization (any status). At call time it is used only
                    while the DID is active.
      responses:
        '200':
          description: Whitelist entry updated (update requires the same fields as create)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/OutboundWhitelist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Outbound Whitelist
      summary: Delete Outbound Whitelist Entry
      operationId: deleteOutboundWhitelistEntry
      description: Owner and PBX Admin only.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:write
      responses:
        '204':
          description: Outbound whitelist entry deleted (empty body)
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
