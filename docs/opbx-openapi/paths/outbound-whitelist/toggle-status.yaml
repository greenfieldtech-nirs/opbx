paths:
  /v1/outbound-whitelist/{outboundWhitelist}/toggle-status:
    patch:
      tags:
        - Outbound Whitelist
      summary: Toggle whitelist entry status
      operationId: toggleWhitelistStatus
      description: Owner and PBX Admin only. Flips `status` between `active` and `inactive`.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: outbound-whitelist:write
      parameters:
        - name: outboundWhitelist
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status flipped between active and inactive (no request body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/OutboundWhitelist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
