paths:
  /v1/call-notifications/logs/{sessionToken}:
    get:
      tags:
        - Call Notifications
      summary: Get session notification logs
      operationId: getSessionNotificationLogs
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:read
      description: Owner and PBX Admin only. Every delivery for one call session, oldest first (not paginated).
      parameters:
        - name: sessionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: All deliveries for the call session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallNotificationLog.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
