paths:
  /v1/call-notifications/logs/{sessionToken}:
    get:
      tags:
        - Call Notifications
      summary: Get session notification logs
      operationId: getSessionNotificationLogs
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: sessionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session logs retrieved
