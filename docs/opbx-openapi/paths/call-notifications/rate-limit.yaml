paths:
  /v1/call-notifications/rate-limit:
    get:
      tags:
        - Call Notifications
      summary: Get rate limit info
      operationId: getNotificationRateLimit
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:read
      description: Owner and PBX Admin only. Webhook deliveries counted in the current one-minute window against the organization's `rate_limit_per_minute` (500 when no settings exist).
      responses:
        '200':
          description: Current webhook rate-limit window
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      limit:
                        type: integer
                      current:
                        type: integer
                      remaining:
                        type: integer
                      reset_in_seconds:
                        type: integer
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
