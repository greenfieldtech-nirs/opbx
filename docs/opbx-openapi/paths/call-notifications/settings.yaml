paths:
  /v1/call-notifications/settings:
    get:
      tags:
        - Call Notifications
      summary: Get notification settings
      operationId: getNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:read
      responses:
        '200':
          description: Settings, or `data` null with a message when none are configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '../../components/schemas/CallNotificationsSettings.yaml'
                      - type: 'null'
                  message:
                    type: string
    
    post:
      tags:
        - Call Notifications
      summary: Create notification settings
      operationId: createNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/CallNotificationsSettingsInput.yaml'
                - required:
                    - webhook_url
                    - auth_method
                    - enabled_events
      responses:
        '201':
          description: Settings created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/CallNotificationsSettings.yaml'
        '409':
          description: Settings already exist (use PUT)
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    put:
      tags:
        - Call Notifications
      summary: Update notification settings
      operationId: updateNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/CallNotificationsSettingsInput.yaml'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/CallNotificationsSettings.yaml'
        '404':
          description: No settings yet (use POST)
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    delete:
      tags:
        - Call Notifications
      summary: Delete notification settings
      operationId: deleteNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      responses:
        '200':
          description: Settings deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: No settings to delete
