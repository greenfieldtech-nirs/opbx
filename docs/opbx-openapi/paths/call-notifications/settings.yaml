paths:
  /v1/call-notifications/settings:
    get:
      tags:
        - Call Notifications
      summary: Get notification settings
      operationId: getNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:read
      description: Owner and PBX Admin only. The organization has at most one settings record.
      responses:
        '200':
          description: Settings, or `data` null with a message when none are configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '../../components/schemas/CallNotificationsSettings.yaml'
                      - type: 'null'
                  message:
                    type: string
                    example: Notification settings not configured
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
    
    post:
      tags:
        - Call Notifications
      summary: Create notification settings
      operationId: createNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      description: |
        Owner and PBX Admin only. Defaults: `retry_attempts` 3, `retry_backoff_seconds` 60,
        `request_timeout_seconds` 30, `rate_limit_per_minute` 500, `is_active` true.
        `auth_secret` is required for `bearer_token`; `auth_username` for `basic_auth`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/CallNotificationsSettingsInput.yaml'
                - required:
                    - webhook_url
                    - auth_method
                    - enabled_events
      responses:
        '201':
          description: Settings created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification settings created successfully
                  data:
                    $ref: '../../components/schemas/CallNotificationsSettings.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '409':
          description: Settings already exist (use PUT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Notification settings already exist. Use PUT to update.
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    put:
      tags:
        - Call Notifications
      summary: Update notification settings
      operationId: updateNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      description: |
        Owner and PBX Admin only. Only the fields sent are changed; `webhook_url`,
        `auth_method` and `enabled_events` cannot be null when sent. On update `auth_secret`
        and `auth_username` are never required, and sending `auth_secret: null` clears the
        stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/CallNotificationsSettingsInput.yaml'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification settings updated successfully
                  data:
                    $ref: '../../components/schemas/CallNotificationsSettings.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          description: No settings yet (use POST)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Notification settings not found. Use POST to create.
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    
    delete:
      tags:
        - Call Notifications
      summary: Delete notification settings
      operationId: deleteNotificationSettings
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-notifications:write
      description: Owner and PBX Admin only.
      responses:
        '200':
          description: Settings deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification settings deleted successfully
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          description: No settings to delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Notification settings not found
