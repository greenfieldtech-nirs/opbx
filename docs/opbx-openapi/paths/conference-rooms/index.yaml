paths:
  /v1/conference-rooms:
    get:
      tags:
        - Conference Rooms
      summary: List conference rooms
      operationId: listConferenceRooms
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of conference rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/ConferenceRoom.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Conference Rooms
      summary: Create conference room
      operationId: createConferenceRoom
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Weekly Standup
                max_participants:
                  type: integer
                  example: 25
      responses:
        '201':
          description: Conference room created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/ConferenceRoom.yaml'

  /v1/conference-rooms/{conference_room}:
    parameters:
      - name: conference_room
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Conference Rooms
      summary: Get conference room
      operationId: getConferenceRoom
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Conference room details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/ConferenceRoom.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Conference Rooms
      summary: Update conference room
      operationId: updateConferenceRoom
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/ConferenceRoom.yaml'
      responses:
        '200':
          description: Conference room updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/ConferenceRoom.yaml'

    delete:
      tags:
        - Conference Rooms
      summary: Delete conference room
      operationId: deleteConferenceRoom
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Conference room deleted
