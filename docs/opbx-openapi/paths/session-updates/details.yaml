paths:
  /v1/session-updates/{sessionId}:
    get:
      tags:
        - Session Updates
      summary: Get session details
      description: |
        All session-update events of one session in the organization, oldest first. Any role;
        for a Supervisor, a session outside their scope answers 404.
      operationId: getSessionDetails
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: session-updates:read
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Cloudonix numeric session ID
          schema:
            type: integer
      responses:
        '200':
          description: Session details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            event_id:
                              type: string
                            status:
                              type: string
                            action:
                              type: string
                            reason:
                              type: string
                            created_at:
                              type: string
                              format: date-time
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session not found
                  session_id:
                    type: integer
