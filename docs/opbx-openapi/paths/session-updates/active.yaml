paths:
  /v1/session-updates/active:
    get:
      tags:
        - Session Updates
      summary: Get active calls
      description: |
        Live calls of the organization (any role; Supervisors see only calls whose caller or
        destination is in their assigned scope). A call is active when the latest
        session-update row of its session has status `processing`, `ringing`, `connected` or
        `answer`, was updated in the last 30 minutes, and the session has no `cdr_final_status`
        or `deleted` event in the last 24 hours. Calls are ordered by last update (newest
        first) and capped at 100. Not rate-limited.

        `meta` counts are computed over the returned (filtered, capped) list.
      operationId: getActiveSessions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: session-updates:read
      parameters:
        - name: supervisor
          in: query
          required: false
          deprecated: true
          description: Ignored. Supervisors are always scoped by role.
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          description: Filter by call status; other values are ignored.
          schema:
            type: string
            enum:
              - processing
              - ringing
              - connected
        - name: direction
          in: query
          required: false
          description: Filter by call direction; other values are ignored.
          schema:
            type: string
            enum:
              - incoming
              - outgoing
      responses:
        '200':
          description: Active calls retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: integer
                        caller_id:
                          type: string
                          description: Caller (E.164, or a plain extension number when it is one of the organization's extensions)
                        destination:
                          type: string
                          description: Destination (same formatting as `caller_id`)
                        direction:
                          type: string
                          enum:
                            - incoming
                            - outgoing
                            - application
                            - internal
                        status:
                          type: string
                          enum:
                            - processing
                            - ringing
                            - connected
                            - answer
                        session_created_at:
                          type: string
                          description: Session start as stored (`YYYY-MM-DD HH:MM:SS`)
                        last_updated_at:
                          type: string
                          description: Time of the latest session update (`YYYY-MM-DD HH:MM:SS`)
                        duration_seconds:
                          type: integer
                        formatted_duration:
                          type: string
                          example: 2m 5s
                        domain:
                          type: string
                        subscriber_id:
                          type:
                            - integer
                            - 'null'
                          description: Cloudonix subscriber ID of the extension leg
                        call_ids:
                          type: array
                          items:
                            type: string
                        has_qos_data:
                          type: boolean
                        user_full_name:
                          type: string
                          description: Name of the user whose extension matches `subscriber_id`, or `Unassigned`
                        error:
                          type: string
                          description: Only on an item that could not be processed (`Data processing error`); such an item carries only `session_id`, `caller_id`, `destination`, `direction`, `status`, `user_full_name` and `error`.
                  meta:
                    type: object
                    properties:
                      total_active_calls:
                        type: integer
                      by_status:
                        type: object
                        properties:
                          processing:
                            type: integer
                          ringing:
                            type: integer
                          connected:
                            type: integer
                      by_direction:
                        type: object
                        properties:
                          incoming:
                            type: integer
                          outgoing:
                            type: integer
                      last_updated:
                        type: string
                        format: date-time
                      cache_expires_in:
                        type: integer
                        description: Always 5
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '500':
          description: Query failed
          content:
            application/json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Error'
              example:
                error: Failed to retrieve active calls
                message: SQLSTATE[...]
