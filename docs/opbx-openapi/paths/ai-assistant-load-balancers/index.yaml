paths:
  /v1/ai-assistant-load-balancers:
    get:
      tags:
      - AI Load Balancers
      summary: List AI load balancers
      description: |
        Paginated list of AI assistant load balancers with members and fallback targets. Any
        authenticated user can list. Filters: `strategy`, `status`, `search`, `unprovisioned`
        (unknown `strategy`/`status` values are ignored). Default order is `created_at` descending.
        List items also carry `members_count` and `active_members_count`.
      operationId: listAiLoadBalancers
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - $ref: ../../components/parameters/query/Unprovisioned.yaml
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - strategy
          - status
          - created_at
          - updated_at
          default: created_at
      - $ref: ../../components/parameters/query/SortOrder.yaml
        description: Sort direction. Defaults to `desc` on this endpoint.
      - name: strategy
        in: query
        schema:
          type: string
          enum:
          - round_robin
          - priority
          - percentage
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: search
        in: query
        description: Substring match on name or description
        schema:
          type: string
      responses:
        '200':
          description: List of load balancers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
    post:
      tags:
      - AI Load Balancers
      summary: Create AI load balancer
      description: |
        Create an AI assistant load balancer with members. Owner and PBX Admin only.
        `strategy` defaults to `round_robin`, `status` to `active` and `fallback_action` to
        `hangup`. Only the fallback_*_id matching `fallback_action` is stored; the others are
        cleared. Every member must be an active AI assistant of the organization. A fallback
        extension, ring group, IVR menu or AI assistant must be active, and the fallback AI
        assistant cannot also be a member.
      operationId: createAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
                - required:
                    - name
                    - members
      responses:
        '201':
          description: Load balancer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistantloadbalancer created successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/ai-assistant-load-balancers/{ai_assistant_load_balancer}:
    parameters:
    - name: ai_assistant_load_balancer
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - AI Load Balancers
      summary: Get AI load balancer
      description: Get load balancer details with members and fallback configuration
      operationId: getAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:read
      responses:
        '200':
          description: Load balancer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - AI Load Balancers
      summary: Update AI load balancer
      description: &updDesc |
        Update a load balancer. Owner and PBX Admin only. All fields are optional. When
        `members` is sent it replaces the whole member list (at least one). When
        `fallback_action` is omitted the stored action and target are kept. The same member
        and fallback checks as create apply; in addition the load balancer cannot fall back to
        itself, and a chain of `ai_load_balancer` fallbacks must not lead back to it (422).
        A concurrent update of the same load balancer returns 409 after waiting up to 5 seconds.
      operationId: updateAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
      responses:
        '200':
          description: Load balancer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistantloadbalancer updated successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Conflict
                message: Load balancer is currently being modified. Please try again.
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - AI Load Balancers
      summary: Partially update AI load balancer
      description: *updDesc
      operationId: patchAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
      responses:
        '200':
          description: Load balancer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistantloadbalancer updated successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Conflict
                message: Load balancer is currently being modified. Please try again.
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - AI Load Balancers
      summary: Delete AI load balancer
      description: Owner and PBX Admin only. Refused with 409 when the load balancer is still referenced (for example by extensions or routing). The 409 body lists the references.
      operationId: deleteAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      responses:
        '204':
          description: Load balancer deleted
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          $ref: ../../components/responses/ResourceInUse.yaml
