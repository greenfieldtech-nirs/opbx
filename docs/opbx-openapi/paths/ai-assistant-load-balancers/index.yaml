paths:
  /v1/ai-assistant-load-balancers:
    get:
      tags:
      - AI Load Balancers
      summary: List AI load balancers
      description: 'Get paginated list of AI assistant load balancers with member details.

        Supports filtering by strategy, status, and search.

        '
      operationId: listAiLoadBalancers
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - $ref: ../../components/parameters/query/Unprovisioned.yaml
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - strategy
          - status
          - created_at
          - updated_at
          default: created_at
      - $ref: ../../components/parameters/query/SortOrder.yaml
      - name: strategy
        in: query
        schema:
          type: string
          enum:
          - round_robin
          - priority
          - percentage
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of load balancers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
    post:
      tags:
      - AI Load Balancers
      summary: Create AI load balancer
      description: 'Create a new AI assistant load balancer with members.

        Fallback action determines which fallback fields are used.

        '
      operationId: createAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
                - required:
                    - name
                    - strategy
                    - fallback_action
                    - status
                    - members
      responses:
        '201':
          description: Load balancer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/ai-assistant-load-balancers/{ai_assistant_load_balancer}:
    parameters:
    - name: ai_assistant_load_balancer
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - AI Load Balancers
      summary: Get AI load balancer
      description: Get load balancer details with members and fallback configuration
      operationId: getAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:read
      responses:
        '200':
          description: Load balancer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - AI Load Balancers
      summary: Update AI load balancer
      description: 'Update load balancer configuration. Members are replaced if provided.

        Uses distributed locking to prevent concurrent updates.

        '
      operationId: updateAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
      responses:
        '200':
          description: Load balancer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Conflict
                message: Load balancer is currently being modified. Please try again.
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - AI Load Balancers
      summary: Partially update AI load balancer
      description: 'Update load balancer configuration. Members are replaced if provided.

        Uses distributed locking to prevent concurrent updates.

        '
      operationId: patchAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantLoadBalancerInput.yaml'
      responses:
        '200':
          description: Load balancer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/AiAssistantLoadBalancer.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Conflict
                message: Load balancer is currently being modified. Please try again.
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - AI Load Balancers
      summary: Delete AI load balancer
      description: Refused with 409 when the load balancer is still referenced (for example by extensions or routing). The 409 body lists the references.
      operationId: deleteAiLoadBalancer
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistant-load-balancers:write
      responses:
        '204':
          description: Load balancer deleted
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          $ref: ../../components/responses/ResourceInUse.yaml
