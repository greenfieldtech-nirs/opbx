paths:
  /v1/trunks:
    get:
      tags:
        - Trunks
      summary: List Trunks
      description: |
        List the SIP trunks of the organization's Cloudonix domain, optionally filtered by
        direction (exact match on the Cloudonix value). Owner and PBX Admin only. Each trunk
        carries the names of the outbound whitelist entries that use it.
      operationId: listTrunks
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:read
      parameters:
        - name: direction
          in: query
          required: false
          description: Filter trunks by direction.
          schema:
            type: string
            enum:
            - inbound
            - outbound
            - public-inbound
            - public-outbound
      responses:
        '200':
          description: List of trunks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/Trunk.yaml'
                  meta:
                    type: object
                    properties:
                      sip_hostname:
                        type: string
                        description: SIP hostname of the domain (`<domain uuid, lowercase>.sip.cloudonix.net`)
                        example: 3f1c8a3e-7b2d-4c1e-9a55-2d6e0f9b1a10.sip.cloudonix.net
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: The organization has no Cloudonix settings
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.

    post:
      tags:
        - Trunks
      summary: Create Trunk
      description: >-
        Create a trunk in Cloudonix. Only `inbound`/`outbound` directions are
        accepted; Cloudonix normalizes them to `public-inbound`/`public-outbound`.
        `password` is write-only and is never returned in responses. `overwrite_from` is
        sent to Cloudonix only together with `username`/`password`. Owner and PBX Admin
        only. `in_use_by` is always empty in the response.
      operationId: createTrunk
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 64
                ip:
                  type: string
                  description: IPv4, IPv6, or hostname of the trunk peer.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                transport:
                  type: string
                  enum:
                  - udp
                  - tcp
                  - tls
                direction:
                  type: string
                  enum:
                  - inbound
                  - outbound
                prefix:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                username:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  description: Required when `password` is provided.
                password:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  writeOnly: true
                  description: Required when `username` is provided. Never serialized in responses.
                overwrite_from:
                  type: boolean
                  description: Applied only when `username` or `password` is sent
              required:
              - name
              - ip
              - port
              - transport
              - direction
      responses:
        '201':
          description: Trunk created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/Trunk.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: The organization has no Cloudonix settings
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.
