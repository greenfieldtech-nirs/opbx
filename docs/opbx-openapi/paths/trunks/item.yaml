paths:
  /v1/trunks/{trunk}:
    parameters:
      - name: trunk
        in: path
        required: true
        description: Cloudonix trunk id or uuid.
        schema:
          type: string

    get:
      tags:
        - Trunks
      summary: Get Trunk
      description: One trunk of the organization's Cloudonix domain, with `in_use_by`. Owner and PBX Admin only.
      operationId: getTrunk
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:read
      responses:
        '200':
          description: Trunk details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/Trunk.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: >-
            Trunk not found in Cloudonix (`error` is `not_found`), or the organization has no
            Cloudonix settings (standard 404 body).
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.

    put:
      tags:
        - Trunks
      summary: Update Trunk
      description: >-
        Update a trunk in Cloudonix. `name` and `direction` are immutable
        post-create. All fields are optional. Omitting `password` leaves the
        stored credential untouched; `password` is write-only and is never
        returned in responses. `overwrite_from` is sent to Cloudonix only together
        with `username`/`password`. Owner and PBX Admin only. `in_use_by` is always
        empty in the response.
      operationId: updateTrunk
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  type: string
                  description: IPv4, IPv6, or hostname of the trunk peer.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                transport:
                  type: string
                  enum:
                  - udp
                  - tcp
                  - tls
                prefix:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                username:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  description: May be sent alone (keeps the stored password).
                password:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  writeOnly: true
                  description: Requires `username`. Never serialized in responses.
                overwrite_from:
                  type: boolean
                  description: Applied only when `username` or `password` is sent
      responses:
        '200':
          description: Trunk updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/Trunk.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: >-
            Trunk not found in Cloudonix (`error` is `not_found`), or the organization has no
            Cloudonix settings (standard 404 body).
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.
    patch:
      tags:
        - Trunks
      summary: Partially update a trunk
      description: >-
        Update a trunk in Cloudonix. `name` and `direction` are immutable
        post-create. All fields are optional. Omitting `password` leaves the
        stored credential untouched; `password` is write-only and is never
        returned in responses. `overwrite_from` is sent to Cloudonix only together
        with `username`/`password`. Owner and PBX Admin only. `in_use_by` is always
        empty in the response.
      operationId: patchTrunk
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  type: string
                  description: IPv4, IPv6, or hostname of the trunk peer.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                transport:
                  type: string
                  enum:
                  - udp
                  - tcp
                  - tls
                prefix:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                username:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  description: May be sent alone (keeps the stored password).
                password:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  writeOnly: true
                  description: Requires `username`. Never serialized in responses.
                overwrite_from:
                  type: boolean
                  description: Applied only when `username` or `password` is sent
      responses:
        '200':
          description: Trunk updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/Trunk.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: >-
            Trunk not found in Cloudonix (`error` is `not_found`), or the organization has no
            Cloudonix settings (standard 404 body).
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.

    delete:
      tags:
        - Trunks
      summary: Delete Trunk
      description: Deletes the trunk in Cloudonix. Owner and PBX Admin only. Outbound whitelist entries that use it are not changed.
      operationId: deleteTrunk
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: trunks:write
      responses:
        '204':
          description: Trunk deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not an Owner or PBX Admin
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: >-
            Trunk not found in Cloudonix (`error` is `not_found`), or the organization has no
            Cloudonix settings (standard 404 body).
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '502':
          description: Cloudonix API unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: cloudonix_unavailable
                message: Unable to reach the Cloudonix API. Please try again later.
