paths:
  /v1/embed/config:
    options:
      tags:
        - Embedded Dialer
      summary: CORS preflight for embed config
      description: |
        Answers the browser CORS preflight for the embedded dialer. Reflects the request
        `Origin` and allows the `Authorization` and `Content-Type` headers, with a 600 second
        max age. Not token-authenticated, because preflight requests cannot carry the bearer
        token. The real GET enforces the token and the origin allowlist (`embed_allowed_domains`).
        The same preflight answer is returned for any `OPTIONS /v1/embed/*` path
        (`calls-log`, `transfer`, `directory`, `session`).
      operationId: embedConfigPreflight
      security: []
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Echo of the request `Origin`.
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, POST, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Authorization, Content-Type
            Access-Control-Max-Age:
              schema:
                type: string
                example: '600'
            Vary:
              schema:
                type: string
                example: Origin

    get:
      tags:
        - Embedded Dialer
      summary: Get embedded Web Phone SIP provisioning
      description: |
        Returns JsSIP-compatible SIP provisioning for the embed token's
        target user, identical in shape to `GET /v1/webphone/config` but
        authenticated by an embed token instead of a session/bearer token.

        Called by the widget iframe (`/embed/dialer`), not directly by host
        pages. See the [Embedded Dialer guide](/opbx/modules/embedded-dialer).

        Because the response carries SIP credentials, a request with no
        `Origin` header is accepted only when the browser marks it
        `Sec-Fetch-Site: same-origin` (the widget iframe); otherwise 403.
        The country defaults to `us` when the organization has no country setting.

        Rate limited to 60 requests per minute per token and IP. An absent
        `Origin` passes the allowlist check; a present one must match an
        allowlisted host (or `host:port`). When an `Origin` is sent it is
        reflected in `Access-Control-Allow-Origin`.
      operationId: getEmbedConfig
      security:
        - embedTokenAuth: []
      responses:
        '200':
          description: SIP provisioning for the embedded softphone
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sip_username:
                        type: string
                        example: '1001'
                      sip_password:
                        type: string
                      sip_domain:
                        type: string
                        example: acme.cloudonix.net
                      sip_uri:
                        type: string
                        example: sip:1001@acme.cloudonix.net
                      display_name:
                        type: string
                        example: Jane Owner
                      wss_server:
                        type: string
                        example: wss://webrtc.cloudonix.io
                      websocket_port:
                        type: integer
                        example: 443
                      server_path:
                        type: string
                        example: ''
                      sip_contact:
                        type: string
                        example: '1001'
                      profile_name:
                        type: string
                        example: Jane Owner
                      registration_mode:
                        type: string
                        example: Direct
                      country:
                        type: string
                        example: us
                      settings:
                        type: object
                        description: Web Phone settings from the user's Cloudonix subscriber profile, as in `GET /v1/webphone/config`.
                        properties:
                          auto_answer: { type: boolean, example: false }
                          keep_alive: { type: boolean, example: true }
                          refresh_on_hangup: { type: boolean, example: true }
                      transfer_enabled:
                        type: boolean
                        description: The embed token's "Allow call transfer" switch (`allow_transfer`); when false the widget offers no transfer and `POST /v1/embed/transfer` answers 403.
                        example: false
        '401':
          description: Missing or invalid embed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid embed token.
        '403':
          description: >-
            Origin not in the allowlist, no Origin on a cross-site request, or the
            token's user or organization is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                originNotAllowed:
                  value:
                    message: Origin not allowed.
                originRequired:
                  value:
                    message: Origin required.
                inactive:
                  value:
                    message: Embed token is not active.
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '404':
          description: The target user has no extension assigned or the organization has no Cloudonix settings configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Embedded dialer configuration is unavailable.

  /v1/embed/calls-log:
    get:
      tags:
        - Embedded Dialer
      summary: Get embedded Web Phone recent calls
      description: |
        Returns the 50 most recent calls placed from the embed token's target
        user's extension, identical in shape to `GET /v1/webphone/calls-log`
        but authenticated by an embed token instead of a session/bearer token.
        Coaching sentinel destinations (spy/barge/whisper) are excluded.
        Returns an empty list when the user has no extension.

        Rate limited to 60 requests per minute per token and IP. An absent
        `Origin` passes the allowlist check; a present one must match an
        allowlisted host (or `host:port`). When an `Origin` is sent it is
        reflected in `Access-Control-Allow-Origin`.
      operationId: getEmbedCallsLog
      security:
        - embedTokenAuth: []
      responses:
        '200':
          description: Recent calls for the embedded user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                          example: '+14155551212'
                        session_timestamp:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        duration:
                          type: integer
                          description: Duration in seconds
                          example: 125
                        duration_formatted:
                          type: string
                          description: MM:SS (minutes are not wrapped into hours)
                          example: '02:05'
                        disposition:
                          type:
                            - string
                            - 'null'
                          description: Cloudonix CDR disposition
                          example: ANSWER
        '401':
          description: Missing or invalid embed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid embed token.
        '403':
          description: Origin not in the allowlist, or the token's user or organization is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                originNotAllowed:
                  value:
                    message: Origin not allowed.
                inactive:
                  value:
                    message: Embed token is not active.
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'

  /v1/embed/transfer:
    post:
      tags:
        - Embedded Dialer
      summary: Blind-transfer the embedded dialer's call
      description: |
        Same as `POST /v1/webphone/transfer` for the embed token's target user. Only when the embed
        token has "Allow call transfer" on (`allow_transfer`), otherwise 403. Like `GET /v1/embed/config`,
        a request without an `Origin` header is accepted only when the browser marks it
        `Sec-Fetch-Site: same-origin` (the widget iframe). Rate limited to 60 requests per minute per
        token and IP.
      operationId: transferEmbedCall
      security:
        - embedTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [call_id, destination]
              properties:
                call_id:
                  type: string
                  maxLength: 255
                  description: SIP Call-ID of the widget's leg.
                destination:
                  type: string
                  pattern: '^\+?[0-9]{1,20}$'
                  description: Extension number or phone number (digits, optional leading `+`).
                  example: '1002'
      responses:
        '200':
          description: The transfer was started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transferred: { type: boolean, example: true }
        '401':
          description: Missing or invalid embed token
        '403':
          description: Origin not allowed or missing, token's user or organization not active, or call transfer not enabled for this embedded dialer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Call transfer is not enabled for this embedded dialer.
        '404':
          description: The user has no extension, or the call was not found (it may have ended)
        '422':
          description: Validation failed, or `destination` is the user's own extension
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '502':
          description: Cloudonix did not accept the transfer; the call is still connected

  /v1/embed/directory:
    get:
      tags:
        - Embedded Dialer
      summary: Extensions to suggest as transfer targets (embedded dialer)
      description: |
        Same list as `GET /v1/webphone/directory` for the embed token's target user. Requires
        `allow_transfer` on the token and a widget request (an `Origin`, or `Sec-Fetch-Site: same-origin`),
        otherwise 403.
      operationId: getEmbedDirectory
      security:
        - embedTokenAuth: []
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        extension_number: { type: string, example: '1002' }
                        name: { type: [string, 'null'], example: Sam Agent }
        '401':
          description: Missing or invalid embed token
        '403':
          description: Origin not allowed or missing, token's user or organization not active, or call transfer not enabled
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'

  /v1/embed/session:
    get:
      tags:
        - Embedded Dialer
      summary: Cloudonix session token of the embedded dialer's call
      description: |
        Same as `GET /v1/webphone/session` for the embed token's target user. Requires a widget request
        (an `Origin`, or `Sec-Fetch-Site: same-origin`), otherwise 403; does not require `allow_transfer`.
      operationId: getEmbedSession
      security:
        - embedTokenAuth: []
      parameters:
        - name: call_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_token: { type: string }
        '401':
          description: Missing or invalid embed token
        '403':
          description: Origin not allowed or missing, or the token's user or organization is not active
        '404':
          description: The call was not found (not reported yet, or not the user's)
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
