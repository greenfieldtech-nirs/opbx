paths:
  /v1/embed/config:
    options:
      tags:
        - Embedded Dialer
      summary: CORS preflight for embed config
      description: |
        Answers the browser CORS preflight for the embedded dialer. Reflects the request
        `Origin` and allows the `Authorization` and `Content-Type` headers, with a 600 second
        max age. Not token-authenticated, because preflight requests cannot carry the bearer
        token. The real GET enforces the token and the origin allowlist (`embed_allowed_domains`).
        The same preflight answer is returned for any `OPTIONS /v1/embed/*` path,
        including `/v1/embed/calls-log`.
      operationId: embedConfigPreflight
      security: []
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Echo of the request `Origin`.
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Authorization, Content-Type
            Access-Control-Max-Age:
              schema:
                type: string
                example: '600'
            Vary:
              schema:
                type: string
                example: Origin

    get:
      tags:
        - Embedded Dialer
      summary: Get embedded Web Phone SIP provisioning
      description: |
        Returns JsSIP-compatible SIP provisioning for the embed token's
        target user, identical in shape to `GET /v1/webphone/config` but
        authenticated by an embed token instead of a session/bearer token.

        Called by the widget iframe (`/embed/dialer`), not directly by host
        pages. See the [Embedded Dialer guide](/opbx/modules/embedded-dialer).

        Because the response carries SIP credentials, a request with no
        `Origin` header is accepted only when the browser marks it
        `Sec-Fetch-Site: same-origin` (the widget iframe); otherwise 403.
        The country defaults to `us` when the organization has no country setting.

        Rate limited to 60 requests per minute per token and IP. An absent
        `Origin` passes the allowlist check; a present one must match an
        allowlisted host (or `host:port`). When an `Origin` is sent it is
        reflected in `Access-Control-Allow-Origin`.
      operationId: getEmbedConfig
      security:
        - embedTokenAuth: []
      responses:
        '200':
          description: SIP provisioning for the embedded softphone
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sip_username:
                        type: string
                        example: '1001'
                      sip_password:
                        type: string
                      sip_domain:
                        type: string
                        example: acme.cloudonix.net
                      sip_uri:
                        type: string
                        example: sip:1001@acme.cloudonix.net
                      display_name:
                        type: string
                        example: Jane Owner
                      wss_server:
                        type: string
                        example: wss://webrtc.cloudonix.io
                      websocket_port:
                        type: integer
                        example: 443
                      server_path:
                        type: string
                        example: ''
                      sip_contact:
                        type: string
                        example: '1001'
                      profile_name:
                        type: string
                        example: Jane Owner
                      registration_mode:
                        type: string
                        example: Direct
                      country:
                        type: string
                        example: us
        '401':
          description: Missing or invalid embed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid embed token.
        '403':
          description: >-
            Origin not in the allowlist, no Origin on a cross-site request, or the
            token's user or organization is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                originNotAllowed:
                  value:
                    message: Origin not allowed.
                originRequired:
                  value:
                    message: Origin required.
                inactive:
                  value:
                    message: Embed token is not active.
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '404':
          description: The target user has no extension assigned or the organization has no Cloudonix settings configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Embedded dialer configuration is unavailable.

  /v1/embed/calls-log:
    get:
      tags:
        - Embedded Dialer
      summary: Get embedded Web Phone recent calls
      description: |
        Returns the 50 most recent calls placed from the embed token's target
        user's extension, identical in shape to `GET /v1/webphone/calls-log`
        but authenticated by an embed token instead of a session/bearer token.
        Coaching sentinel destinations (spy/barge/whisper) are excluded.
        Returns an empty list when the user has no extension.

        Rate limited to 60 requests per minute per token and IP. An absent
        `Origin` passes the allowlist check; a present one must match an
        allowlisted host (or `host:port`). When an `Origin` is sent it is
        reflected in `Access-Control-Allow-Origin`.
      operationId: getEmbedCallsLog
      security:
        - embedTokenAuth: []
      responses:
        '200':
          description: Recent calls for the embedded user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                          example: '+14155551212'
                        session_timestamp:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        duration:
                          type: integer
                          description: Duration in seconds
                          example: 125
                        duration_formatted:
                          type: string
                          description: MM:SS
                          example: '02:05'
                        disposition:
                          type: string
                          example: answered
        '401':
          description: Missing or invalid embed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid embed token.
        '403':
          description: Origin not in the allowlist, or the token's user or organization is not active
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                originNotAllowed:
                  value:
                    message: Origin not allowed.
                inactive:
                  value:
                    message: Embed token is not active.
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
