paths:
  /v1/supervisors/{user}/assignments:
    get:
      tags:
        - Supervisors
      summary: Get supervisor assignments
      description: |
        Returns the users and ring groups assigned to a Supervisor. If the target
        user is not a Supervisor, the `user_ids` and `ring_group_ids` arrays are empty
        and `users` / `ring_groups` are omitted. Owner and PBX Admin can view any
        supervisor's assignments in their organization; a supervisor may view their own.
      operationId: getSupervisorAssignments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: supervisors:read
      parameters:
        - name: user
          in: path
          required: true
          description: ID of the Supervisor user.
          schema:
            type: integer
      responses:
        '200':
          description: Current assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/SupervisorAssignment'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../openapi.yaml#/components/responses/NotFound'
    put:
      tags:
        - Supervisors
      summary: Update supervisor assignments
      description: |
        Replaces the Supervisor's assigned users and ring groups with the supplied
        sets (duplicates are ignored; send empty arrays to clear). All resources must
        belong to the caller's organization. Only users with the `pbx_user` role can be
        assigned, and a Supervisor cannot be assigned to themselves. Owner and PBX Admin only.
      operationId: updateSupervisorAssignments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: supervisors:write
      parameters:
        - name: user
          in: path
          required: true
          description: ID of the Supervisor user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
                - ring_group_ids
              properties:
                user_ids:
                  type: array
                  description: IDs of organization users (role `pbx_user`) this Supervisor may monitor. Required, may be empty.
                  items:
                    type: integer
                ring_group_ids:
                  type: array
                  description: IDs of ring groups this Supervisor may monitor. Required, may be empty.
                  items:
                    type: integer
      responses:
        '200':
          description: Updated assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/SupervisorAssignment'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../openapi.yaml#/components/responses/NotFound'
        '422':
          description: |
            Validation failed (standard validation body, for example an ID that does not
            exist in the organization), or a rule was broken (`{"message": ...}`): the
            target user is not a Supervisor, a user or ring group belongs to another
            organization, the Supervisor is in `user_ids`, or a user is not a PBX User.
          content:
            application/json:
              schema:
                $ref: '../../openapi.yaml#/components/schemas/Error'
              example:
                message: Only PBX Users can be assigned as supervised users.
