paths:
  /v1/supervisors/{user}/assignments:
    get:
      tags:
        - Supervisors
      summary: Get supervisor assignments
      description: |
        Returns the users and ring groups assigned to a Supervisor. If the target
        user is not a Supervisor, the `user_ids` and `ring_group_ids` arrays are empty.
        Owner and PBX Admin can view any supervisor's assignments; a supervisor may
        view their own.
      operationId: getSupervisorAssignments
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: user
          in: path
          required: true
          description: ID of the Supervisor user.
          schema:
            type: integer
      responses:
        '200':
          description: Current assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/SupervisorAssignment'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../openapi.yaml#/components/responses/NotFound'
    put:
      tags:
        - Supervisors
      summary: Update supervisor assignments
      description: |
        Replaces the Supervisor's assigned users and ring groups with the supplied
        sets. All resources must belong to the same organization. A Supervisor cannot
        be assigned to themselves or to another Supervisor. Owner and PBX Admin only.
      operationId: updateSupervisorAssignments
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: user
          in: path
          required: true
          description: ID of the Supervisor user.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
                - ring_group_ids
              properties:
                user_ids:
                  type: array
                  description: IDs of organization users this Supervisor may monitor.
                  items:
                    type: integer
                ring_group_ids:
                  type: array
                  description: IDs of ring groups this Supervisor may monitor.
                  items:
                    type: integer
      responses:
        '200':
          description: Updated assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/SupervisorAssignment'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: '../../openapi.yaml#/components/responses/ValidationError'
