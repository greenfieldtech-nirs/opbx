        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - Call Tracking Campaigns
      summary: Delete campaign
      description: |
        Delete a call tracking campaign from the organization. Owner and PBX
        Admin only. Returns 409 while the campaign still has tracking numbers;
        remove them first. Deleting the campaign also deletes its call tracking
        sessions, notification settings and notification logs.
      operationId: deleteCallTrackingCampaign
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: call-tracking-campaigns:write
      responses:
        '204':
          description: Campaign deleted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          $ref: ../../components/responses/ResourceInUse.yaml
