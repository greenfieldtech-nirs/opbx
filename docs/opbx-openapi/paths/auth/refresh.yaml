paths:
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication
      description: |
        Refresh the Bearer token: revokes the current token and issues a new one
        with role-scoped abilities (no `user` in the response).

        The new token keeps the lifetime of the current one: 24 hours, or 30 days for a
        token issued by a "Remember me" login. Not rate limited.
      operationId: refreshAuth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authentication refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: New bearer token
                    example: 1|new_laravel_sanctum_token_abc456
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds (86400, or 2592000 for a "Remember me" token)
                    example: 86400
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
