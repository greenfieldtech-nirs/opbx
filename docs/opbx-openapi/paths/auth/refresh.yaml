paths:
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication
      description: |
        Refresh authentication credentials.
        
        Supports both authentication modes:
        - Cookie-based: Regenerates session, extends cookie expiration
        - Token-based: Revokes current token and issues a new one
        
        Token expires in 24 hours (1440 minutes).
      operationId: refreshAuth
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Authentication refreshed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - title: Cookie Auth Response
                    type: object
                    properties:
                      message:
                        type: string
                        example: Session refreshed successfully
                      user:
                        $ref: '../../components/schemas/User.yaml'
                  - title: Token Auth Response
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: New bearer token
                        example: 1|new_laravel_sanctum_token_abc456
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        description: Token expiration in seconds
                        example: 86400
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
