paths:
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication
      description: |
        Refresh the Bearer token: revokes the current token and issues a new one
        with role-scoped abilities (no `user` in the response).

        Token expires in 24 hours (1440 minutes). Not rate limited.
      operationId: refreshAuth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authentication refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: New bearer token
                    example: 1|new_laravel_sanctum_token_abc456
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Token expiration in seconds
                    example: 86400
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
