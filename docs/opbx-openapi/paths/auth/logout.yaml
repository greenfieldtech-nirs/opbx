paths:
  /v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: |
        Logout user: deletes the current Bearer access token only (the user's other
        tokens stay valid).
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
