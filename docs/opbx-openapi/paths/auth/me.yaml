paths:
  /v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: |
        Returns current authenticated user details including organization information.
        Validates that the user belongs to an active organization.

        The `user` object is the same subset returned by login (`id`,
        `organization_id`, `name`, `email`, `role`, `status`,
        `is_platform_manager`, `social_identities`) plus `organization`.
        When a platform owner is operating as another organization
        (`X-Operate-As-Organization`), the fields describe the effective owner
        of the target organization and an `operate_as` block is added.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: '../../components/schemas/User.yaml'
                      - type: object
                        properties:
                          organization:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: Acme Corporation
                              slug:
                                type: string
                                example: acme-corporation
                              status:
                                type: string
                                example: active
                              timezone:
                                type: string
                                example: America/New_York
                          operate_as:
                            type: object
                            description: Present only while operate-as (platform-owner impersonation) is active
                            properties:
                              active:
                                type: boolean
                                example: true
                              organization:
                                type:
                                  - object
                                  - 'null'
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                              real_user_id:
                                type: integer
                                description: ID of the real platform-manager user
              example:
                user:
                  id: 123
                  organization_id: 1
                  name: John Doe
                  email: john@example.com
                  role: owner
                  status: active
                  is_platform_manager: false
                  social_identities: []
                  organization:
                    id: 1
                    name: Acme Corporation
                    slug: acme-corporation
                    status: active
                    timezone: America/New_York
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Organization inactive or invalid
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              examples:
                invalidOrg:
                  summary: Invalid organization
                  value:
                    error: Invalid organization
                    message: Your account is not associated with a valid organization
                orgInactive:
                  summary: Organization inactive
                  value:
                    error: Organization inactive
                    message: Your organization is not active. Please contact support.
