paths:
  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticate user and issue authentication credentials.
        
        Supports two authentication modes:
        - **Cookie-based (SPA)**: Returns user data, sets httpOnly session cookie
        - **Token-based (API)**: Returns API token for bearer authentication
        
        Mode is automatically detected based on request headers, in this order:
        - Token auth if an `Authorization: Bearer` header is present
        - Cookie auth if `X-Auth-Mode: cookie`; token auth if `X-Auth-Mode: token`
        - Cookie auth if an `X-Requested-With` header is present (any value)
        - Otherwise token-based auth

        Token-based login revokes all of the user's existing tokens and issues a
        new one with role-scoped abilities, valid for 24 hours.

        Rate limited to 5 attempts per minute per IP (`RATE_LIMIT_AUTH`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: User email address
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User password
                  example: SecurePass123!
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                oneOf:
                  - title: Cookie Auth Response
                    type: object
                    properties:
                      message:
                        type: string
                        example: Login successful
                      user:
                        description: >-
                          Subset of the User object: `id`, `organization_id`, `name`, `email`,
                          `role`, `status`, `is_platform_manager` and `social_identities`
                          (`[{provider, provider_email}]`). `phone`, `extension` and
                          timestamps are not returned.
                        allOf:
                          - $ref: '../../components/schemas/User.yaml'
                    required:
                      - message
                      - user
                  - title: Token Auth Response
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: Bearer token for API authentication
                        example: 1|laravel_sanctum_token_xyz123
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        description: Token expiration in seconds
                        example: 86400
                      user:
                        description: Same user subset as the cookie response.
                        allOf:
                          - $ref: '../../components/schemas/User.yaml'
                    required:
                      - access_token
                      - token_type
                      - expires_in
                      - user
              examples:
                cookieAuth:
                  summary: Cookie-based authentication
                  value:
                    message: Login successful
                    user:
                      id: 123
                      organization_id: 1
                      name: John Doe
                      email: john@example.com
                      role: owner
                      status: active
                      is_platform_manager: false
                      social_identities: []
                tokenAuth:
                  summary: Token-based authentication
                  value:
                    access_token: 1|laravel_sanctum_token_xyz123
                    token_type: Bearer
                    expires_in: 86400
                    user:
                      id: 123
                      organization_id: 1
                      name: John Doe
                      email: john@example.com
                      role: owner
                      status: active
                      is_platform_manager: false
                      social_identities: []
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (only in cookie auth mode)
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid credentials.
                  details:
                    email: john@example.com
                  request_id: 9b2f6c1e-3a4d-4e5f-8a9b-0c1d2e3f4a5b
        '403':
          description: Account or organization inactive
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              examples:
                accountInactive:
                  summary: User account inactive
                  value:
                    error:
                      code: ACCOUNT_INACTIVE
                      message: Your account is not active. Please contact support.
                      details:
                        account_inactive: true
                      request_id: 9b2f6c1e-3a4d-4e5f-8a9b-0c1d2e3f4a5b
                orgInactive:
                  summary: Organization inactive
                  value:
                    error:
                      code: ORGANIZATION_INACTIVE
                      message: Your organization is not active. Please contact support.
                      details:
                        organization_id: 1
                      request_id: 9b2f6c1e-3a4d-4e5f-8a9b-0c1d2e3f4a5b
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Too Many Requests
                message: Too many login attempts. Please try again later.
                retry_after: 60
