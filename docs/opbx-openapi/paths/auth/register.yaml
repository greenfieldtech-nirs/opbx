paths:
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register new organization
      description: 'Register a new organization with an owner user.


        Creates:

        1. New organization with default settings

        2. Owner user with full permissions

        3. API token for immediate access


        Rate limited to 10 registration attempts per hour per IP.


        The admin email must be unique across all organizations and pass the

        email-domain check (disposable, blocklisted, role-account, etc.). When

        reCAPTCHA is enabled, a supplied `recaptcha_token` is verified with Google. The token is optional:
        a request without it is not checked.

        '
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 100
                      description: Organization name (must be unique)
                      example: Acme Corporation
                    timezone:
                      type: string
                      description: Organization timezone (any PHP timezone identifier)
                      example: America/New_York
                    slug:
                      type:
                      - string
                      - 'null'
                      minLength: 2
                      maxLength: 50
                      pattern: ^[a-z0-9\-]+$
                      description: URL-friendly slug, must be unique (generated from the name when empty or omitted)
                      example: acme-corporation
                  required:
                  - name
                  - timezone
                admin:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 100
                      description: Admin full name
                      example: John Doe
                    email:
                      type: string
                      format: email
                      maxLength: 255
                      description: Admin email address
                      example: admin@example.com
                    password:
                      type: string
                      format: password
                      minLength: 8
                      description: 'Password must contain:

                        - At least 8 characters

                        - Upper and lowercase letters

                        - At least one number

                        - At least one special character

                        '
                      example: SecurePass123!
                    password_confirmation:
                      type: string
                      description: Password confirmation (must match password)
                      example: SecurePass123!
                  required:
                  - name
                  - email
                  - password
                  - password_confirmation
                recaptcha_token:
                  type:
                  - string
                  - 'null'
                  description: 'Optional reCAPTCHA v3 token. Verified when reCAPTCHA is enabled and the token is sent; omitting it skips the check.'
              required:
              - organization
              - admin
      responses:
        '201':
          description: Organization registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization registered successfully
                  user:
                    type: object
                    description: The new owner user
                    properties:
                      id:
                        type: integer
                      organization_id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum:
                        - owner
                      status:
                        type: string
                        enum:
                        - active
                  organization:
                    type: object
                    description: The new organization
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                        example: active
                      timezone:
                        type: string
                  access_token:
                    type: string
                    description: Bearer token for immediate access
                    example: 1|laravel_sanctum_token_xyz123
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Token expiration in seconds (24 hours)
                    example: 86400
              example:
                message: Organization registered successfully
                user:
                  id: 123
                  organization_id: 1
                  name: John Doe
                  email: admin@example.com
                  role: owner
                  status: active
                organization:
                  id: 1
                  name: Acme Corporation
                  slug: acme-corporation
                  status: active
                  timezone: America/New_York
                access_token: 1|laravel_sanctum_token_xyz123
                token_type: Bearer
                expires_in: 86400
        '422':
          $ref: ../../components/responses/ValidationError.yaml
        '429':
          description: Too many registration attempts
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Too many registration attempts. Please try again in 1 hour.
                  retry_after: 3600
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error:
                  code: REGISTRATION_FAILED
                  message: An error occurred during registration. Please try again.
