paths:
  /v1/auth/auth0/redirect:
    post:
      tags:
        - Authentication
      summary: Initiate Auth0 OAuth redirect
      description: |
        Start the Auth0 Universal Login / social-provider OAuth flow.
        Returns the Auth0 authorize URL and a state token the client should
        use when handling the callback.

        Rate limited to 5 requests per minute per IP (`RATE_LIMIT_AUTH`).
      operationId: auth0Redirect
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/Auth0RedirectRequest.yaml'
      responses:
        '200':
          description: Redirect URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri
                    description: Auth0 authorize URL to redirect the user to
                    example: https://example.auth0.com/authorize?client_id=...
                  state:
                    type: string
                    description: State token to validate on callback
                    example: abc123def456
                required:
                  - redirect_url
                  - state
        '400':
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: AUTH0_INVALID_PROVIDER
                  message: Invalid provider selected.
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '503':
          description: Auth0 is not configured
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: AUTH0_NOT_CONFIGURED
                  message: Auth0 is not enabled.
  /v1/auth/auth0/callback:
    get:
      tags:
        - Authentication
      summary: Auth0 OAuth callback
      description: |
        Callback endpoint invoked by the browser after Auth0 authentication.
        Exchanges the authorization `code` and `state` for a user profile and
        completes login, registration, account linking, or invitation acceptance.

        - Login / register / invitation: returns a bearer token (24 hours).
          With intent `register` and no existing account, a new organization and
          owner are created. With intent `login` and no existing account, the
          response is `409 AUTH0_REGISTRATION_REQUIRED` with an `onboarding_id`
          (the verified profile is kept server-side for 60 minutes).
        - Link: returns `{"message": "Identity linked successfully."}`.

        Rate limited to 5 requests per minute per IP (`RATE_LIMIT_AUTH`).
      operationId: auth0Callback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Auth0 authorization code
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State token returned by the redirect endpoint
      responses:
        '200':
          description: Authentication completed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - title: Login Response
                    $ref: '../../components/schemas/Auth0CallbackResponse.yaml'
                  - title: Link Response
                    type: object
                    properties:
                      message:
                        type: string
                        example: Identity linked successfully.
                    required:
                      - message
        '403':
          description: Resolved user account is not active
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: ACCOUNT_INACTIVE
                  message: Account is not active.
        '400':
          description: Invalid callback parameters or state
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              examples:
                missingParameters:
                  summary: Missing code or state
                  value:
                    error:
                      code: AUTH0_INVALID_CALLBACK
                      message: Missing code or state.
                invalidState:
                  summary: Invalid or expired state
                  value:
                    error:
                      code: AUTH0_INVALID_STATE
                      message: Invalid provider in state.
        '409':
          description: Account conflict, identity already linked, or registration required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - AUTH0_ACCOUNT_EXISTS
                          - AUTH0_LINK_ALREADY_LINKED
                          - AUTH0_REGISTRATION_REQUIRED
                      message:
                        type: string
                    required:
                      - code
                      - message
                  profile:
                    type: object
                    description: Only with `AUTH0_REGISTRATION_REQUIRED`
                    properties:
                      onboarding_id:
                        type: string
                        description: >-
                          Opaque 48-character id of the verified profile, cached
                          server-side for 60 minutes; pass it to the organization
                          join-request flow.
                      email:
                        type: string
                        format: email
                        example: john.doe@example.com
                      name:
                        type: string
                        example: John Doe
                      provider:
                        type: string
                        example: google
                    required:
                      - onboarding_id
                      - email
                      - name
                      - provider
                required:
                  - error
              examples:
                accountExists:
                  summary: Account with this email already exists
                  value:
                    error:
                      code: AUTH0_ACCOUNT_EXISTS
                      message: An account with this email already exists. Please log in with your password and link this account in Profile settings.
                alreadyLinked:
                  summary: Identity already linked (link intent)
                  value:
                    error:
                      code: AUTH0_LINK_ALREADY_LINKED
                      message: This account is already linked to another user.
                registrationRequired:
                  summary: No account; onboarding required (login intent)
                  value:
                    error:
                      code: AUTH0_REGISTRATION_REQUIRED
                      message: Please complete onboarding.
                    profile:
                      onboarding_id: 3fJk9qLm2NpR7sTv4WxY8zAb1CdE5fGh6IjK0lMn3OpQ7rSt
                      email: john.doe@example.com
                      name: John Doe
                      provider: google
        '410':
          description: Invitation user is invalid or already activated
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: INVITE_INVALID_USER
                  message: Invitation user is invalid or has already been activated.
        '422':
          description: Validation or email verification failure
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              examples:
                emailUnverified:
                  summary: Email not verified with provider
                  value:
                    error:
                      code: AUTH0_EMAIL_UNVERIFIED
                      message: Please verify your email with the provider before continuing.
                inviteEmailMismatch:
                  summary: Invitation email mismatch
                  value:
                    error:
                      code: INVITE_EMAIL_MISMATCH
                      message: Email does not match invitation.
                linkEmailMismatch:
                  summary: Linked identity email differs from the account email
                  value:
                    error:
                      code: AUTH0_LINK_EMAIL_MISMATCH
                      message: Auth0 email does not match your account email.
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '500':
          description: Unable to process Auth0 login
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: AUTH0_RESOLUTION_FAILED
                  message: Unable to process Auth0 login.
        '503':
          description: Auth0 is not configured
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: AUTH0_NOT_CONFIGURED
                  message: Auth0 is not enabled.
  /v1/auth/auth0/link:
    post:
      tags:
        - Authentication
      summary: Initiate Auth0 account linking
      description: |
        Starts the Auth0 flow to link a social identity to the currently
        authenticated user's account. The callback with `intent=link` will
        complete the linking.
      operationId: auth0Link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - google
                    - facebook
                    - microsoft
                    - github
                    - x
                  description: Social identity provider to link
                  example: google
              required:
                - provider
      responses:
        '200':
          description: Redirect URL generated for linking
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri
                    description: Auth0 authorize URL to redirect the user to
                    example: https://example.auth0.com/authorize?client_id=...
                  state:
                    type: string
                    description: State token to validate on callback
                    example: abc123def456
                required:
                  - redirect_url
                  - state
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '503':
          description: Auth0 is not configured
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: AUTH0_NOT_CONFIGURED
                  message: Auth0 is not enabled.
  /v1/auth/auth0/unlink:
    post:
      tags:
        - Authentication
      summary: Unlink Auth0 social identity
      description: Remove the linked social identity for the specified provider from the authenticated user's account.
      operationId: auth0Unlink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - google
                    - facebook
                    - microsoft
                    - github
                    - x
                  description: Social identity provider to unlink
                  example: google
              required:
                - provider
      responses:
        '200':
          description: Identity unlinked
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/SuccessMessage.yaml'
              example:
                message: Identity unlinked.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
