paths:
  /sanctum/csrf-cookie:
    get:
      tags:
        - Authentication
      summary: Get CSRF cookie
      description: |
        Framework route (Laravel Sanctum) that sets the `XSRF-TOKEN` cookie; the API
        authenticates with Bearer tokens and does not need it. Rate limited to 60
        requests per minute per IP.
      operationId: getCsrfCookie
      security: []
      responses:
        '200':
          description: CSRF cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: CSRF cookie set
              example:
                message: CSRF cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: XSRF-TOKEN cookie for CSRF protection
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
