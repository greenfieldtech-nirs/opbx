paths:
  /voice/route:
    post:
      tags:
        - Voice Routing
      summary: Inbound call routing
      description: |
        Main inbound call routing endpoint.
        
        Returns CXML (Cloudonix XML) document instructing the platform
        how to route the call based on organizational configuration.
        
        Middleware: voice.webhook.auth, rate_limit_org:voice_routing
        
        Authentication: Bearer token (per-organization domain_requests_api_key)
      operationId: voiceRoute
      security:
        - voiceWebhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CallSid:
                  type: string
                  maxLength: 255
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: Call SID
                From:
                  type: string
                  maxLength: 16
                  pattern: '^(\+?[1-9]\d{1,14}|\d{1,10})$'
                  description: Caller number
                To:
                  type: string
                  maxLength: 64
                  pattern: '^(\+?[1-9]\d{1,14}|\*\d{1,10}|\d{1,10}|(spy|barge)_[0-9a-f]{16,}|whisper_(caller|callee|both)_[0-9a-f]{16,})$'
                  description: Called number, a `*`-feature code, or a supervisor coaching target (spy_/barge_/whisper_<party>_ + hex token)
                Domain:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                  description: Cloudonix domain
                CallStatus:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                  enum: [ringing, in-progress, answered, completed, failed, busy, no-answer, new, null]
                  description: Call status
                Direction:
                  type:
                  - string
                  - 'null'
                  enum: [subscriber, inbound, outbound, application, null]
                _organization_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  description: Organization ID appended to callback URLs by the platform
              required: [CallSid, From, To]
      responses:
        '200':
          description: CXML routing response
          content:
            application/xml:
              schema:
                $ref: '../../components/schemas/cxml/CxmlResponse.yaml'
            text/xml:
              schema:
                $ref: '../../components/schemas/cxml/CxmlResponse.yaml'
        '401':
          description: Unauthorized - Invalid Bearer token
        '429':
          description: Rate limit exceeded
