paths:
  /voice/amd-action:
    post:
      tags:
        - Voice Routing
      summary: AMD action handler
      description: |
        Receives the Answering Machine Detection result from the AMD worker and runs the
        auto-dialer campaign's configured action for that result (`action_voicemail`,
        `action_human` or `action_unknown`; empty means `HANGUP`). The action is never
        taken from the request.

        - Stores `amd_result` and `amd_confidence` on the call session and writes an `amd`
          object (result, confidence, detectionTimeMs, reason, timestamp) to the Cloudonix
          session profile (best effort).
        - `HANGUP`: disconnects the Cloudonix session; `status` is `error` when the
          disconnect fails.
        - `CONTINUE`: nothing else happens.

        Authentication: `Authorization: Bearer <AMD_WORKER_API_TOKEN>`, checked in the
        controller (no route middleware). Not rate-limited.
      operationId: amdAction
      security:
        - amdWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callSid
                - streamSid
                - session
                - result
              properties:
                callSid:
                  type: string
                  description: Cloudonix call SID.
                  example: CA550e8400e29b41d4a716446655440000
                streamSid:
                  type: string
                  description: Media stream SID the worker analysed.
                session:
                  type: string
                  description: Auto-dialer session token of the call (see `POST /voice/amd-session`).
                  example: 9d1f3c2a7b8e4f60a1c2d3e4f5a6b7c8
                result:
                  type: string
                  enum: [voicemail, human, unknown]
                  description: AMD detection result.
                  example: voicemail
                action:
                  type: [string, 'null']
                  description: Action the worker suggests. Ignored by the server.
                confidence:
                  type: [number, 'null']
                  format: float
                  description: Confidence score of the detection.
                  example: 0.95
                detectionTimeMs:
                  type: [integer, 'null']
                  description: Detection duration in milliseconds.
                  example: 2500
                reason:
                  type: [string, 'null']
                  description: Free-text reason from the worker.
      responses:
        '200':
          description: AMD result processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                    description: '`error` only when a HANGUP disconnect failed'
                    example: ok
                  action:
                    type: string
                    enum: [hangup, continue]
                    example: hangup
                  profile_updated:
                    type: boolean
                    description: Whether the Cloudonix session profile update succeeded
        '401':
          description: Missing or wrong AMD worker token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized
        '404':
          description: No call session for the token, or its campaign's organization has no Cloudonix settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: No Cloudonix settings found for this session
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '500':
          description: Exception while updating the session or calling Cloudonix (`message` is the exception message)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
        '503':
          description: AMD worker authentication is not configured on the server
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: AMD worker authentication is not configured

  /voice/amd-session:
    post:
      tags:
        - Voice Routing
      summary: AMD stream admission check
      description: |
        Called by the AMD worker when a media stream starts. Checks that the session
        token belongs to a known, active (not terminated) auto-dialer call. Only then
        does the worker analyse the stream.

        Authentication: `Authorization: Bearer <AMD_WORKER_API_TOKEN>`, checked in the
        controller (no route middleware). Not rate-limited.
      operationId: amdSessionCheck
      security:
        - amdWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: string
                  maxLength: 255
                  description: Auto-dialer session token of the call.
      responses:
        '200':
          description: Session is active
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    enum: [true]
        '401':
          description: Missing or wrong AMD worker token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized
        '404':
          description: Unknown or inactive session
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    enum: [false]
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '503':
          description: AMD worker authentication is not configured on the server
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: AMD worker authentication is not configured
