paths:
  /callbacks/voice/albs-follow-through:
    post:
      tags:
      - Voice Routing
      summary: ALB follow-through callback
      description: 'Handle AI Load Balancer follow-through callback from Cloudonix.

        Called when a call to an AI Assistant fails (busy, no-answer, failed, canceled, unknown)

        and the load balancer needs to try the next available AI assistant.


        Query Parameters:

        - `albs_id`: Load balancer ID

        - `current_assistant_id`: ID of the AI assistant that just failed


        Middleware: voice.webhook.auth, rate_limit_org:voice_routing


        Authentication: Bearer token (per-organization domain_requests_api_key)

        '
      operationId: albsFollowThrough
      security:
      - voiceWebhookAuth: []
      parameters:
      - name: albs_id
        in: query
        required: true
        schema:
          type: integer
        description: AI Load Balancer ID
        example: 5
      - name: current_assistant_id
        in: query
        required: true
        schema:
          type: integer
        description: ID of the AI assistant that failed
        example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CallSid:
                  type: string
                  description: Unique call identifier (also passed in X-Cx-Session header)
                  example: CA550e8400e29b41d4a716446655440000
                From:
                  type: string
                  description: Caller number
                  example: '+1234567890'
                To:
                  type: string
                  description: Called number
                  example: '+1987654321'
                DialCallStatus:
                  type:
                  - string
                  - 'null'
                  enum:
                  - busy
                  - no-answer
                  - failed
                  - canceled
                  - unknown
                  - completed
                  description: Dial action status (preferred source)
                  example: busy
                CallStatus:
                  type:
                  - string
                  - 'null'
                  enum:
                  - busy
                  - no-answer
                  - failed
                  - canceled
                  - unknown
                  - completed
                  description: Alternative status field
                  example: busy
                Domain:
                  type:
                  - string
                  - 'null'
                  description: Cloudonix domain
                  example: example.cloudonix.io
                _organization_id:
                  type:
                  - integer
                  - 'null'
                  description: Organization ID (set by VerifyVoiceWebhookAuth middleware)
              required:
              - CallSid
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CallSid:
                  type: string
                From:
                  type: string
                To:
                  type: string
                DialCallStatus:
                  type: string
                CallStatus:
                  type: string
                Domain:
                  type: string
          application/xml:
            schema:
              type: object
              description: Cloudonix may send XML data
      responses:
        '200':
          description: CXML routing response to next AI assistant or fallback
          content:
            application/xml:
              schema:
                $ref: ../../components/schemas/cxml/CxmlResponse.yaml
              examples:
                routeToNextAssistant:
                  summary: Route to next AI assistant
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Response>\n  <Connect>\n    <Stream url=\"wss://ai.example.com/stream/next\"\
                    \ name=\"ai-assistant\"/>\n  </Connect>\n</Response>\n"
                fallbackHangup:
                  summary: All assistants failed - hangup
                  value: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Response>\n  <Say>All AI assistants are unavailable.\
                    \ Goodbye.</Say>\n  <Hangup/>\n</Response>\n"
        '204':
          description: Empty response when follow-through is not needed
        '401':
          description: Unauthorized - Invalid Bearer token
        '429':
          description: Rate limit exceeded
