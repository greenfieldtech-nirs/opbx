paths:
  /v1/auto-dialer-campaigns/{campaign}/destinations:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Auto Dialer Campaigns
      summary: List campaign destinations
      description: >-
        Paginated destinations from every list assigned to the campaign (per_page defaults to 50,
        max 100). Owner, PBX Admin and Reporter only. `data` is the raw Laravel paginator: the rows
        are in `data.data`, with `current_page`, `per_page`, `total`, `last_page` and the page URLs
        next to them. Rows are the raw destination records (no resource formatting), in database order.
      operationId: listCampaignDestinations
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - name: per_page
        in: query
        required: false
        description: Number of items per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - dialing
          - connected
          - failed
          - completed
          - invalid
        description: Filter by destination status (not validated; an unknown value returns no rows)
      responses:
        '200':
          description: List of destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
                      from:
                        type:
                        - integer
                        - 'null'
                      to:
                        type:
                        - integer
                        - 'null'
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            organization_id:
                              type: integer
                              example: 1
                            list_id:
                              type: integer
                              example: 12
                            phone_number:
                              type: string
                              example: '+14155551212'
                            name:
                              type:
                              - string
                              - 'null'
                              example: John Doe
                            batch_identifier:
                              type:
                              - string
                              - 'null'
                            metadata:
                              type:
                              - object
                              - 'null'
                              additionalProperties: true
                            status:
                              type: string
                              enum:
                              - pending
                              - dialing
                              - connected
                              - failed
                              - completed
                              - invalid
                              example: pending
                            dial_attempts:
                              type: integer
                              example: 0
                            consecutive_initiate_failures:
                              type: integer
                              example: 0
                            priority:
                              type: integer
                              example: 1
                            last_session_token:
                              type:
                              - string
                              - 'null'
                            last_call_id:
                              type:
                              - string
                              - 'null'
                            last_dialed_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              example: null
                            next_retry_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: When a busy / no-answer retry is due
                              example: null
                            last_disposition:
                              type:
                              - string
                              - 'null'
                              example: null
                            duration:
                              type: integer
                              description: Seconds, last attempt
                              example: 0
                            total_duration:
                              type: integer
                              description: Seconds, all attempts
                              example: 0
                            billsec:
                              type: integer
                              example: 0
                            last_cdr_id:
                              type:
                              - integer
                              - 'null'
                            last_error:
                              type:
                              - string
                              - 'null'
                            created_at:
                              type: string
                              format: date-time
                              example: '2024-01-10T08:00:00.000000Z'
                            updated_at:
                              type: string
                              format: date-time
                              example: '2024-01-10T08:00:00.000000Z'
                            laravel_through_key:
                              type: integer
                              description: Campaign ID (added by the list-to-destination join)
                              example: 1
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/auto-dialer-campaigns/{campaign}/concurrency:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Auto Dialer Campaigns
      summary: Get concurrency information
      description: |
        Get real-time concurrency status for a campaign. Owner, PBX Admin and Reporter only.

        Returns current CAC utilization, active sessions,
        and rate limit status for real-time monitoring.
      operationId: getCampaignConcurrency
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:read
      responses:
        '200':
          description: Concurrency information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cac_limit:
                        type: integer
                        description: Maximum concurrent active calls
                        example: 10
                      active_calls:
                        type: integer
                        description: Currently active calls
                        example: 5
                      available_slots:
                        type: integer
                        description: Available CAC slots
                        example: 5
                      utilization_percentage:
                        type: number
                        description: active_calls / cac_limit x 100, one decimal
                        example: 50.0
                      api_interval_seconds:
                        type: number
                        description: Seconds between call initiations (1 / calls_per_second)
                        example: 1.0
                      active_sessions:
                        type: array
                        description: Active call sessions
                        items:
                          type: object
                          properties:
                            session_id:
                              type: integer
                              example: 123
                            session_token:
                              type: string
                              example: sess-abc123
                            destination_id:
                              type: integer
                              example: 456
                            phone_number:
                              type: string
                              description: Destination number, or `unknown`
                              example: '+14155551212'
                            started_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              example: '2024-01-15T14:30:00Z'
                            duration_seconds:
                              type: integer
                              example: 45
                      rate_limit_status:
                        type: object
                        properties:
                          is_rate_limited:
                            type: boolean
                            description: True when the campaign is paused with pause_reason `cloudonix_rate_limit`
                            example: false
                          pause_reason:
                            type:
                            - string
                            - 'null'
                            example: null
                          resumes_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            example: null
                          can_resume_now:
                            type: boolean
                            description: True when resumes_at is null or already passed
                            example: true
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
