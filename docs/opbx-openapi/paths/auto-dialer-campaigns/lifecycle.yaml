paths:
  /v1/auto-dialer-campaigns/{campaign}/start:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Auto Dialer Campaigns
      summary: Start campaign
      description: |
        Start an auto-dialer campaign. Owner and PBX Admin only.

        The campaign must be `draft` or `paused` (any other status returns 403) and must have
        a distribution list assigned whose status is `ready` or `in_use` (otherwise 422). The
        campaign becomes `active`, `started_at` is set to now and the CAC counter is reset to 0.
        A `draft` campaign with `auto_start` and a `ready` or `in_use` list is also started by the
        scheduler (every minute) once the current time is inside its schedule.
      operationId: startAutoDialerCampaign
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Campaign started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Campaign started successfully"
                  data:
                    $ref: '../../components/schemas/AutoDialerCampaign.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          description: No usable distribution list is assigned
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: "Cannot start campaign without a destination list"

  /v1/auto-dialer-campaigns/{campaign}/pause:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Auto Dialer Campaigns
      summary: Pause campaign
      description: |
        Pause an active auto-dialer campaign. Owner and PBX Admin only; a campaign that is not
        `active` returns 403.

        The dialer stops initiating new calls. Call sessions still `initiated`, `ringing` or
        `answered` are marked `failed` with disposition `cancelled`, and the CAC counter is
        reset to 0.
      operationId: pauseAutoDialerCampaign
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Campaign paused successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Campaign paused successfully"
                  data:
                    $ref: '../../components/schemas/AutoDialerCampaign.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

  /v1/auto-dialer-campaigns/{campaign}/resume:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Auto Dialer Campaigns
      summary: Resume campaign
      description: |
        Resume a paused auto-dialer campaign. Owner and PBX Admin only; a campaign that is not
        `paused` returns 403.

        The campaign becomes `active` immediately (a rate-limit `resumes_at` is not checked) and
        the CAC counter is reset to 0.
      operationId: resumeAutoDialerCampaign
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Campaign resumed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Campaign resumed successfully"
                  data:
                    $ref: '../../components/schemas/AutoDialerCampaign.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

  /v1/auto-dialer-campaigns/{campaign}/archive:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    patch:
      tags:
        - Auto Dialer Campaigns
      summary: Archive campaign
      description: |
        Archive an auto-dialer campaign in any status. Owner only.

        An `active` campaign is paused first (see Pause campaign). The campaign's dialer Redis
        keys (CAC counter, caller ID cycle position) are cleared. An archived campaign cannot be
        started, resumed or deleted.
      operationId: archiveAutoDialerCampaign
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Campaign archived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Campaign archived successfully"
                  data:
                    $ref: '../../components/schemas/AutoDialerCampaign.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
