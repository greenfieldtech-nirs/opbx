paths:
  /v1/auto-dialer-campaigns/{campaign}/reset-cac:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    post:
      tags:
        - Auto Dialer Campaigns
      summary: Reset CAC counter
      description: |
        Reset the Concurrent Active Calls (CAC) counter for a campaign to 0, in any status.
        Owner and PBX Admin only.

        Useful when the CAC counter gets stuck due to missed CDR webhooks,
        preventing new calls from being initiated. (A scheduled job also reconciles the
        counter every minute.)
      operationId: resetCampaignCac
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: CAC counter reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "CAC counter reset successfully"
                  campaign_id:
                    type: integer
                    example: 1
                  previous_value:
                    type: integer
                    description: Counter value before the reset (0 when unset)
                    example: 5
                  new_value:
                    type: integer
                    example: 0
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '500':
          description: The dialer Redis could not be reached
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: "Failed to reset CAC counter"
                error: "Connection refused"

  /v1/auto-dialer-campaigns/{campaign}/reset-caller-id-cycle:
    parameters:
      - name: campaign
        in: path
        required: true
        description: Campaign ID
        schema:
          type: integer
          minimum: 1
        example: 1

    post:
      tags:
        - Auto Dialer Campaigns
      summary: Reset caller ID cycle
      description: |
        Reset the Caller ID cycle position to the start of the pool, so Round Robin starts over
        from the first Caller ID. Owner and PBX Admin only. The campaign must be `paused`
        (otherwise 409); the reset is not limited to the Round Robin strategy.
      operationId: resetCampaignCallerIdCycle
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Caller ID cycle reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Caller ID cycle reset successfully"
                  campaign_id:
                    type: integer
                    example: 1
                  strategy:
                    type: string
                    enum: [round_robin, random, least_recently_used]
                    example: "round_robin"
                  next_index:
                    type: integer
                    example: 0
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          description: The campaign is not paused
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/ValidationError.yaml'
              example:
                message: "Caller ID cycle can only be reset when campaign is PAUSED"
                errors:
                  status:
                  - "Caller ID cycle can only be reset when campaign is PAUSED"
        '500':
          description: The dialer Redis could not be reached
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/ValidationError.yaml'
              example:
                message: "Failed to reset Caller ID cycle"
                errors:
                  status:
                  - "Failed to reset Caller ID cycle"
