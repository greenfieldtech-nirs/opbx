    delete:
      tags:
      - Auto Dialer Campaigns
      summary: Delete campaign
      description: |
        Delete a campaign. Owner only, and only while the campaign is `draft` (any other status
        returns 403). Its call sessions are deleted, its lists stay in the organization
        unassigned, and its dialer Redis keys are cleared.
      operationId: deleteAutoDialerCampaign
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      responses:
        '200':
          description: Campaign deleted successfully
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/SuccessMessage.yaml
              example:
                message: Campaign deleted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/auto-dialer-campaigns/available-caller-ids:
    get:
      tags:
      - Auto Dialer Campaigns
      summary: Get available Caller IDs
      description: |
        Get the organization's active DID numbers that can be used as Caller IDs for
        auto-dialer campaigns. Owner, PBX Admin and Reporter only.
      operationId: getAvailableCallerIds
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:read
      parameters:
      - name: exclude_campaign_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: >-
          Campaign ID whose Caller ID pool is left out of the list (the numbers already in
          that campaign's pool are not returned). Must be a positive integer, otherwise 422.
          An id that is not a campaign of the organization excludes nothing.
      responses:
        '200':
          description: List of available Caller IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: DID number ID
                          example: 1
                        phone_number:
                          type: string
                          description: Phone number in E.164 format
                          example: '+12127773456'
                        friendly_name:
                          type:
                          - string
                          - 'null'
                          description: Friendly name for the number
                          example: Sales Line 1
                        status:
                          type: string
                          enum:
                          - active
                          description: DID status (only active DIDs are returned)
                          example: active
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
