              - dial_timeout
              - destination_connect
              - caller_id
              - max_dial_attempts
              - concurrent_active_calls
              - schedule
              - start_date
              - end_date
              - timezone
      responses:
        '201':
          description: Campaign created successfully (`lists_count` is 0)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Campaign created successfully
                  data:
                    $ref: ../../components/schemas/AutoDialerCampaign.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
