    patch:
      tags:
      - Auto Dialer Campaigns
      summary: Partially update campaign
      description: |
        Update a campaign. Owner and PBX Admin only. PUT and PATCH behave the same: every field
        is optional and only the fields sent are changed.

        A campaign in any status except `active` can be updated. An `active` campaign cannot be
        edited: pause it first (`PATCH /v1/auto-dialer-campaigns/{campaign}/pause`), edit it, then
        resume it. A request for an `active` campaign changes nothing and returns 409
        (`Pause the campaign before editing it.`).
      operationId: patchAutoDialerCampaign
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Campaign name
                  example: Q1 Sales Campaign
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                  description: Campaign description
                  example: Outbound campaign for Q1 sales leads
                routing_destination_type:
                  type: string
                  enum:
                  - ai_assistant
                  - ai_load_balancer
                  - ring_group
                  - call_queue
                  - hangup
                  description: Where answered calls are sent
                  example: ai_assistant
                routing_destination_id:
                  type:
                  - integer
                  - 'null'
                  description: ID of the AI assistant or AI load balancer (in your organization) matching routing_destination_type (or the campaign's current type when not sent). When sent, it must not be null unless routing_destination_type in the same request is `hangup`.
                  example: 5
                dial_timeout:
                  type: integer
                  minimum: 1
                  maximum: 300
                  description: Seconds to ring each destination
                  example: 30
                destination_connect:
                  type: string
                  enum:
                  - connected
                  - immediately
                  description: When to connect the destination
                  example: connected
                caller_id:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  description: Default Caller ID in E.164 format (legacy single Caller ID)
                  example: '+14155551212'
                caller_id_pool:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: >-
                    Caller IDs to rotate through. Each DID must belong to your organization and be
                    active, otherwise 422 `Invalid Caller ID pool`. Replaces the whole pool.
                  items:
                    type: object
                    required:
                    - did_id
                    properties:
                      did_id:
                        type: integer
                        description: ID of the DID number
                        example: 1
                      weight:
                        type: integer
                        minimum: 1
                        maximum: 100
                        default: 1
                        description: Weight for distribution
                        example: 1
                caller_id_strategy:
                  type: string
                  enum:
                  - round_robin
                  - random
                  - least_recently_used
                  description: Distribution strategy for the Caller ID pool
                  example: round_robin
                max_dial_attempts:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Maximum number of dial attempts per destination
                  example: 3
                concurrent_active_calls:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Maximum concurrent active calls (CAC)
                  example: 10
                calls_per_second:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: Calls per second rate (CPS)
                  example: 1
                schedule:
                  type: object
                  description: >-
                    Weekly calling windows, in `timezone`. Replaces the stored schedule (days left out are no longer scheduled) and recomputes the legacy days_active / start_time / end_time.
                  properties:
                    monday:
                      type: object
