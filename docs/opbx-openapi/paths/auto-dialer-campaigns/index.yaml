paths:
  /v1/auto-dialer-campaigns:
    get:
      tags:
      - Auto Dialer Campaigns
      summary: List campaigns
      description: |
        Get a paginated list of auto-dialer campaigns, newest first. Owner, PBX Admin and
        Reporter only. Supports filtering by status and search by name.
      operationId: listAutoDialerCampaigns
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - name: per_page
        in: query
        required: false
        description: Number of items per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - active
          - paused
          - completed
          - archived
        description: Filter by campaign status (not validated; an unknown value returns no rows)
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Substring match on the campaign name
      - name: exclude_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - active
          - paused
          - completed
          - archived
        description: Exclude campaigns with this status (an unknown value returns 422)
      responses:
        '200':
          description: List of campaigns (meta has no from/to). Each campaign includes `caller_id_pool` and `lists_count`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AutoDialerCampaign.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    post:
      tags:
      - Auto Dialer Campaigns
      summary: Create campaign
      description: |
        Create a new auto-dialer campaign. Owner and PBX Admin only.

        The campaign is created in `draft` status with `caller_id_pool_enabled` true, and must be
        started manually or via `auto_start` once a list is assigned.
      operationId: createAutoDialerCampaign
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: auto-dialer-campaigns:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Campaign name
                  example: Q1 Sales Campaign
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                  description: Campaign description
                  example: Outbound campaign for Q1 sales leads
                routing_destination_type:
                  type: string
                  enum:
                  - ai_assistant
                  - ai_load_balancer
                  - ring_group
                  - call_queue
                  - hangup
                  description: Where answered calls are sent
                  example: ai_assistant
                routing_destination_id:
                  type:
                  - integer
                  - 'null'
                  description: ID of the AI assistant or AI load balancer (in your organization) matching routing_destination_type. Required unless routing_destination_type is `hangup`.
                  example: 5
                dial_timeout:
                  type: integer
                  minimum: 1
                  maximum: 300
                  description: Seconds to ring each destination
                  example: 30
                destination_connect:
                  type: string
                  enum:
                  - connected
                  - immediately
                  description: When to connect the destination
                  example: connected
                caller_id:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  description: Default Caller ID in E.164 format (legacy single Caller ID)
                  example: '+14155551212'
                caller_id_pool:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: >-
                    Caller IDs to rotate through. Each DID must belong to your organization and be
                    active, otherwise 422 `Invalid Caller ID pool`.
                  items:
                    type: object
                    required:
                    - did_id
                    properties:
                      did_id:
                        type: integer
                        description: ID of the DID number
                        example: 1
                      weight:
                        type: integer
                        minimum: 1
                        maximum: 100
                        default: 1
                        description: Weight for distribution
                        example: 1
                caller_id_strategy:
                  type: string
                  enum:
                  - round_robin
                  - random
                  - least_recently_used
                  default: round_robin
                  description: Distribution strategy for the Caller ID pool
                  example: round_robin
                max_dial_attempts:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Maximum number of dial attempts per destination
                  example: 3
                concurrent_active_calls:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Maximum concurrent active calls (CAC)
                  example: 10
                calls_per_second:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 1
                  description: Calls per second rate (CPS)
                  example: 1
                schedule:
                  type: object
                  description: >-
                    Weekly calling windows, in `timezone`. All seven days are required.
                  required:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                  - saturday
                  - sunday
                  properties:
                    monday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    tuesday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    wednesday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    thursday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    friday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    saturday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                    sunday:
                      type: object
                      required:
                      - enabled
                      properties:
                        enabled:
                          type: boolean
                        time_ranges:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - start_time
                            - end_time
                            properties:
                              id:
                                type: string
                                description: Client-side identifier of the range
                              start_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
                start_date:
                  type: string
                  format: date
                  description: First calling day; today or later
                  example: '2026-11-01'
                end_date:
                  type: string
                  format: date
                  description: Last calling day (inclusive); on or after start_date
                  example: '2026-12-31'
                timezone:
                  type: string
                  description: IANA timezone of the schedule
                  example: America/New_York
                time_limit:
                  type:
                  - integer
                  - 'null'
                  minimum: 30
                  maximum: 14400
                  description: Maximum call duration in seconds (600 when omitted or null)
                  example: 300
                auto_start:
                  type: boolean
                  default: false
                  description: Let the scheduler start this draft campaign once it has a ready list and the current time is inside its schedule
                  example: false
                record_calls:
                  type: boolean
                  default: false
                  description: Whether to record calls
                  example: true
                wait_for_available_agents:
                  type: boolean
                  default: false
                  description: "Call queue campaigns only: while no agent of the queue is available, the dialer places no new calls"
                  example: false
                action_voicemail:
                  type:
                  - string
                  - 'null'
                  enum: [HANGUP, CONTINUE, null]
                  description: What to do when the AMD worker detects a voicemail. With AMD on (any action set), an empty or null action means HANGUP at call time
                action_human:
                  type:
                  - string
                  - 'null'
                  enum: [HANGUP, CONTINUE, null]
                  description: What to do when a human answers. With AMD on (any action set), an empty or null action means HANGUP at call time
                action_unknown:
                  type:
                  - string
                  - 'null'
                  enum: [HANGUP, CONTINUE, null]
                  description: What to do when detection is inconclusive. With AMD on (any action set), an empty or null action means HANGUP at call time
                retry_on_voicemail:
                  type: boolean
                  default: false
                  description: Retry the destination when a voicemail was detected
                retry_on_busy_no_answer:
                  type: boolean
                  default: false
                  description: Redial busy and no-answer destinations after the retry delay, within max_dial_attempts. Cancelled and failed calls are never retried.
                retry_delay_minutes:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 1440
                  default: 15
                  description: Minutes to wait before the FIRST busy / no-answer retry (15 when omitted or null). Each further retry waits twice as long as the previous one (delay x 2^(attempt-1)), capped at 1440 minutes (24 hours).
                days_active:
                  type:
                  - array
                  - 'null'
                  description: Legacy; accepted but ignored (derived from `schedule`)
                start_time:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 23
                  description: Legacy hour; accepted but ignored (derived from `schedule`)
                end_time:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 23
                  description: Legacy hour; accepted but ignored (derived from `schedule`)
