                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
                                example: '09:00'
                              end_time:
                                type: string
                                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]|24:00$
                                description: HH:MM, or 24:00 for end of day
                                example: '17:00'
