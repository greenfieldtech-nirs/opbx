paths:
  /v1/call-queues:
    get:
      tags:
        - Call Queues
      summary: List call queues
      operationId: listCallQueues
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, strategy, status, created_at, updated_at]
            default: created_at
        - $ref: '../../components/parameters/query/SortOrder.yaml'
        - name: strategy
          in: query
          schema:
            type: string
            enum: [ring_all, round_robin, least_talk_time, fewest_calls]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      responses:
        '200':
          description: List of call queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallQueue.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Call Queues
      summary: Create call queue
      operationId: createCallQueue
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/CallQueueInput.yaml'
      responses:
        '201':
          description: Call queue created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-queues/agents/me:
    get:
      tags:
        - Call Queues
      summary: List my queue agent memberships
      operationId: listMyQueueMemberships
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:read
      responses:
        '200':
          description: Queues the authenticated user is an agent of, with current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        state:
                          type: string
                          description: Agent state from the queue engine (LOGGED_OUT when unknown)
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-queues/{call_queue}:
    get:
      tags:
        - Call Queues
      summary: Get call queue
      operationId: getCallQueue
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:read
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Call queue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/CallQueue.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Call Queues
      summary: Update call queue
      operationId: updateCallQueue
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:write
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/CallQueueInput.yaml'
      responses:
        '200':
          description: Call queue updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    patch:
      tags:
        - Call Queues
      summary: Partially update call queue
      description: Same as `PUT /v1/call-queues/{call_queue}`. Only the fields sent are changed.
      operationId: patchCallQueue
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:write
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/CallQueueInput.yaml'
      responses:
        '200':
          description: Call queue updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Call Queues
      summary: Delete call queue
      description: Refused with 409 when the queue is still referenced by routing (for example from a DID, IVR option, or extension). The 409 body lists the references.
      operationId: deleteCallQueue
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:write
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Call queue deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'

  /v1/call-queues/{call_queue}/agents/me/state:
    post:
      tags:
        - Call Queues
      summary: Update my agent state in a queue
      operationId: updateMyQueueAgentState
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:write
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  enum: [available, wrap_up, logged_out]
                  description: Agent presence state (wrap_up is sticky when toggled manually)
                user_id:
                  type: integer
                  description: Owner/PBX Admin only - set the state of this agent instead of their own
      responses:
        '200':
          description: Agent state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  state:
                    type: string
                    enum: [available, wrap_up, logged_out]
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '502':
          description: The queue engine did not accept the state change

  /v1/call-queues/{call_queue}/stats:
    get:
      tags:
        - Call Queues
      summary: Get call queue statistics
      operationId: getCallQueueStats
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:read
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          $ref: '../public/queues-dashboard.yaml#/paths/~1v1~1public~1queues-dashboard~1{token}~1queues~1{queue}~1stats/get/responses/200'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

  /v1/call-queues/{call_queue}/live:
    get:
      tags:
        - Call Queues
      summary: Get live call queue snapshot
      operationId: getCallQueueLive
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-queues:read
      parameters:
        - name: call_queue
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '../public/queues-dashboard.yaml#/paths/~1v1~1public~1queues-dashboard~1{token}~1queues~1{queue}~1live/get/responses/200'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

  /v1/queue-calls:
    get:
      tags:
        - Call Queues
      summary: List queue call report rows
      operationId: listQueueCalls
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: queue-calls:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: queue_id
          in: query
          schema:
            type: integer
        - name: disposition
          in: query
          schema:
            type: string
            enum: [answered, abandoned, overflow]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Queue call report rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/QueueCall.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/queue-calls/export:
    get:
      tags:
        - Call Queues
      summary: Export queue calls (CSV)
      operationId: exportQueueCalls
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: queue-calls:read
      parameters:
        - name: queue_id
          in: query
          schema:
            type: integer
        - name: disposition
          in: query
          schema:
            type: string
            enum: [answered, abandoned, overflow]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: CSV export of queue call report rows
          content:
            text/csv: {}
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
