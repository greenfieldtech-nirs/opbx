paths:
  /v1/organizations/join-requests:
    get:
      tags:
        - Organizations
      summary: List pending organization join requests
      description: |
        Returns all pending join requests for the authenticated user's
        organization, newest first, as a plain JSON array. Owner and PBX Admin only.
        Not available to API keys.
      operationId: listOrganizationJoinRequests
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of pending join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/schemas/OrganizationJoinRequest.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
    post:
      tags:
        - Organizations
      summary: Create organization join request
      description: |
        Submit a request to join an organization using the social identity captured
        during Auth0 onboarding (422 `ONBOARDING_EXPIRED` when the onboarding ID is
        unknown or already used).
        The request must be approved by an Owner or PBX Admin of the organization before
        the user is created. Public; rate limited to 5 requests per minute per IP. An
        unknown `organization_slug` fails validation (422); an organization that exists but
        is not active returns 404.
      operationId: createOrganizationJoinRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_slug:
                  type: string
                  description: Slug of an existing, active organization to join
                  example: acme-corporation
                onboarding_id:
                  type: string
                  maxLength: 128
                  description: >-
                    Single-use onboarding ID issued by the Auth0 callback for an unknown social
                    identity. The provider, subject, email and name come from that cached profile.
              required:
                - organization_slug
                - onboarding_id
      responses:
        '201':
          description: Join request created
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/OrganizationJoinRequest.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          description: >-
            Validation error (for example an unknown `organization_slug`), or the onboarding ID
            is unknown, expired or already used (`ONBOARDING_EXPIRED`)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../../components/schemas/ValidationError.yaml'
                  - $ref: '../../components/schemas/Error.yaml'
              examples:
                onboardingExpired:
                  summary: Onboarding ID invalid or used
                  value:
                    error:
                      code: ONBOARDING_EXPIRED
                      message: Onboarding session is invalid or expired.
        '429':
          description: Too many attempts (5 requests per minute per IP)
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Too Many Requests
                message: Too many login attempts. Please try again later.
                retry_after: 60
  /v1/organizations/join-requests/{joinRequest}/approve:
    post:
      tags:
        - Organizations
      summary: Approve organization join request
      description: |
        Approve a pending join request. Owner and PBX Admin of the request's organization
        only; not available to API keys. Creates an `active` user in the organization with
        the `pbx_user` role and a random password, links the social identity, and marks the
        request `approved`. `user` is the newly created user record (not the `User`
        resource shape).
      operationId: approveOrganizationJoinRequest
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: joinRequest
          in: path
          required: true
          schema:
            type: integer
          description: ID of the join request to approve
      responses:
        '200':
          description: Join request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Join request approved.
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      organization_id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        example: pbx_user
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                required:
                  - message
                  - user
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error:
                  code: JOIN_REQUEST_NOT_PENDING
                  message: Request is not pending.
  /v1/organizations/join-requests/{joinRequest}/reject:
    post:
      tags:
        - Organizations
      summary: Reject organization join request
      description: >-
        Mark a join request `rejected`. Owner and PBX Admin of the request's organization
        only; not available to API keys. The request's current status is not checked.
      operationId: rejectOrganizationJoinRequest
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: joinRequest
          in: path
          required: true
          schema:
            type: integer
          description: ID of the join request to reject
      responses:
        '200':
          description: Join request rejected
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/SuccessMessage.yaml'
              example:
                message: Join request rejected.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
