paths:
  /v1/call-detail-records:
    get:
      tags:
        - Call Detail Records
      summary: List Call Detail Records
      description: Get a paginated, filterable list of Call Detail Records for the current organization.
      operationId: listCallDetailRecords
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-detail-records:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: >-
            Caller number filter. A term without a wildcard matches numbers that start with it (with or
            without a leading `+`). `*` and `%` are wildcards for any characters and may appear anywhere
            (a leading wildcard means contains/ends-with and cannot use the index). `_` is literal.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: >-
            Called number filter. A term without a wildcard matches numbers that start with it (with or
            without a leading `+`). `*` and `%` are wildcards for any characters and may appear anywhere
            (a leading wildcard means contains/ends-with and cannot use the index). `_` is literal.
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: First day of the date range (inclusive).
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Last day of the date range (inclusive).
        - name: disposition
          in: query
          schema:
            type: string
          description: Exact disposition (for example ANSWER, BUSY, NOANSWER)
        - name: direction
          in: query
          schema:
            type: string
            enum: [incoming, outgoing, internal, application]
        - name: user
          in: query
          schema:
            type: string
          description: Partial name of the extension's user (not available with `archive`)
        - name: session_token
          in: query
          schema:
            type: string
          description: Exact session token (locates the CDR of a queue call)
        - name: supervisor
          in: query
          schema:
            type: boolean
          description: When true and the caller is a Supervisor, restrict to the resources they supervise
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [session_timestamp, from, to, duration, billsec, disposition, user_full_name, direction]
            default: session_timestamp
          description: '`user_full_name` is not available with `archive`'
        - $ref: '../../components/parameters/query/SortOrder.yaml'
        - name: include
          in: query
          schema:
            type: string
            enum: [raw_cdr]
          description: Include the complete raw CDR in each row
        - name: archive
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Search the warm archive (CDRs older than 6 months and up to 12 months) instead of the
            live table. Honoured only for requests authenticated with an organisation API key;
            ignored for session (browser) users. Archived rows have no extension user, and the
            `user` filter and `user_full_name` sort are not available. CDRs older than the warm
            period are stored as files and are not available through the API.
      responses:
        '200':
          description: List of Call Detail Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallDetailRecord.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-detail-records/{call_detail_record}:
    parameters:
      - name: call_detail_record
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Call Detail Records
      summary: Get Call Detail Record
      description: >-
        Retrieve a single CDR by ID. With an organisation API key, `archive=1` looks the CDR up in
        the warm archive instead of the live table.
      parameters:
        - $ref: '../../components/parameters/query/CdrArchive.yaml'
        - name: include
          in: query
          schema:
            type: string
            enum: [raw_cdr]
      operationId: getCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-detail-records:read
      responses:
        '200':
          description: Call Detail Record details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/CallDetailRecord.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
