paths:
  /v1/call-detail-records:
    get:
      tags:
        - Call Detail Records
      summary: List Call Detail Records
      description: Get a paginated, filterable list of Call Detail Records for the current organization.
      operationId: listCallDetailRecords
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the date range (ISO 8601).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End of the date range (ISO 8601).
        - name: extension_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by destination extension.
      responses:
        '200':
          description: List of Call Detail Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallDetailRecord.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-detail-records/export:
    get:
      tags:
        - Call Detail Records
      summary: Export Call Detail Records
      description: Export CDRs as CSV/Excel for the current organization.
      operationId: exportCallDetailRecords
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
          description: Export format.
      responses:
        '200':
          description: Exported CDR file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-detail-records/statistics:
    get:
      tags:
        - Call Detail Records
      summary: CDR Statistics
      description: Aggregate statistics for CDRs in the current organization.
      operationId: callDetailRecordStatistics
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Statistics object
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/call-detail-records/{call_detail_record}:
    parameters:
      - name: call_detail_record
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Call Detail Records
      summary: Get Call Detail Record
      description: Retrieve a single CDR by ID.
      operationId: getCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Call Detail Record details
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/CallDetailRecord.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
