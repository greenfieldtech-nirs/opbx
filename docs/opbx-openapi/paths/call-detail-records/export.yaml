paths:
  /v1/call-detail-records/export:
    get:
      tags:
        - Call Detail Records
      summary: Export CDR records
      operationId: exportCdr
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: call-detail-records:read
      description: >-
        Streams all matching CDRs as CSV, newest first, as `call-detail-records-YYYY-MM-DD-HHMMSS.csv`.
        Accepts the same filters as the list endpoint (from, to, disposition, direction, user,
        session_token, from_date, to_date); `sort_by`, `sort_order` and pagination are ignored.
        Any role can export; Supervisors are always limited to the resources they supervise.
        Columns: Timestamp, From, To, Call Start Time, Call Answer Time, Call End Time, Domain,
        Session Token, Duration (sec), Billable (sec), Status. Times are `Y-m-d H:i:s`; the call
        times, session token and status come from the raw CDR session.
      parameters:
        - $ref: '../../components/parameters/query/CdrArchive.yaml'
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: disposition
          in: query
          schema:
            type: string
          description: Exact disposition (for example ANSWER, BUSY, NOANSWER)
        - name: direction
          in: query
          schema:
            type: string
            enum: [incoming, outgoing, internal, application]
        - name: user
          in: query
          schema:
            type: string
          description: Partial name of the extension's user (not available with `archive`)
        - name: session_token
          in: query
          schema:
            type: string
          description: Exact session token (locates the CDR of a queue call)
      responses:
        '200':
          description: CSV file (Content-Disposition attachment)
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
