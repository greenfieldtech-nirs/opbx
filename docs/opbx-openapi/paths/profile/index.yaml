paths:
  /v1/profile:
    get:
      tags:
      - Profile
      summary: Get user profile
      description: 'Returns current authenticated user''s profile including

        organization details, contact information and the user''s own extension. Any role.

        Not available to API keys (403).

        '
      operationId: getProfile
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      organization_id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                      status:
                        type: string
                      phone:
                        type:
                        - string
                        - 'null'
                      street_address:
                        type:
                        - string
                        - 'null'
                      city:
                        type:
                        - string
                        - 'null'
                      state_province:
                        type:
                        - string
                        - 'null'
                      postal_code:
                        type:
                        - string
                        - 'null'
                      country:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      is_platform_manager:
                        type: boolean
                      extension:
                        type:
                        - object
                        - 'null'
                        description: The user's own `user` extension, or null when none is assigned
                        properties:
                          id:
                            type: integer
                          extension_number:
                            type: string
                      social_identities:
                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                            provider_email:
                              type:
                              - string
                              - 'null'
                      organization:
                        type: object
                        description: Organization summary
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          slug:
                            type: string
                          status:
                            type: string
                          timezone:
                            type: string
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
    put:
      tags:
      - Profile
      summary: Update user profile
      description: 'Update current user''s profile information.

        Only fields provided will be updated. Any role. Not available to API keys (403).


        **Note**: Sending `role` is always refused with 403, because nobody can change their
        own role (use `PUT /v1/users/{user}`). A platform manager operating as an organization
        cannot update their own profile (403 `OPERATE_AS_SELF_MUTATION_FORBIDDEN`).

        '
      operationId: updateProfile
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Full name
                  example: John Doe
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Email address (must not be used by any other user)
                  example: john.doe@example.com
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                  description: Phone number
                  example: +1-555-123-4567
                street_address:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                  description: Street address
                  example: 123 Main St
                city:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: City
                  example: New York
                state_province:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: State or province
                  example: NY
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                  description: Postal code
                  example: '10001'
                country:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: Country
                  example: USA
                role:
                  type: string
                  enum:
                  - owner
                  - pbx_admin
                  - pbx_user
                  - reporter
                  description: Always refused with 403 (you cannot change your own role)
                  example: pbx_admin
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated successfully.
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      organization_id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
                      phone:
                        type:
                        - string
                        - 'null'
                      street_address:
                        type:
                        - string
                        - 'null'
                      city:
                        type:
                        - string
                        - 'null'
                      state_province:
                        type:
                        - string
                        - 'null'
                      postal_code:
                        type:
                        - string
                        - 'null'
                      country:
                        type:
                        - string
                        - 'null'
                      updated_at:
                        type: string
                        format: date-time
                      extension:
                        type:
                        - object
                        - 'null'
                        description: The user's own `user` extension, or null when none is assigned
                        properties:
                          id:
                            type: integer
                          extension_number:
                            type: string
                      social_identities:
                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                            provider_email:
                              type:
                              - string
                              - 'null'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
        '500':
          $ref: ../../components/responses/ServerError.yaml
