paths:
  /v1/profile/organization:
    put:
      tags:
        - Profile
      summary: Update organization
      description: |
        Update organization details. Only fields provided are updated.

        **Authorization:** Only users with Owner role can update organization. Not
        available to API keys.

        Rate limited with `throttle:sensitive`: 10 requests per minute per user.
      operationId: updateOrganization
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Organization name (cannot be empty when sent)
                  example: Acme Corporation Inc.
                timezone:
                  type: string
                  description: PHP timezone identifier (any identifier PHP accepts; cannot be empty when sent)
                  example: America/Los_Angeles
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization updated successfully.
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                        enum:
                        - active
                        - suspended
                        - deleted
                      timezone:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '429':
          description: Too many attempts (10 requests per minute per user), or the per-organization API limit
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Too Many Requests
                message: Too many attempts. Please try again later.
                retry_after: 60
        '500':
          $ref: '../../components/responses/ServerError.yaml'
