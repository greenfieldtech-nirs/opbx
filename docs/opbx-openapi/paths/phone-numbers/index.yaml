paths:
  /v1/phone-numbers:
    get:
      tags:
        - Phone Numbers
      summary: List phone numbers
      operationId: listPhoneNumbers
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: status
          in: query
          description: Other values are ignored
          schema:
            type: string
            enum: [active, inactive]
        - name: routing_type
          in: query
          description: Other values (including `call_queue` and `unavailable`) are ignored
          schema:
            type: string
            enum: [extension, ring_group, business_hours, conference_room, ai_assistant, ai_load_balancer, ivr_menu]
        - name: search
          in: query
          schema:
            type: string
          description: Matches phone number or friendly name
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      description: |
        Paginated list ordered by created_at descending (per_page default 20, max 100). Returned
        as a Laravel resource collection (top-level `links`). Every authenticated user of the
        organization can list phone numbers.
      responses:
        '200':
          description: List of phone numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/PhoneNumber.yaml'
                  links:
                    $ref: '../../components/schemas/PaginationLinks.yaml'
                  meta:
                    $ref: '../../components/schemas/ResourceCollectionMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

    post:
      tags:
        - Phone Numbers
      summary: Create phone number
      description: |
        Owner and PBX Admin only. `status` defaults to `active` when omitted. The routing target
        named in `routing_config` must exist in the organization and be active (a ring group also
        needs at least one active member); `unavailable` is rejected (422, "Choose a destination.").
      operationId: createPhoneNumber
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/PhoneNumberInput.yaml'
                - required: [phone_number, routing_type, routing_config]
      responses:
        '201':
          description: Phone number created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/phone-numbers/{phone_number}:
    parameters:
      - name: phone_number
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Phone Numbers
      summary: Get phone number
      operationId: getPhoneNumber
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:read
      responses:
        '200':
          description: Phone number details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Phone Numbers
      summary: Update phone number
      description: |
        Owner and PBX Admin only. All fields are optional; `phone_number` and `enable_non_e164`
        are not accepted (`phone_number` is prohibited). When `routing_type` is sent,
        `routing_config` must be sent too and the target is validated as on create (`unavailable`
        is accepted). `routing_config` sent without `routing_type` is stored without target checks.
      operationId: updatePhoneNumber
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/PhoneNumberInput.yaml'
      responses:
        '200':
          description: Phone number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Phone Numbers
      summary: Partially update phone number
      description: |
        Owner and PBX Admin only. All fields are optional; `phone_number` and `enable_non_e164`
        are not accepted (`phone_number` is prohibited). When `routing_type` is sent,
        `routing_config` must be sent too and the target is validated as on create (`unavailable`
        is accepted). `routing_config` sent without `routing_type` is stored without target checks.
      operationId: patchPhoneNumber
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/PhoneNumberInput.yaml'
      responses:
        '200':
          description: Phone number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Phone Numbers
      summary: Delete phone number
      description: Owner and PBX Admin only. Refused with 409 when the DID is still referenced (for example by routing, an auto-dialer caller ID pool, or a blocked-DID entry). The 409 body lists the references.
      operationId: deletePhoneNumber
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      responses:
        '204':
          description: Phone number deleted (empty body)
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
