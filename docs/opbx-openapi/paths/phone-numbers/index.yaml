paths:
  /v1/phone-numbers:
    get:
      tags:
        - Phone Numbers
      summary: List Phone Numbers
      operationId: listPhoneNumbers
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: routing_type
          in: query
          schema:
            type: string
            enum: [extension, ring_group, business_hours, conference_room, ai_assistant, ai_load_balancer, ivr_menu]
        - name: search
          in: query
          schema:
            type: string
          description: Matches phone number or friendly name
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      description: Paginated list ordered by created_at descending (per_page default 20, max 100). Returned as a Laravel resource collection (top-level `links`).
      responses:
        '200':
          description: List of Phone Numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/PhoneNumber.yaml'
                  links:
                    $ref: '../../components/schemas/PaginationLinks.yaml'
                  meta:
                    $ref: '../../components/schemas/ResourceCollectionMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Phone Numbers
      summary: Create Phone Number
      operationId: createPhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/PhoneNumberInput.yaml'
                - required: [phone_number, routing_type, routing_config, status]
      responses:
        '201':
          description: Phone Number created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/phone-numbers/{phone_number}:
    parameters:
      - name: phone_number
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Phone Numbers
      summary: Get Phone Number
      operationId: getPhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:read
      responses:
        '200':
          description: Phone Number details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Phone Numbers
      summary: Update Phone Number
      operationId: updatePhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/PhoneNumberInput.yaml'
      responses:
        '200':
          description: Phone Number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Phone Numbers
      summary: Partially update Phone Number
      operationId: patchPhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/PhoneNumberInput.yaml'
      responses:
        '200':
          description: Phone Number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/PhoneNumber.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Phone Numbers
      summary: Delete Phone Number
      description: Refused with 409 when the DID is still referenced (for example by routing, a call tracking number, an auto-dialer caller ID pool, or a blocked-DID entry). The 409 body lists the references.
      operationId: deletePhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      responses:
        '204':
          description: Phone Number deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
