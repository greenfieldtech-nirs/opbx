paths:
  /v1/phone-numbers/default-caller-id:
    get:
      tags:
        - Phone Numbers
      summary: Get default outbound caller ID
      description: |
        The organization-wide default outbound caller ID. Outbound call routing presents it
        when neither the calling extension nor the matched outbound whitelist rule has an
        active `default_caller_id_did_id`; only an active DID of the organization counts,
        otherwise the call presents `Unknown`. See the Outbound Calling Overview.

        Returns the organization's default outbound caller ID DID, or `null` if none
        is configured. Every authenticated user of the organization can read it.
      operationId: getDefaultCallerId
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:read
      responses:
        '200':
          description: Default outbound caller ID (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                      - object
                      - 'null'
                    properties:
                      did_id:
                        type: integer
                      phone_number:
                        type: string
                      friendly_name:
                        type:
                          - string
                          - 'null'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
    put:
      tags:
        - Phone Numbers
      summary: Set default outbound caller ID
      description: |
        The organization-wide default outbound caller ID. Outbound call routing presents it
        when neither the calling extension nor the matched outbound whitelist rule has an
        active `default_caller_id_did_id`; only an active DID of the organization counts,
        otherwise the call presents `Unknown`. See the Outbound Calling Overview.

        Sets or clears the organization's default outbound caller ID. When `did_id`
        is non-null the DID must exist in the organization and be active; when null the
        setting is removed. Owner and PBX Admin only.
      operationId: setDefaultCallerId
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: phone-numbers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - did_id
              properties:
                did_id:
                  type:
                    - integer
                    - 'null'
                  description: DID ID to use as the default caller ID, or null to clear.
      responses:
        '200':
          description: Updated default outbound caller ID (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                      - object
                      - 'null'
                    properties:
                      did_id:
                        type: integer
                      phone_number:
                        type: string
                      friendly_name:
                        type:
                          - string
                          - 'null'
        '401':
          $ref: '../../openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../openapi.yaml#/components/responses/Forbidden'
        '422':
          description: |
            `did_id` missing or not an integer (validation error body), or the DID does not
            exist in the organization (`error: Invalid DID`) or is inactive (`error: Inactive DID`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../../openapi.yaml#/components/schemas/Error'
                  - $ref: '../../openapi.yaml#/components/schemas/ValidationError'
