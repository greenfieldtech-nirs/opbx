paths:
  /v1/ivr-menus/voices:
    get:
      tags:
        - IVR Menus
      summary: Get available voices
      operationId: getIvrVoices
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:read
      description: TTS voices available from Cloudonix for the organization's domain.
      responses:
        '200':
          description: Voices retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  filters:
                    type: object
                    description: Filter options derived from the voice list
                    additionalProperties: true
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '503':
          description: Cloudonix settings missing or incomplete
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  troubleshooting:
                    type: array
                    items:
                      type: string
