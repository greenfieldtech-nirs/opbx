paths:
  /v1/ivr-menus:
    get:
      tags:
        - IVR Menus
      summary: List IVR Menus
      description: |
        Paginated list of the organization's IVR menus (any role). Each item includes its
        options (ordered by priority) and `options_count`, except when `per_page=100`
        (dropdown mode), which omits both.
      operationId: listIVRMenus
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, status, created_at, updated_at]
            default: created_at
          description: Sort field; other values fall back to `created_at`.
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by status; other values are ignored.
        - name: search
          in: query
          schema:
            type: string
          description: Matches name or description (substring)
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      responses:
        '200':
          description: List of IVR Menus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/IvrMenu.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - IVR Menus
      summary: Create IVR Menu
      description: Owner and PBX Admin only. Returns the menu with its options.
      operationId: createIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/IvrMenuInput.yaml'
      responses:
        '201':
          description: IVR Menu created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/ivr-menus/{ivrMenu}:
    parameters:
      - name: ivrMenu
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - IVR Menus
      summary: Get IVR Menu
      description: Any role. Returns the menu with its options (no `options_count`).
      operationId: getIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:read
      responses:
        '200':
          description: IVR Menu details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - IVR Menus
      summary: Update IVR Menu
      description: |
        Owner and PBX Admin only. Full replacement with the same rules as create: the
        existing options are deleted and recreated from `options`.
      operationId: updateIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/IvrMenuInput.yaml'
      responses:
        '200':
          description: IVR Menu updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - IVR Menus
      summary: Delete IVR Menu
      description: Owner and PBX Admin only. Refused with 409 when the menu is still referenced by routing (for example from a DID or an option of another menu). The 409 body lists the references.
      operationId: deleteIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      responses:
        '204':
          description: IVR Menu deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
