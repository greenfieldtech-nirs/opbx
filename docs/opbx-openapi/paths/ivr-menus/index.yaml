paths:
  /v1/ivr-menus:
    get:
      tags:
        - IVR Menus
      summary: List IVR Menus
      description: Get paginated list of IVR Menus
      operationId: listIVRMenus
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, status, created_at, updated_at]
            default: created_at
        - $ref: '../../components/parameters/query/SortOrder.yaml'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      responses:
        '200':
          description: List of IVR Menus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/IvrMenu.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - IVR Menus
      summary: Create IVR Menu
      operationId: createIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/IvrMenuInput.yaml'
      responses:
        '201':
          description: IVR Menu created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/ivr-menus/{ivrMenu}:
    parameters:
      - name: ivrMenu
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - IVR Menus
      summary: Get IVR Menu
      operationId: getIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:read
      responses:
        '200':
          description: IVR Menu details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - IVR Menus
      summary: Update IVR Menu
      operationId: updateIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/IvrMenuInput.yaml'
      responses:
        '200':
          description: IVR Menu updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/IvrMenu.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - IVR Menus
      summary: Delete IVR Menu
      description: Refused with 409 when the menu is still referenced by routing (for example from a DID or an option of another menu). The 409 body lists the references.
      operationId: deleteIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ivr-menus:write
      responses:
        '204':
          description: IVR Menu deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
