paths:
  /v1/ai-assistant/providers:
    get:
      tags:
        - AI Assistants
      summary: List AI assistant providers
      description: |
        Get all available AI assistant providers grouped by protocol.
        Includes configuration metadata for dynamic form rendering.
      operationId: listAiAssistantProviders
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ai-assistant-providers:read
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: &provider
                          type: object
                          properties:
                            key:
                              type: string
                              example: dograh-cloud
                            name:
                              type: string
                            protocol:
                              type: string
                              enum: [sip, websocket, dummy]
                            url_template:
                              type: [string, 'null']
                              description: Template for the URL the assistant connects to, e.g. `{websocket_endpoint}/{agent_uuid}`. Null for SIP and dummy providers.
                            description:
                              type: [string, 'null']
                            config_fields:
                              type: array
                              description: Fields the assistant `configuration` object takes. Empty for dummy providers; SIP providers take `phone_number`.
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: Key in the assistant `configuration` object
                                  label:
                                    type: string
                                  type:
                                    type: string
                                    description: Input type (for example `text`, `url`, `tel`, `email`, `number`)
                                  required:
                                    type: boolean
                                  placeholder:
                                    type: [string, 'null']
                                  description:
                                    type: [string, 'null']
                                  validation_rules:
                                    type: array
                                    items:
                                      type: string
                                  read_only:
                                    type: boolean
                                    description: Fixed value; the server overwrites what the client sends
                                  default_value:
                                    type: [string, 'null']
                      grouped:
                        type: object
                        description: The same provider objects, grouped by protocol
                        properties:
                          sip:
                            type: array
                            items: *provider
                          websocket:
                            type: array
                            items: *provider
                          dummy:
                            type: array
                            items: *provider
                      protocols:
                        type: array
                        items:
                          type: string
                        example: [sip, websocket, dummy]
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

  /v1/ai-assistant/providers/{provider}:
    get:
      tags:
        - AI Assistants
      summary: Get provider details
      description: Get specific provider configuration metadata
      operationId: getAiAssistantProvider
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ai-assistant-providers:read
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          example: openai
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: *provider
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: Provider not found

  /v1/ai-assistant/providers/protocol/{protocol}:
    get:
      tags:
        - AI Assistants
      summary: Get providers by protocol
      description: Get providers filtered by protocol (sip, websocket or dummy)
      operationId: getProvidersByProtocol
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: ai-assistant-providers:read
      parameters:
        - name: protocol
          in: path
          required: true
          description: Any other value returns 400.
          schema:
            type: string
            enum: [sip, websocket, dummy]
          example: websocket
      responses:
        '200':
          description: Providers for protocol
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: *provider
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '400':
          description: Invalid protocol
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                message: 'Invalid protocol. Must be "sip", "websocket", or "dummy".'
