paths:
  /v1/ai-assistants:
    get:
      tags:
      - AI Assistants
      summary: List AI assistants
      description: |
        Paginated list of AI assistants in the organization. Any authenticated user can list.
        Filters: `status`, `protocol`, `provider` (exact match) and `search`. An unknown
        `sort_by` value falls back to `name`; an unknown `status` value is ignored.
        List items do not include `usage_count`, `used_by_extensions`, `created_by` or `updated_by`.
      operationId: listAiAssistants
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - name
          - provider
          - protocol
          - status
          - created_at
          - updated_at
          default: name
      - $ref: ../../components/parameters/query/SortOrder.yaml
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: protocol
        in: query
        schema:
          type: string
          enum:
          - sip
          - websocket
          - dummy
      - name: provider
        in: query
        schema:
          type: string
      - name: search
        in: query
        description: Case-insensitive substring match on name, description or provider
        schema:
          type: string
      responses:
        '200':
          description: List of AI assistants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AiAssistant.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
    post:
      tags:
      - AI Assistants
      summary: Create AI assistant
      description: |
        Create an AI assistant. Owner and PBX Admin only. `protocol` is set from the provider.
        `provider` must be a key from the provider registry, and `configuration` is checked
        against the provider's `config_fields` (required fields, and `email`/`url`/`tel`/`number`
        formats). For `dograh-cloud` the server sets `configuration.websocket_endpoint` to the
        fixed Dograh Cloud endpoint. `status` defaults to `active`.
        The response includes `created_by` and `updated_by`.
      operationId: createAiAssistant
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../components/schemas/AiAssistantInput.yaml'
                - required:
                    - name
                    - provider
                    - configuration
      responses:
        '201':
          description: AI assistant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistant created successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistant.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/ai-assistants/{ai_assistant}:
    parameters:
    - name: ai_assistant
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - AI Assistants
      summary: Get AI assistant
      description: |
        AI assistant details. Includes `used_by_extensions` (up to 10 extensions that use the
        assistant, omitted when none) and `usage_count`.
      operationId: getAiAssistant
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:read
      responses:
        '200':
          description: AI assistant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/AiAssistant.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - AI Assistants
      summary: Update AI assistant
      description: &updDesc |
        Update an AI assistant. Owner and PBX Admin only. All fields are optional; `status`,
        `name` and `provider` cannot be null. Changing `provider` resets `protocol` from the
        new provider. `configuration` is checked against the provider's `config_fields` only
        when `provider` is sent in the same request. The response includes `created_by` and
        `updated_by`.
      operationId: updateAiAssistant
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantInput.yaml'
      responses:
        '200':
          description: AI assistant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistant updated successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistant.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - AI Assistants
      summary: Partially update AI assistant
      description: *updDesc
      operationId: patchAiAssistant
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/AiAssistantInput.yaml'
      responses:
        '200':
          description: AI assistant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Aiassistant updated successfully.
                  data:
                    $ref: ../../components/schemas/AiAssistant.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - AI Assistants
      summary: Delete AI assistant
      description: |
        Delete an AI assistant. Owner and PBX Admin only. Refused with 409 while anything still
        points at it: an AI assistant extension, a call queue or AI load balancer fallback, AI
        load balancer membership, or other routing (DID routing, IVR options, business hours,
        call tracking). The 409 body lists the references.
      operationId: deleteAiAssistant
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: ai-assistants:write
      responses:
        '204':
          description: AI assistant deleted
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          $ref: ../../components/responses/ResourceInUse.yaml
