paths:
  /v1/business-hours/{businessHour}/toggle-status:
    patch:
      tags:
        - Business Hours
      summary: Toggle business hours status
      operationId: toggleBusinessHoursStatus
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: businessHour
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status toggled
