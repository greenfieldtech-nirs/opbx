paths:
  /v1/business-hours/{businessHour}/duplicate:
    post:
      tags:
        - Business Hours
      summary: Duplicate business hours schedule
      operationId: duplicateBusinessHours
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: businessHour
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Schedule duplicated
