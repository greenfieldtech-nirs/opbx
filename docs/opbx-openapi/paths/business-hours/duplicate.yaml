paths:
  /v1/business-hours/{businessHour}/duplicate:
    post:
      tags:
        - Business Hours
      summary: Duplicate business hours schedule
      description: >
        Owner and PBX Admin only. Copies the weekly schedule, the exceptions (with
        their type and special-hours time ranges) and the open/closed actions into a
        new schedule named "<name> (Copy)" with status `inactive` and the same
        `timezone` as the original.
      operationId: duplicateBusinessHours
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:write
      parameters:
        - name: businessHour
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Schedule duplicated as "<name> (Copy)" with status inactive
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Business hours schedule duplicated successfully.
                  data:
                    $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
