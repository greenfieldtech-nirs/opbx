paths:
  /v1/business-hours:
    get:
      tags:
        - Business Hours
      summary: List Business Hours Schedules
      description: >
        Paginated list of the organization's schedules. Available to all roles.
        An unknown `sort_by` falls back to `name`; default order is ascending.
      operationId: listBusinessHoursSchedules
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:read
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, status, created_at, updated_at]
            default: name
        - $ref: '../../components/parameters/query/SortOrder.yaml'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - $ref: '../../components/parameters/query/Unprovisioned.yaml'
      responses:
        '200':
          description: List of Business Hours Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Business Hours
      summary: Create Business Hours Schedule
      description: Owner and PBX Admin only.
      operationId: createBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/BusinessHoursScheduleInput.yaml'
      responses:
        '201':
          description: Business Hours Schedule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Businesshoursschedule created successfully.
                  data:
                    $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/business-hours/{business_hour}:
    parameters:
      - name: business_hour
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Business Hours
      summary: Get Business Hours Schedule
      operationId: getBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:read
      responses:
        '200':
          description: Business Hours Schedule details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Business Hours
      summary: Update Business Hours Schedule
      description: >
        Owner and PBX Admin only. Full replacement: send the whole schedule,
        including `status`.
      operationId: updateBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/BusinessHoursScheduleInput.yaml'
      responses:
        '200':
          description: Business Hours Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Businesshoursschedule updated successfully.
                  data:
                    $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Business Hours
      summary: Partially update Business Hours Schedule
      description: >
        Same as PUT. Despite the method, the body is validated as a full
        replacement (all required fields, including `status`).
      operationId: patchBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/BusinessHoursScheduleInput.yaml'
      responses:
        '200':
          description: Business Hours Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Businesshoursschedule updated successfully.
                  data:
                    $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Business Hours
      summary: Delete Business Hours Schedule
      description: Owner and PBX Admin only. Refused with 409 when the schedule is still referenced by routing (for example a business-hours action on a DID, extension, or IVR menu). The 409 body lists the references.
      operationId: deleteBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: business-hours:write
      responses:
        '204':
          description: Business Hours Schedule deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '409':
          $ref: '../../components/responses/ResourceInUse.yaml'
