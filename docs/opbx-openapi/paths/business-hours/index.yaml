paths:
  /v1/business-hours:
    get:
      tags:
        - Business Hours
      summary: List Business Hours Schedules
      description: Get paginated list of Business Hours Schedules
      operationId: listBusinessHoursSchedules
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of Business Hours Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/BusinessHoursSchedule.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Business Hours
      summary: Create Business Hours Schedule
      operationId: createBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Business Hours Schedule created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/business-hours/{business_hour}:
    parameters:
      - name: business_hour
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Business Hours
      summary: Get Business Hours Schedule
      operationId: getBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Business Hours Schedule details
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Business Hours
      summary: Update Business Hours Schedule
      operationId: updateBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Business Hours Schedule updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Business Hours
      summary: Delete Business Hours Schedule
      operationId: deleteBusinessHoursSchedule
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Business Hours Schedule deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
