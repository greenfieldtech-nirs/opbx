paths:
  /v1/settings/cloudonix/outbound-trunks:
    get:
      tags:
        - Settings
      summary: Get outbound trunks
      operationId: getOutboundTrunks
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Outbound trunks of the Cloudonix domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  trunks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
        '422':
          description: Cloudonix settings not configured
        '500':
          description: Cloudonix API error
