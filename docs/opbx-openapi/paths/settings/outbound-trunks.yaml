paths:
  /v1/settings/cloudonix/outbound-trunks:
    get:
      tags:
        - Settings
      summary: Get outbound trunks
      description: |
        Lists the outbound voice trunks of the organization's Cloudonix domain, as returned
        by the Cloudonix API. Owner only.
      operationId: getOutboundTrunks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Outbound trunks of the Cloudonix domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  trunks:
                    type: array
                    items:
                      type: object
                      description: Cloudonix trunk object, passed through unchanged
                      additionalProperties: true
                  count:
                    type: integer
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not the organization Owner, or an API key (no API-key grant covers this route)
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '422':
          description: Cloudonix settings not configured (domain UUID or API key missing)
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Cloudonix settings not configured
                message: Please configure Cloudonix settings before fetching outbound trunks.
        '500':
          description: The Cloudonix API call failed
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Failed to fetch outbound trunks
                message: Unable to retrieve outbound trunks from Cloudonix API.
