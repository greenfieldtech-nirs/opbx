paths:
  /v1/settings/cloudonix/generate-requests-key:
    post:
      tags:
        - Settings
      summary: Generate API requests key
      description: |
        Returns a new random 32-character alphanumeric key for `domain_requests_api_key`.
        Owner only. The key is not stored; send it in `PUT /v1/settings/cloudonix` to save it.
      operationId: generateRequestsKey
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: A new random key (not stored)
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    minLength: 32
                    maxLength: 32
                  message:
                    type: string
                    example: API key generated successfully. Copy and save this key as it cannot be retrieved later.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: Not the organization Owner, or an API key (no API-key grant covers this route)
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
