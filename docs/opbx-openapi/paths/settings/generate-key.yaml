paths:
  /v1/settings/cloudonix/generate-requests-key:
    post:
      tags:
        - Settings
      summary: Generate API requests key
      operationId: generateRequestsKey
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: A new random key. Not stored; send it in `domain_requests_api_key` to save it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                  message:
                    type: string
