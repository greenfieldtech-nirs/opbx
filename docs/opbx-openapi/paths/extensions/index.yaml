paths:
  /v1/extensions:
    get:
      tags:
      - Extensions
      summary: List extensions
      description: Get paginated list of extensions in the organization
      operationId: listExtensions
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - extension_number
          - type
          - status
          - created_at
          - updated_at
          default: extension_number
      - $ref: ../../components/parameters/query/SortOrder.yaml
      - name: type
        in: query
        schema:
          type: string
          enum:
          - user
          - conference
          - ring_group
          - ivr
          - ai_assistant
          - custom_logic
          - forward
          - queue
          - ai_load_balancer
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - pending
      - name: user_id
        in: query
        schema:
          type: integer
        description: Only extensions assigned to this user
      - name: search
        in: query
        schema:
          type: string
        description: Search in extension number or name
      responses:
        '200':
          description: List of extensions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/Extension.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
    post:
      tags:
      - Extensions
      summary: Create extension
      description: Create a new extension
      operationId: createExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extension_number:
                  type: string
                  pattern: ^\d{3,5}$
                  description: 3-5 digits, unique in the organization
                  example: '1001'
                user_id:
                  type:
                  - integer
                  - 'null'
                  description: Assigned user ID
                type:
                  type: string
                  enum:
                  - user
                  - conference
                  - ring_group
                  - ivr
                  - ai_assistant
                  - custom_logic
                  - forward
                  - queue
                  - ai_load_balancer
                  example: user
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                voicemail_enabled:
                  type: boolean
                configuration:
                  type: object
                  description: Type-specific settings. The key for the extension's type is required.
                  properties:
                    conference_room_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `conference`
                    ring_group_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ring_group`
                    call_queue_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `queue`
                    ivr_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ivr`
                    ai_assistant_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_assistant`
                    ai_load_balancer_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_load_balancer`
                    container_application_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    container_block_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    forward_to:
                      type:
                      - string
                      - 'null'
                      maxLength: 50
                      description: Required for `forward`
                  additionalProperties: true
                default_caller_id_did_id:
                  type:
                  - integer
                  - 'null'
                  description: Must reference an active DID owned by the authenticated organization.
              required:
              - extension_number
              - type
              - status
      responses:
        '201':
          description: Extension created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/Extension.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/extensions/{extension}:
