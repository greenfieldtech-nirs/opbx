    delete:
      tags:
      - Extensions
      summary: Delete extension
      description: Refused with 409 when the extension is still referenced (for example by a ring group member, a queue membership, or a call-tracking or blacklist entry). The 409 body lists the references.
      operationId: deleteExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      parameters:
      - $ref: ../../components/parameters/path/ExtensionId.yaml
      responses:
        '204':
          description: Extension deleted
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
