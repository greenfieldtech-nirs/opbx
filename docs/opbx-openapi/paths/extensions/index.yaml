paths:
  /v1/extensions:
    get:
      tags:
      - Extensions
      summary: List extensions
      description: >-
        Paginated list of the organization's extensions. Every role can list all extensions of
        the organization. Unknown `sort_by`, `type` or `status` values are ignored.
      operationId: listExtensions
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - $ref: ../../components/parameters/query/PerPage.yaml
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - extension_number
          - type
          - status
          - created_at
          - updated_at
          default: extension_number
      - $ref: ../../components/parameters/query/SortOrder.yaml
      - name: type
        in: query
        schema:
          type: string
          enum:
          - user
          - conference
          - ring_group
          - ivr
          - ai_assistant
          - custom_logic
          - forward
          - queue
          - ai_load_balancer
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - pending
      - name: user_id
        in: query
        schema:
          type: integer
        description: Only extensions assigned to this user
      - name: search
        in: query
        schema:
          type: string
        description: Substring match on the extension number
      responses:
        '200':
          description: List of extensions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/Extension.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
    post:
      tags:
      - Extensions
      summary: Create extension
      description: >-
        Create a new extension. Owner and PBX Admin only. A `user` extension gets a generated
        SIP password and is pushed to Cloudonix as a subscriber; a failed Cloudonix push does
        not fail the request.
      operationId: createExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extension_number:
                  type: string
                  pattern: ^\d{3,5}$
                  description: 3-5 digits, unique in the organization
                  example: '1001'
                user_id:
                  type:
                  - integer
                  - 'null'
                  description: Assigned user ID (a user of the organization). Only allowed on `user` extensions.
                type:
                  type: string
                  enum:
                  - user
                  - conference
                  - ring_group
                  - ivr
                  - ai_assistant
                  - custom_logic
                  - forward
                  - queue
                  - ai_load_balancer
                  example: user
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  default: active
                  example: active
                voicemail_enabled:
                  type: boolean
                  default: false
                  description: Can be true only on `user` extensions.
                configuration:
                  type: object
                  description: Type-specific settings. The key for the extension's type is required.
                  properties:
                    conference_room_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `conference`
                    ring_group_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ring_group`
                    call_queue_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `queue`. Must be an active call queue of the organization.
                    ivr_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ivr`
                    ai_assistant_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_assistant`. Must be an AI assistant of the organization; also stored as the extension's `ai_assistant_id`.
                    ai_load_balancer_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_load_balancer`. Must be an AI load balancer of the organization.
                    container_application_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    container_block_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    forward_to:
                      type:
                      - string
                      - 'null'
                      maxLength: 50
                      description: Required for `forward`
                  additionalProperties: true
                default_caller_id_did_id:
                  type:
                  - integer
                  - 'null'
                  description: >-
                    A phone number (DID) of the organization. Used as the outbound caller ID only
                    while that DID is active.
              required:
              - extension_number
              - type
      responses:
        '201':
          description: Extension created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/Extension.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/extensions/{extension}:
    get:
      tags:
      - Extensions
      summary: Get extension
      description: >-
        Owner, PBX Admin, PBX User and Reporter can read any extension of the organization; a
        Supervisor only the extensions of the users assigned to them.
      operationId: getExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:read
      parameters:
      - $ref: ../../components/parameters/path/ExtensionId.yaml
      responses:
        '200':
          description: Extension details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: ../../components/schemas/Extension.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    put:
      tags:
      - Extensions
      summary: Update extension
      description: >-
        All fields are optional. Owner and PBX Admin can update any extension, except that only
        an Owner can update an extension assigned to an Owner. A PBX User can update only their
        own extension and cannot change `type`, `user_id` or `status`. Supervisor and Reporter
        get 403. Changing `type` to or from `user` creates or removes the Cloudonix subscriber
        and the SIP password.
      operationId: updateExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      parameters:
      - $ref: ../../components/parameters/path/ExtensionId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extension_number:
                  type: string
                  pattern: ^\d{3,5}$
                  description: Cannot be changed after creation; only the current value is accepted.
                  example: '1001'
                user_id:
                  type:
                  - integer
                  - 'null'
                  description: Assigned user ID (a user of the organization). Only allowed on `user` extensions.
                type:
                  type: string
                  enum:
                  - user
                  - conference
                  - ring_group
                  - ivr
                  - ai_assistant
                  - custom_logic
                  - forward
                  - queue
                  - ai_load_balancer
                  example: user
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                voicemail_enabled:
                  type: boolean
                  description: Can be true only on `user` extensions.
                configuration:
                  type: object
                  description: >-
                    Type-specific settings. When `type` is sent, the key for that type is
                    required.
                  properties:
                    conference_room_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `conference`
                    ring_group_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ring_group`
                    call_queue_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `queue`. Must be an active call queue of the organization.
                    ivr_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ivr`
                    ai_assistant_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_assistant`. Must be an AI assistant of the organization; also stored as the extension's `ai_assistant_id`.
                    ai_load_balancer_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_load_balancer`. Must be an AI load balancer of the organization.
                    container_application_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    container_block_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    forward_to:
                      type:
                      - string
                      - 'null'
                      maxLength: 50
                      description: Required for `forward`
                  additionalProperties: true
                default_caller_id_did_id:
                  type:
                  - integer
                  - 'null'
                  description: >-
                    A phone number (DID) of the organization. Used as the outbound caller ID only
                    while that DID is active.
      responses:
        '200':
          description: Extension updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/Extension.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    patch:
      tags:
      - Extensions
      summary: Partially update extension
      description: Same as `PUT`.
      operationId: patchExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      parameters:
      - $ref: ../../components/parameters/path/ExtensionId.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extension_number:
                  type: string
                  pattern: ^\d{3,5}$
                  description: Cannot be changed after creation; only the current value is accepted.
                  example: '1001'
                user_id:
                  type:
                  - integer
                  - 'null'
                  description: Assigned user ID (a user of the organization). Only allowed on `user` extensions.
                type:
                  type: string
                  enum:
                  - user
                  - conference
                  - ring_group
                  - ivr
                  - ai_assistant
                  - custom_logic
                  - forward
                  - queue
                  - ai_load_balancer
                  example: user
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  - pending
                  example: active
                voicemail_enabled:
                  type: boolean
                  description: Can be true only on `user` extensions.
                configuration:
                  type: object
                  description: >-
                    Type-specific settings. When `type` is sent, the key for that type is
                    required.
                  properties:
                    conference_room_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `conference`
                    ring_group_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ring_group`
                    call_queue_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `queue`. Must be an active call queue of the organization.
                    ivr_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ivr`
                    ai_assistant_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_assistant`. Must be an AI assistant of the organization; also stored as the extension's `ai_assistant_id`.
                    ai_load_balancer_id:
                      type:
                      - integer
                      - 'null'
                      description: Required for `ai_load_balancer`. Must be an AI load balancer of the organization.
                    container_application_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    container_block_name:
                      type:
                      - string
                      - 'null'
                      maxLength: 255
                      description: Required for `custom_logic`
                    forward_to:
                      type:
                      - string
                      - 'null'
                      maxLength: 50
                      description: Required for `forward`
                  additionalProperties: true
                default_caller_id_did_id:
                  type:
                  - integer
                  - 'null'
                  description: >-
                    A phone number (DID) of the organization. Used as the outbound caller ID only
                    while that DID is active.
      responses:
        '200':
          description: Extension updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: ../../components/schemas/Extension.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
    delete:
      tags:
      - Extensions
      summary: Delete extension
      description: >-
        Owner and PBX Admin only (only an Owner can delete an extension assigned to an Owner).
        Refused with 409 when the extension is still referenced (for example by a ring group
        member, a queue membership, or a call-tracking or blacklist entry); the 409 body lists
        the references. A `user` extension is removed from Cloudonix first.
      operationId: deleteExtension
      security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
      x-api-key-scope: extensions:write
      parameters:
      - $ref: ../../components/parameters/path/ExtensionId.yaml
      responses:
        '204':
          description: Extension deleted
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '409':
          $ref: ../../components/responses/ResourceInUse.yaml
