paths:
  /v1/extensions/sync/compare:
    get:
      tags:
        - Extensions
      summary: Compare sync status
      operationId: compareSyncStatus
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Sync comparison

  /v1/extensions/sync:
    post:
      tags:
        - Extensions
      summary: Sync extensions with Cloudonix
      operationId: syncExtensions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Sync completed
