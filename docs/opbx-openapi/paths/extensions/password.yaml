paths:
  /v1/extensions/{extension}/password:
    get:
      tags:
        - Extensions
      summary: Get extension SIP password
      operationId: getExtensionPassword
      security:
        - bearerAuth: []
      parameters:
        - name: extension
          in: path
          required: true
          schema:
            type: integer
      description: >-
        Returns the SIP password of a `user` extension. Owner and PBX Admin can read any
        extension's password (only an Owner can read the password of an extension assigned to
        an Owner); any other user only the extension assigned to them. Not available to API
        keys. Other extension types have no password and return 204. Rate limited per user and
        IP: 10 requests per minute, 60 for Owner and PBX Admin. Sent with `Cache-Control:
        no-store`.
      responses:
        '200':
          description: Password retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      password:
                        type: string
                      warning:
                        type: string
                        example: This password is only shown once. Store it securely.
        '204':
          description: Not a `user` extension; no password
        '400':
          description: The extension has no password set
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '429':
          description: Too many password requests (sensitive-operation limit)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Too many requests
                message: Please wait before trying again.
                retry_after: 42

  /v1/extensions/{extension}/reset-password:
    put:
      tags:
        - Extensions
      summary: Reset extension password
      operationId: resetExtensionPassword
      security:
        - bearerAuth: []
      parameters:
        - name: extension
          in: path
          required: true
          schema:
            type: integer
      description: >-
        Generates a new SIP password for a `user` extension and pushes it to Cloudonix.
        Owner and PBX Admin can reset any extension (only an Owner can reset an extension
        assigned to an Owner); a PBX User only their own extension. Not available to API keys.
        Rate limited per user and IP: 10 requests per minute, 60 for Owner and PBX Admin. Sent
        with `Cache-Control: no-store`.
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      new_password:
                        type: string
                      warning:
                        type: string
                        example: This is the only time the password will be shown. Store it securely.
        '400':
          description: Only `user` extensions have SIP passwords
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '429':
          description: Too many password requests (sensitive-operation limit)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: Too many requests
                message: Please wait before trying again.
                retry_after: 42
        '500':
          $ref: '../../components/responses/ServerError.yaml'
        '502':
          description: Reset locally but the Cloudonix sync failed
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
