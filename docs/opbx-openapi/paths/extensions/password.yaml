paths:
  /v1/extensions/{extension}/password:
    get:
      tags:
        - Extensions
      summary: Get extension SIP password
      operationId: getExtensionPassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: extension
          in: path
          required: true
          schema:
            type: integer
      description: >-
        Returns the SIP password of a `user` extension. Not available to API keys.
        Other extension types have no password and return 204.
      responses:
        '200':
          description: Password retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      extension_id:
                        type: integer
                      extension_number:
                        type: string
                      password:
                        type: string
                      warning:
                        type: string
        '204':
          description: Not a `user` extension; no password
        '400':
          description: The extension has no password set
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

  /v1/extensions/{extension}/reset-password:
    put:
      tags:
        - Extensions
      summary: Reset extension password
      operationId: resetExtensionPassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: extension
          in: path
          required: true
          schema:
            type: integer
      description: >-
        Generates a new SIP password for a `user` extension and pushes it to Cloudonix.
        Not available to API keys.
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      extension_id:
                        type: integer
                      extension_number:
                        type: string
                      new_password:
                        type: string
                      warning:
                        type: string
        '400':
          description: Only `user` extensions have SIP passwords
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '502':
          description: Reset locally but the Cloudonix sync failed
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
