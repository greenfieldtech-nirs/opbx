paths:
  /v1/dialer/worker/health:
    get:
      tags:
      - Dialer Worker
      summary: Dialer worker health check
      description: 'Health check endpoint for the Go-based dialer worker service.


        All `/v1/dialer/worker/*` endpoints authenticate with `Authorization: Bearer

        <DIALER_WORKER_API_TOKEN>` (or `DIALER_WORKER_API_TOKEN_SECONDARY` during token

        rotation). When no primary token is configured they return 503. They are rate

        limited to `DIALER_WORKER_RATE_LIMIT` requests per minute per client IP

        (default 1000); over the limit they return 429 with `{"error": "Too Many Requests",

        "message": "Dialer worker rate limit exceeded.", "retry_after": ...}`. They act

        across all organizations.

        '
      operationId: dialerWorkerHealth
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: Worker API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  active_campaigns:
                    type: integer
                    description: Campaigns in active status
                  active_calls:
                    type: integer
                    description: Call sessions in progress
                  queue_depth:
                    type: integer
                    description: Destinations (all organizations) whose last disposition is busy,
                      no-answer or cancelled and whose retry time has been reached
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '503':
          description: DIALER_WORKER_API_TOKEN is not configured
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Service Unavailable
                message: Worker authentication not configured
  /v1/dialer/worker/campaigns/active:
    get:
      tags:
      - Dialer Worker
      summary: Get active campaigns
      description: 'Retrieve all auto-dialer campaigns (all organizations) in active status

        whose date range and schedule window, evaluated in the campaign timezone,

        include the current time. Used by the dialer worker to discover campaigns to

        execute.

        '
      operationId: getActiveCampaigns
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: List of active campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AutoDialerCampaign.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
  /v1/dialer/worker/campaigns/{campaign}/pause:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    post:
      tags:
      - Dialer Worker
      summary: Pause campaign
      description: 'Pause a campaign from the worker side (for example a circuit breaker or

        the schedule). Sets the status to paused and stores `reason` as the pause reason

        and `resume_at`, marks the campaign''s in-flight call sessions as failed and resets

        its pending-calls counter. The current status is not checked.

        '
      operationId: pauseCampaignFromWorker
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                paused_by:
                  type: string
                resume_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - reason
              - paused_by
      responses:
        '200':
          description: Campaign paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Campaign paused
                  data:
                    type: object
                    properties:
                      campaign_id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: paused
                      reason:
                        type: string
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Campaign not found
  /v1/dialer/worker/campaigns/{campaign}/destinations/pending:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Dialer Worker
      summary: Get pending destinations
      description: 'Retrieve destinations to dial for a campaign: destinations of the lists

        assigned to the campaign that are pending, have fewer than `max_dial_attempts`

        attempts and whose retry time (if any) has been reached, oldest first.

        `meta.total` is the number of rows returned; `meta.offset` is always 0.

        '
      operationId: getPendingDestinations
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: limit
        in: query
        description: Maximum number of destinations to return
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Destinations to dial
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/ListDestination.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Campaign not found
  /v1/dialer/worker/campaigns/{campaign}/destinations/retry:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Dialer Worker
      summary: Get retry destinations
      description: 'Retrieve destinations of the lists assigned to the campaign whose last

        disposition is busy, no-answer or cancelled, that have fewer than

        `max_dial_attempts` attempts and whose retry time (if any) has been reached,

        ordered by retry time. The status is not checked. `meta.total` is the number of

        rows returned; `meta.offset` is always 0. Not called by the current Go worker.

        '
      operationId: getRetryDestinations
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: limit
        in: query
        description: Maximum number of destinations to return
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Destinations to dial
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/ListDestination.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Campaign not found
  /v1/dialer/worker/calls/initiate:
    post:
      tags:
      - Dialer Worker
      summary: Initiate call
      description: 'Place an outbound call through Cloudonix and create a call session.


        The destination is first claimed atomically (pending -> dialing, `dial_attempts`

        + 1, `last_dialed_at` set); if it is not pending the request returns 409 and no

        call is placed. When Cloudonix rejects the call the claim is released (the

        attempt stays counted) and the request returns 500. On success the campaign

        pending-calls counter is incremented.

        '
      operationId: initiateCall
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        description: Replays of the same key for the same destination within one hour return the original 201 response instead of placing a second call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id:
                  type: integer
                destination_id:
                  type: integer
                phone_number:
                  type: string
                  description: Stored on the call session
                worker_id:
                  type: string
                initiated_at:
                  type: string
                  format: date-time
                caller_id:
                  type:
                  - string
                  - 'null'
                  description: Caller ID to present (selected from the pool). Defaults to the campaign caller ID
                caller_did_id:
                  type:
                  - integer
                  - 'null'
                  description: Phone number (DID) ID of the selected caller ID
              required:
              - campaign_id
              - destination_id
              - phone_number
              - worker_id
              - initiated_at
      responses:
        '201':
          description: Call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      call_id:
                        type:
                        - integer
                        - 'null'
                        description: Cloudonix call ID
                      caller_id:
                        type:
                        - string
                        - 'null'
                      caller_did_id:
                        type:
                        - integer
                        - 'null'
                      callback_url:
                        type: string
                        description: Status callback URL given to Cloudonix (`<webhook base>/api/webhooks/cloudonix/call-status`)
        '500':
          description: Cloudonix rejected the call
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                message: 'Failed to initiate call: ...'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '409':
          description: The destination is not pending (already claimed or finished); no call was placed
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                message: Destination is not pending (already claimed or finished)
        '422':
          description: >-
            Request validation failed, the campaign or destination does not exist (validation
            error body naming `campaign_id` / `destination_id`), or Cloudonix is not configured
            for the organization (`{"message": "Cloudonix not configured for this organization"}`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: ../../components/schemas/ValidationError.yaml
                - $ref: ../../components/schemas/Error.yaml
  /v1/dialer/worker/calls/generate-cxml:
    post:
      tags:
      - Dialer Worker
      summary: Generate CXML for call
      description: 'Generate the CXML document for an answered outbound call, based on the

        campaign routing destination (AI assistant, AI load balancer, or hangup).

        '
      operationId: generateCxml
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id:
                  type: integer
                session_id:
                  type: integer
                phone_number:
                  type: string
                call_sid:
                  type: string
              required:
              - campaign_id
              - session_id
              - phone_number
              - call_sid
      responses:
        '200':
          description: CXML for the answered call, wrapped in JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cxml:
                        type: string
                      routing_type:
                        type:
                        - string
                        - 'null'
                        enum: [ai_assistant, ai_load_balancer, hangup, null]
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Campaign not found
        '500':
          description: CXML generation failed
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: 'Failed to generate CXML: ...'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/calls/{session}/status:
    parameters:
    - name: session
      in: path
      required: true
      description: Call session ID (`session_id` returned by initiate)
      schema:
        type: integer
        minimum: 1
      example: 42
    patch:
      tags:
      - Dialer Worker
      summary: Update call status
      description: 'Update the status of a call session.


        Stores the session fields (`duration` / `billsec` default to 0) and decrements

        the campaign pending-calls counter. When `disposition` is set, the server decides

        the destination outcome: answered / completed -> completed; busy / no-answer ->

        pending with a retry time when the campaign retries on busy / no-answer and the

        destination has attempts left; anything else -> failed. `disposition` is optional:

        when it is omitted or null the stored session disposition is left unchanged, the

        destination is not touched and `destination_status` is `pending`. Not called by the

        current Go worker.

        '
      operationId: updateCallStatus
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                disposition:
                  type:
                  - string
                  - 'null'
                  description: Optional. Omit (or send null) on updates that carry no disposition
                duration:
                  type:
                  - integer
                  - 'null'
                billsec:
                  type:
                  - integer
                  - 'null'
                recording_url:
                  type:
                  - string
                  - 'null'
                completed_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - status
      responses:
        '200':
          description: Call status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      destination_status:
                        type: string
                        enum: [pending, completed, failed]
                        description: '`pending` when no disposition was sent'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Session not found
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/calls/{session}/disposition:
    parameters:
    - name: session
      in: path
      required: true
      description: Call session ID (`session_id` returned by initiate)
      schema:
        type: integer
        minimum: 1
      example: 42
    post:
      tags:
      - Dialer Worker
      summary: Set call disposition
      description: 'Set the final disposition of a call and apply the retry rules.


        The server decides the outcome; `should_retry` and `next_retry_at` are validated

        but ignored. answered / completed -> destination completed; busy / no-answer ->

        destination pending with a back-off retry time when the campaign retries on busy /

        no-answer and the destination has attempts left; anything else -> destination

        failed. The session is marked completed or failed and the campaign counters are

        updated. Not called by the current Go worker.

        '
      operationId: setDisposition
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disposition:
                  type: string
                  enum: [answered, completed, busy, no-answer, failed, cancelled, congestion]
                should_retry:
                  type: boolean
                  description: Ignored (the server decides)
                next_retry_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Ignored (the server computes the retry time)
                attempt_number:
                  type: integer
                  minimum: 1
                  description: Logged only
                duration:
                  type:
                  - integer
                  - 'null'
                billsec:
                  type:
                  - integer
                  - 'null'
              required:
              - disposition
              - should_retry
              - attempt_number
      responses:
        '200':
          description: Disposition recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      disposition:
                        type: string
                      destination_status:
                        type: string
                        enum: [pending, completed, failed]
                      will_retry:
                        type: boolean
                        description: True when destination_status is pending
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: Session, or its campaign or destination, not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: Session not found
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/state/persist:
    post:
      tags:
      - Dialer Worker
      summary: Persist worker state
      description: 'Persist the current state of a dialer worker in the cache for 10 minutes

        (key: `worker_id`). The validated body is stored as-is. `active_calls`,

        `retry_queue` and `campaign_states` must be present (they may be empty). Not called

        by the current Go worker.

        '
      operationId: persistState
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: string
                active_calls:
                  type: array
                  items: {}
                retry_queue:
                  type: array
                  items: {}
                campaign_states:
                  type: array
                  items: {}
                last_updated:
                  type: string
                  format: date-time
              required:
              - worker_id
              - active_calls
              - retry_queue
              - campaign_states
              - last_updated
      responses:
        '200':
          description: State persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: State persisted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/state/{workerId}:
    parameters:
    - name: workerId
      in: path
      required: true
      description: Worker ID
      schema:
        type: string
      example: worker-001
    get:
      tags:
      - Dialer Worker
      summary: Get worker state
      description: 'Retrieve the state last persisted for a dialer worker (kept for 10 minutes).

        Not called by the current Go worker.

        '
      operationId: getState
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: Worker state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: The body stored by `POST /v1/dialer/worker/state/persist`
                    properties:
                      worker_id:
                        type: string
                      active_calls:
                        type: array
                        items: {}
                      retry_queue:
                        type: array
                        items: {}
                      campaign_states:
                        type: array
                        items: {}
                      last_updated:
                        type: string
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          description: No state stored for this worker (or it expired)
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/Error.yaml
              example:
                error: State not found
