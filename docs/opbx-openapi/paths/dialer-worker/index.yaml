paths:
  /v1/dialer/worker/health:
    get:
      tags:
      - Dialer Worker
      summary: Dialer worker health check
      description: 'Health check endpoint for the Go-based dialer worker service.

        Used by the worker to verify connectivity to the API.

        '
      operationId: dialerWorkerHealth
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: Worker API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  active_campaigns:
                    type: integer
                  active_calls:
                    type: integer
                  queue_depth:
                    type: integer
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
  /v1/dialer/worker/campaigns/active:
    get:
      tags:
      - Dialer Worker
      summary: Get active campaigns
      description: 'Retrieve all active auto-dialer campaigns that are ready for dialing.

        Used by the dialer worker to discover campaigns to execute.

        '
      operationId: getActiveCampaigns
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: List of active campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/AutoDialerCampaign.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
  /v1/dialer/worker/campaigns/{campaign}/pause:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    post:
      tags:
      - Dialer Worker
      summary: Pause campaign
      description: 'Pause an active campaign from the worker side.

        Typically called when the campaign reaches its daily/hourly limits

        or encounters errors.

        '
      operationId: pauseCampaignFromWorker
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                paused_by:
                  type: string
                resume_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - reason
              - paused_by
      responses:
        '200':
          description: Campaign paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Campaign paused
                  data:
                    type: object
                    additionalProperties: true
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/dialer/worker/campaigns/{campaign}/destinations/pending:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Dialer Worker
      summary: Get pending destinations
      description: 'Retrieve pending destinations for a campaign.

        Returns destinations that are ready to be dialed.

        '
      operationId: getPendingDestinations
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Destinations to dial
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/ListDestination.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/dialer/worker/campaigns/{campaign}/destinations/retry:
    parameters:
    - name: campaign
      in: path
      required: true
      description: Campaign ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Dialer Worker
      summary: Get retry destinations
      description: 'Retrieve destinations that need to be retried.

        Returns destinations that failed previously and are eligible for retry.

        '
      operationId: getRetryDestinations
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Destinations to dial
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/ListDestination.yaml
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/dialer/worker/calls/initiate:
    post:
      tags:
      - Dialer Worker
      summary: Initiate call
      description: 'Initiate an outbound call through Cloudonix.

        Creates a call session and returns the call SID.

        '
      operationId: initiateCall
      security:
      - dialerWorkerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        description: Replays of the same key for the same destination return the original 201 response instead of placing a second call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id:
                  type: integer
                destination_id:
                  type: integer
                phone_number:
                  type: string
                worker_id:
                  type: string
                initiated_at:
                  type: string
                  format: date-time
                caller_id:
                  type:
                  - string
                  - 'null'
                  description: Defaults to the campaign caller ID
                caller_did_id:
                  type:
                  - integer
                  - 'null'
              required:
              - campaign_id
              - destination_id
              - phone_number
              - worker_id
              - initiated_at
      responses:
        '201':
          description: Call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      call_id:
                        type:
                        - string
                        - 'null'
                      caller_id:
                        type: string
                      caller_did_id:
                        type:
                        - integer
                        - 'null'
                      callback_url:
                        type: string
        '500':
          description: Cloudonix rejected the call
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/calls/generate-cxml:
    post:
      tags:
      - Dialer Worker
      summary: Generate CXML for call
      description: 'Generate CXML document for an outbound call.

        Returns the CXML that will be used to connect the call.

        '
      operationId: generateCxml
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign_id:
                  type: integer
                session_id:
                  type: integer
                phone_number:
                  type: string
                call_sid:
                  type: string
              required:
              - campaign_id
              - session_id
              - phone_number
              - call_sid
      responses:
        '200':
          description: CXML for the answered call, wrapped in JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cxml:
                        type: string
                      routing_type:
                        type:
                        - string
                        - 'null'
                        enum: [ai_assistant, ai_load_balancer, hangup, null]
        '404':
          description: Campaign not found
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '422':
          $ref: ../../components/responses/ValidationError.yaml
  /v1/dialer/worker/calls/{session}/status:
    parameters:
    - name: session
      in: path
      required: true
      description: Call session ID
      schema:
        type: string
      example: CA550e8400e29b41d4a716446655440000
    patch:
      tags:
      - Dialer Worker
      summary: Update call status
      description: 'Update the status of an active call session.

        Used to track call progress and outcomes.

        '
      operationId: updateCallStatus
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                disposition:
                  type:
                  - string
                  - 'null'
                duration:
                  type:
                  - integer
                  - 'null'
                billsec:
                  type:
                  - integer
                  - 'null'
                recording_url:
                  type:
                  - string
                  - 'null'
                completed_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - status
      responses:
        '200':
          description: Call status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      destination_status:
                        type: string
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/dialer/worker/calls/{session}/disposition:
    parameters:
    - name: session
      in: path
      required: true
      description: Call session ID
      schema:
        type: string
      example: CA550e8400e29b41d4a716446655440000
    post:
      tags:
      - Dialer Worker
      summary: Set call disposition
      description: 'Set the final disposition of a call.

        Records the outcome for reporting and analytics.

        '
      operationId: setDisposition
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disposition:
                  type: string
                  enum: [answered, completed, busy, no-answer, failed, cancelled, congestion]
                should_retry:
                  type: boolean
                next_retry_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                attempt_number:
                  type: integer
                  minimum: 1
                duration:
                  type:
                  - integer
                  - 'null'
                billsec:
                  type:
                  - integer
                  - 'null'
              required:
              - disposition
              - should_retry
              - attempt_number
      responses:
        '200':
          description: Disposition recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                      disposition:
                        type: string
                      destination_status:
                        type: string
                      will_retry:
                        type: boolean
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
  /v1/dialer/worker/state/persist:
    post:
      tags:
      - Dialer Worker
      summary: Persist worker state
      description: 'Persist the current state of a dialer worker.

        Used for worker recovery and load balancing.

        '
      operationId: persistState
      security:
      - dialerWorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: string
                active_calls:
                  type: array
                  items: {}
                retry_queue:
                  type: array
                  items: {}
                campaign_states:
                  type: array
                  items: {}
                last_updated:
                  type: string
                  format: date-time
              required:
              - worker_id
              - active_calls
              - retry_queue
              - campaign_states
              - last_updated
      responses:
        '200':
          description: State persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: State persisted successfully
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
  /v1/dialer/worker/state/{workerId}:
    parameters:
    - name: workerId
      in: path
      required: true
      description: Worker ID
      schema:
        type: string
      example: worker-001
    get:
      tags:
      - Dialer Worker
      summary: Get worker state
      description: 'Retrieve the persisted state of a dialer worker.

        Used during worker startup to resume from previous state.

        '
      operationId: getState
      security:
      - dialerWorkerAuth: []
      responses:
        '200':
          description: Worker state
          content:
            application/json:
              schema:
                type: object
                properties:
                  worker_id:
                    type: string
                  state:
                    type: object
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
