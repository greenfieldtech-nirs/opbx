paths:
  /v1/webphone/calls-log:
    get:
      tags:
        - Web Phone
      summary: Get Web Phone recent calls
      description: |
        Returns the 50 most recent CDRs whose caller (`from`) is the authenticated
        user's own `user`-type extension number, most recent first. Coaching sentinel
        destinations (`spy_*`, `barge_*`, `whisper_*`) are excluded.

        Available to any authenticated role (not to API keys). The user must have a
        `user`-type extension assigned, otherwise `404` is returned.
      operationId: getWebPhoneCallsLog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent calls for the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                          example: '+14155551212'
                        session_timestamp:
                          type:
                            - string
                            - 'null'
                          format: date-time
                        duration:
                          type: integer
                          description: Duration in seconds
                          example: 125
                        duration_formatted:
                          type: string
                          description: MM:SS (minutes are not wrapped into hours)
                          example: '02:05'
                        disposition:
                          type:
                            - string
                            - 'null'
                          description: Cloudonix CDR disposition
                          example: ANSWER
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          description: API keys are refused (no API-key grant covers this route)
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
        '404':
          description: No extension is assigned to this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No extension is assigned to this user.
