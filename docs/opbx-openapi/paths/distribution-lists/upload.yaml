paths:
  /v1/auto-dialer-campaigns/lists/{list}/upload:
    parameters:
      - name: list
        in: path
        required: true
        description: Distribution List ID
        schema:
          type: integer
          minimum: 1
        example: 1

    post:
      tags:
        - Distribution Lists
      summary: Upload CSV to list
      description: |
        Upload a CSV file to populate a distribution list. Processing runs in a
        background job; poll `GET .../lists/upload-progress/{jobId}` with the
        returned `job_id`.

        - List in `draft`, `pending` or `failed` status (`action: upload`): the
          file is loaded into the current list.
        - List in `ready` or `used` status (`action: update`): the existing
          destinations are kept as a previous version (see
          `GET .../lists/{list}/versions`) and deleted, the counters are reset,
          `version_number` is incremented and the file is loaded into the same
          list.
        - Any other status (`processing`, `in_use`, `archived`): 422.

        The list moves to `processing` and ends in `ready` or `failed`. Phone
        numbers are validated with libphonenumber (default region US) and stored
        in E.164. Files with more than 100,000 data rows are split: the first
        100,000 rows stay in this list and each further block of up to 100,000
        rows goes into a new list named `<name> (Part N)`.

        Columns are chosen with `mapping`; send the fields as multipart form
        fields. Roles: Owner and PBX Admin.
      operationId: uploadDistributionListCsv
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or TXT file to upload (max 50 MB)
                has_header:
                  type:
                    - boolean
                    - 'null'
                  default: true
                  description: Whether the first row is a header row. Without a header the
                    columns are addressed as `column_1`, `column_2`, ...
                mapping:
                  type: object
                  description: >-
                    Column mapping, sent as form fields `mapping[phone]`, `mapping[name]`,
                    `mapping[batch_identifier]` and `mapping[metadata][]`.
                  properties:
                    phone:
                      type: string
                      description: CSV column holding the phone number
                    name:
                      type:
                        - string
                        - 'null'
                      description: CSV column holding the contact name
                    batch_identifier:
                      type:
                        - string
                        - 'null'
                      description: CSV column holding the batch identifier
                    metadata:
                      type:
                        - array
                        - 'null'
                      description: CSV columns stored as metadata on each destination
                      items:
                        type: string
                  required:
                    - phone
              required:
                - file
                - mapping
      responses:
        '200':
          description: File uploaded and processing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "File uploaded successfully. Processing started."
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        format: uuid
                        description: Job ID for tracking progress
                        example: "9b2f6c1e-3d4a-4f6b-8c2d-1e5a7b9c0d3f"
                      total_rows:
                        type: integer
                        description: Data rows in the file (the first row is always skipped when counting)
                        example: 1000
                      is_large_file:
                        type: boolean
                        description: The file has more than 100,000 data rows and is split across several lists
                        example: false
                      action:
                        type: string
                        enum: [upload, update]
                        description: Action performed
                        example: "upload"
                      list_id:
                        type: integer
                        description: List ID
                        example: 1
                      version_number:
                        type: integer
                        description: New version number (`update` only)
                        example: 2
                      new_version_number:
                        type: integer
                        description: Same as `version_number` (`update` only)
                        example: 2
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          description: >-
            Request validation failed (Laravel validation error body), or the list
            status does not allow an upload (`{"error": "..."}`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../../components/schemas/ValidationError.yaml'
                  - $ref: '../../components/schemas/Error.yaml'
              example:
                error: "Cannot upload to list in status: In Use"
        '500':
          description: Processing could not be started
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: "Failed to process upload: ..."

  /v1/auto-dialer-campaigns/lists/{list}/preview-csv:
    parameters:
      - name: list
        in: path
        required: true
        description: Distribution List ID
        schema:
          type: integer
          minimum: 1
        example: 1

    post:
      tags:
        - Distribution Lists
      summary: Preview a CSV before uploading
      description: |
        Parse the first 5 data rows of a CSV file without persisting anything,
        so the UI can show a preview before committing to
        `POST .../{list}/upload`. The file is written to a temp path for
        parsing and deleted immediately afterward — nothing is stored.
        Blank rows are skipped. Works for a list in any status.

        Roles: Owner, PBX Admin and Reporter.
      operationId: previewDistributionListCsv
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or TXT file to preview (max 50MB)
                has_header:
                  type: boolean
                  default: true
                  description: Whether the first row is a header row.
              required:
                - file
      responses:
        '200':
          description: Parsed preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      headers:
                        type: array
                        items:
                          type: string
                        description: Column headers. When has_header is false they are generated as `column_1`, `column_2`, ...
                        example: ['phone_number', 'name', 'batch_identifier']
                      rows:
                        type: array
                        description: Up to 5 parsed data rows, keyed by header name (or `column_N` when has_header is false).
                        items:
                          type: object
                          additionalProperties:
                            type: string
                      total_rows:
                        type: integer
                        description: Non-blank data rows in the file (excluding the header row).
                        example: 1000
                      has_header:
                        type: boolean
                        example: true
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/auto-dialer-campaigns/lists/upload-progress/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Upload job ID
        schema:
          type: string
        example: "9b2f6c1e-3d4a-4f6b-8c2d-1e5a7b9c0d3f"

    get:
      tags:
        - Distribution Lists
      summary: Get upload progress
      description: |
        Get the progress of a CSV upload job, as stored in the cache by the
        upload job. Progress entries expire 2 hours after the last update
        (4 hours for split files). Row counts and errors are not part of this
        response: read the list (`statistics`, `status`) and
        `GET .../{list}/validation-errors` once the job finishes.

        Roles: Owner, PBX Admin and Reporter.
      operationId: getUploadProgress
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: distribution-lists:read
      responses:
        '200':
          description: Upload progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      percentage:
                        type: integer
                        minimum: 0
                        maximum: 100
                        example: 40
                      status:
                        type: string
                        description: >-
                          Job stage. `queued` right after the upload; then `started`, `validating`,
                          `processing`, `creating_destinations`, `finalizing`; split files report
                          `splitting` and `processing_chunk`. Final values: `completed`, `failed`,
                          `validation_failed` and `error` (a failed attempt that is retried).
                        enum: [queued, started, validating, processing, creating_destinations, finalizing, splitting, processing_chunk, completed, failed, validation_failed, error]
                        example: "creating_destinations"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-10-14T09:30:00+00:00"
                      current_chunk:
                        type: integer
                        description: Chunk being processed (split files only)
                      total_chunks:
                        type: integer
                        description: Number of chunks (split files only)
                    required:
                      - percentage
                      - status
                      - updated_at
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          description: Job not found or expired
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/Error.yaml'
              example:
                error: "Job not found or expired"
