paths:
  /v1/auto-dialer-campaigns/lists/{list}/destinations:
    parameters:
    - name: list
      in: path
      required: true
      description: Distribution List ID
      schema:
        type: integer
        minimum: 1
      example: 1
    get:
      tags:
      - Distribution Lists
      summary: List destinations
      description: 'Get a paginated list of destinations in a distribution list, newest first

        (by `created_at`).


        Roles: Owner, PBX Admin and Reporter.

        '
      operationId: listListDestinations
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: distribution-lists:read
      parameters:
      - $ref: ../../components/parameters/query/Page.yaml
      - name: per_page
        in: query
        required: false
        description: Items per page (values outside 1-100 are clamped)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - dialing
          - connected
          - failed
          - completed
          - invalid
        description: Filter by destination status
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Substring match on the phone number
      responses:
        '200':
          description: List of destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../components/schemas/ListDestination.yaml
                  meta:
                    $ref: ../../components/schemas/PaginationMeta.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
    post:
      tags:
      - Distribution Lists
      summary: Add single destination
      description: 'Add a single destination to a distribution list.


        The list must be in ''draft'', ''pending'' or ''failed'' status (otherwise 403).

        The number is validated with libphonenumber (default region US) and stored in

        E.164; a number already in the list is rejected. Adding to a ''draft'' list

        moves it to ''ready''.


        Roles: Owner and PBX Admin.

        '
      operationId: addListDestination
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                  description: Phone number. E.164 is recommended; numbers without a country
                    code are parsed as US numbers.
                  example: '+14155551212'
                name:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                  description: Optional contact name
                  example: John Doe - Sales Lead
              required:
              - phone_number
      responses:
        '201':
          description: Destination added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Destination added successfully
                  data:
                    $ref: ../../components/schemas/ListDestination.yaml
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          description: >-
            Request validation failed, or the number is invalid or already in the list
            (`{"error": "..."}`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: ../../components/schemas/ValidationError.yaml
                - $ref: ../../components/schemas/Error.yaml
              example:
                error: Phone number already exists in this list
  /v1/auto-dialer-campaigns/lists/{list}/destinations/batch:
    parameters:
    - name: list
      in: path
      required: true
      description: Distribution List ID
      schema:
        type: integer
        minimum: 1
      example: 1
    post:
      tags:
      - Distribution Lists
      summary: Add destinations batch
      description: 'Add multiple destinations to a distribution list in batch.


        Maximum 1000 destinations per request, and the list may not grow beyond

        100,000 destinations. The list must be in ''draft'', ''pending'' or ''failed''

        status (otherwise 403). Each number is validated like the single add; invalid

        numbers and duplicates within the batch are reported in `errors`, numbers

        already in the list are skipped. When at least one entry is valid the list

        moves to ''ready''.


        Roles: Owner and PBX Admin.

        '
      operationId: addListDestinationsBatch
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destinations:
                  type: array
                  maxItems: 1000
                  description: Array of destinations to add
                  items:
                    type: object
                    properties:
                      phone_number:
                        type: string
                        description: Phone number (E.164 recommended; numbers without a country code are parsed as US numbers)
                        example: '+14155551212'
                      name:
                        type:
                        - string
                        - 'null'
                        maxLength: 255
                        description: Optional contact name
                        example: John Doe - Sales Lead
                    required:
                    - phone_number
              required:
              - destinations
      responses:
        '200':
          description: Batch processing completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Batch processing completed
                  data:
                    type: object
                    properties:
                      added:
                        type: integer
                        description: Number of destinations inserted
                        example: 97
                      errors:
                        description: >-
                          Rejected entries keyed by their zero-based index in `destinations`
                          (value: the reason). An empty JSON array `[]` when nothing was rejected.
                        oneOf:
                        - type: object
                          additionalProperties:
                            type: string
                        - type: array
                          maxItems: 0
                        example:
                          '5': Invalid phone number format
                          '8': Duplicate phone number in batch
                      duplicates_skipped:
                        type: integer
                        description: Valid numbers skipped because they are already in the list
                        example: 1
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          description: >-
            Request validation failed, or the batch would exceed the 100,000-destination
            list limit (`{"error": "..."}`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: ../../components/schemas/ValidationError.yaml
                - $ref: ../../components/schemas/Error.yaml
              example:
                error: Batch would exceed maximum list size of 100000
  /v1/auto-dialer-campaigns/lists/{list}/destinations/bulk-reset-dial-attempts:
    parameters:
    - name: list
      in: path
      required: true
      description: Distribution List ID
      schema:
        type: integer
        minimum: 1
      example: 1
    post:
      tags:
      - Distribution Lists
      summary: Bulk reset dial attempts
      description: 'Reset dial attempts for multiple destinations in a list.


        Accepts an array of destination IDs; all IDs must belong to the list (otherwise

        422). Each destination is set to pending with zero dial attempts, and

        `last_disposition`, `last_dialed_at` and the next retry time are cleared.

        Allowed in any list status, including assigned lists.


        Roles: Owner and PBX Admin.

        '
      operationId: bulkResetListDestinationDialAttempts
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_ids:
                  type: array
                  description: Destination IDs to reset
                  items:
                    type: integer
              required:
              - destination_ids
      responses:
        '200':
          description: Dial attempts reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Dial attempts reset for 10 destinations
                  data:
                    type: object
                    properties:
                      updated_count:
                        type: integer
                        example: 10
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
        '422':
          description: >-
            Request validation failed, or one or more IDs are not in this list
            (`{"error": "One or more destinations not found in this list"}`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: ../../components/schemas/ValidationError.yaml
                - $ref: ../../components/schemas/Error.yaml
              example:
                error: One or more destinations not found in this list
  /v1/auto-dialer-campaigns/lists/{list}/destinations/{destinationId}/reset-dial-attempts:
    parameters:
    - name: list
      in: path
      required: true
      description: Distribution List ID
      schema:
        type: integer
        minimum: 1
      example: 1
    - name: destinationId
      in: path
      required: true
      description: Destination ID
      schema:
        type: integer
        minimum: 1
      example: 42
    post:
      tags:
      - Distribution Lists
      summary: Reset destination dial attempts
      description: 'Reset dial attempts for a single destination in a list: the destination

        is set to pending with zero dial attempts, and `last_disposition`, `last_dialed_at`

        and the next retry time are cleared. Allowed in any list status, including

        assigned lists. A destination that is not in this list returns 404

        (`{"error": "Destination not found in this list"}`).


        Roles: Owner and PBX Admin.

        '
      operationId: resetListDestinationDialAttempts
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      x-api-key-scope: distribution-lists:write
      responses:
        '200':
          description: Dial attempts reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Dial attempts reset successfully
                  data:
                    type: object
                    properties:
                      destination_id:
                        type: integer
                        example: 42
                      phone_number:
                        type: string
                        example: '+14155551212'
        '401':
          $ref: ../../components/responses/Unauthorized.yaml
        '403':
          $ref: ../../components/responses/Forbidden.yaml
        '404':
          $ref: ../../components/responses/NotFound.yaml
