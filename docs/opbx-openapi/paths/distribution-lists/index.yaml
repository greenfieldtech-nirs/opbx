paths:
  /v1/auto-dialer-campaigns/lists:
    get:
      tags:
        - Distribution Lists
      summary: List distribution lists
      description: |
        Get a paginated list of distribution lists.
        
        Returns only the latest versions of each list.
        Supports filtering by status and campaign assignment.
      operationId: listDistributionLists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, processing, ready, in_use, used, failed, archived]
          description: Filter by list status
        - name: campaign_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by assigned campaign ID
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by list name
      responses:
        '200':
          description: List of distribution lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/DistributionList.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

    post:
      tags:
        - Distribution Lists
      summary: Create distribution list
      description: |
        Create a new empty distribution list.
        
        The list is created in 'draft' status and can be populated
        via upload or by adding destinations individually.
      operationId: createDistributionList
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: List name
                  example: "Sales Leads Q1"
                description:
                  type: string
                  nullable: true
                  maxLength: 1000
                  description: List description
                  example: "Qualified sales leads for Q1 2024"
              required:
                - name
      responses:
        '201':
          description: List created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "List created successfully"
                  data:
                    $ref: '../../components/schemas/DistributionList.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/auto-dialer-campaigns/lists/example-csv:
    get:
      tags:
        - Distribution Lists
      summary: Download example CSV
      description: |
        Download an example CSV file showing the expected format
        for distribution list uploads.
      operationId: downloadExampleCsv
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Example CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                phone_number,description
                +14155551212,John Doe - Sales Lead
                +14155551213,Jane Smith - Support Case
                +14155551214,Bob Johnson - Follow-up Call
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

  /v1/auto-dialer-campaigns/lists/{list}:
    parameters:
      - name: list
        in: path
        required: true
        description: Distribution List ID
        schema:
          type: integer
          minimum: 1
        example: 1

    get:
      tags:
        - Distribution Lists
      summary: Get distribution list
      description: Get a specific distribution list by ID with full details
      operationId: getDistributionList
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Distribution list details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/DistributionList.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    delete:
      tags:
        - Distribution Lists
      summary: Delete distribution list
      description: |
        Delete a distribution list.
        
        Only lists in 'failed' status can be deleted by non-owners.
        Owners can delete any list.
      operationId: deleteDistributionList
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "List deleted successfully"
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
