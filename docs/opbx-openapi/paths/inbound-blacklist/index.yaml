paths:
  /v1/inbound-blacklist:
    get:
      tags:
        - Inbound Blacklist
      summary: List Inbound Blacklist Entrys
      operationId: listInboundBlacklistEntrys
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:read
      description: Paginated list, newest first. `meta` has current_page, last_page, per_page and total.
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: search
          in: query
          schema:
            type: string
        - name: rejection_strategy
          in: query
          schema:
            type: string
            enum: [drop, reject, torment]
        - name: match_type
          in: query
          schema:
            type: string
            enum: [exact, prefix, wildcard]
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, did_specific]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of Inbound Blacklist Entrys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/InboundBlacklist.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Inbound Blacklist
      summary: Create Inbound Blacklist Entry
      operationId: createInboundBlacklistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caller_id_pattern:
                  type: string
                  maxLength: 50
                  pattern: ^[\d\+\*\?]+$
                  description: Digits, `+`, and the wildcards `*` and `?`
                match_type:
                  type: string
                  enum: [exact, prefix, wildcard]
                rejection_strategy:
                  type: string
                  enum: [drop, reject, torment]
                is_global:
                  type: boolean
                did_number_ids:
                  type:
                    - array
                    - 'null'
                  description: Required when is_global is false
                  items:
                    type: integer
              required: [caller_id_pattern, match_type, rejection_strategy]
      responses:
        '201':
          description: Blacklist entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/inbound-blacklist/{inbound_blacklist}:
    parameters:
      - name: inbound_blacklist
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Inbound Blacklist
      summary: Get Inbound Blacklist Entry
      operationId: getInboundBlacklistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:read
      responses:
        '200':
          description: Blacklist entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Inbound Blacklist
      summary: Update Inbound Blacklist Entry
      operationId: updateInboundBlacklistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caller_id_pattern:
                  type: string
                  maxLength: 50
                  pattern: ^[\d\+\*\?]+$
                  description: Digits, `+`, and the wildcards `*` and `?`
                match_type:
                  type: string
                  enum: [exact, prefix, wildcard]
                rejection_strategy:
                  type: string
                  enum: [drop, reject, torment]
                is_global:
                  type: boolean
                did_number_ids:
                  type:
                    - array
                    - 'null'
                  description: Required when is_global is false
                  items:
                    type: integer
      responses:
        '200':
          description: Blacklist entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
    patch:
      tags:
        - Inbound Blacklist
      summary: Partially update Inbound Blacklist Entry
      operationId: patchInboundBlacklistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caller_id_pattern:
                  type: string
                  maxLength: 50
                  pattern: ^[\d\+\*\?]+$
                  description: Digits, `+`, and the wildcards `*` and `?`
                match_type:
                  type: string
                  enum: [exact, prefix, wildcard]
                rejection_strategy:
                  type: string
                  enum: [drop, reject, torment]
                is_global:
                  type: boolean
                did_number_ids:
                  type:
                    - array
                    - 'null'
                  description: Required when is_global is false
                  items:
                    type: integer
      responses:
        '200':
          description: Blacklist entry updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Inbound Blacklist
      summary: Delete Inbound Blacklist Entry
      operationId: deleteInboundBlacklistEntry
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      responses:
        '200':
          description: Blacklist entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
