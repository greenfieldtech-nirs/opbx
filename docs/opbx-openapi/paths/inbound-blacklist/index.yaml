paths:
  /v1/inbound-blacklist:
    get:
      tags:
        - Inbound Blacklist
      summary: List inbound blacklist entries
      operationId: listInboundBlacklistEntrys
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:read
      description: |
        Paginated list, newest first. `meta` has current_page, last_page, per_page and total.
        Every authenticated user of the organization can list entries. Filters are applied
        only when the parameter is present; values are not validated.
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
        - name: search
          in: query
          description: Substring match on `caller_id_pattern`
          schema:
            type: string
        - name: rejection_strategy
          in: query
          schema:
            type: string
            enum: [drop, reject, torment]
        - name: match_type
          in: query
          schema:
            type: string
            enum: [exact, prefix, wildcard]
        - name: scope
          in: query
          description: '`global` = `is_global` true, `did_specific` = `is_global` false; other values are ignored'
          schema:
            type: string
            enum: [global, did_specific]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of inbound blacklist entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/InboundBlacklist.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'

    post:
      tags:
        - Inbound Blacklist
      summary: Create Inbound Blacklist Entry
      operationId: createInboundBlacklistEntry
      description: |
        Owner and PBX Admin only. New entries are `active`. The 201 body is the created model
        before a reload, so columns left at their database default (for example `blocked_count`,
        and `torment_music_timeout` for non-torment entries) are absent from it.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caller_id_pattern:
                  type: string
                  maxLength: 50
                  pattern: ^[\d\+\*\?]+$
                  description: Digits, `+`, and the wildcards `*` and `?`
                match_type:
                  type: string
                  enum: [exact, prefix, wildcard]
                rejection_strategy:
                  type: string
                  enum: [drop, reject, torment]
                  description: |
                    Sending `torment` (re)generates `torment_room_prefix` (16 random characters)
                    and sets `torment_music_timeout` to 600 seconds.
                is_global:
                  type: boolean
                  description: |
                    Apply the entry to every DID of the organization. Forced to `false` when a
                    non-empty `did_number_ids` is sent. Defaults to `false` when omitted.
                did_number_ids:
                  type:
                    - array
                    - 'null'
                  description: |
                    DIDs the entry applies to. Required when `is_global` is sent as `false`.
                    Each ID must be a DID of the organization. On update, sending the field
                    replaces the attached DIDs; omitting it (or sending null) leaves them unchanged.
                  items:
                    type: integer
              required: [caller_id_pattern, match_type, rejection_strategy]
      responses:
        '201':
          description: Blacklist entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/inbound-blacklist/{inbound_blacklist}:
