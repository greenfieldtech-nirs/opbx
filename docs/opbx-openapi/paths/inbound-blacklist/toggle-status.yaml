paths:
  /v1/inbound-blacklist/{inboundBlacklist}/toggle-status:
    patch:
      tags:
        - Inbound Blacklist
      summary: Toggle blacklist entry status
      operationId: toggleBlacklistStatus
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: inboundBlacklist
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status toggled
