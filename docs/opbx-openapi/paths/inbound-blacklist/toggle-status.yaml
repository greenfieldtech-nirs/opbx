paths:
  /v1/inbound-blacklist/{inboundBlacklist}/toggle-status:
    patch:
      tags:
        - Inbound Blacklist
      summary: Toggle blacklist entry status
      operationId: toggleBlacklistStatus
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-scope: inbound-blacklist:write
      parameters:
        - name: inboundBlacklist
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status flipped between active and inactive (no request body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '../../components/schemas/InboundBlacklist.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '403':
          $ref: '../../components/responses/Forbidden.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
