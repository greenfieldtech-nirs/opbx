paths:
  /v1/call-tracking-dni/swap:
    get:
      tags:
      - Call Tracking DNI
      summary: Dynamic number insertion swap
      description: |
        Public endpoint used by client websites for dynamic number insertion
        (DNI). No authentication.

        Matching: when both `utm_source` and `utm_medium` are given, the first
        active campaign of the organization whose source and medium equal them
        (case-insensitive) is selected; when `utm_campaign` is also given, the
        campaign name must contain it. The first active tracking number of that
        campaign is returned. If no campaign matches, or the matched campaign
        has no active tracking number, the first active tracking number of the
        organization (any campaign) is returned. `default_number` is returned
        only when the organization has no active tracking number at all.

        `campaign_id`, `campaign_name`, `source` and `medium` describe the
        matched campaign and are null when no campaign matched.

        Rate limit: 60 requests per minute per `organization_id` and client IP.
      operationId: callTrackingDniSwap
      security: []
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
        description: Organization ID (must exist, else 422)
        example: 1
      - name: utm_source
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Marketing source
        example: google
      - name: utm_medium
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Marketing medium
        example: cpc
      - name: utm_campaign
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: Marketing campaign name
        example: spring-sale
      - name: default_number
        in: query
        required: false
        schema:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        description: Default number to return if no match is found (E.164 format)
        example: '+14155551212'
      responses:
        '200':
          description: Swap result
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking_number:
                    type:
                    - string
                    - 'null'
                    description: Phone number to display (a tracking number, else `default_number`, else null)
                    example: '+12127773456'
                  campaign_id:
                    type:
                    - integer
                    - 'null'
                    description: Matched campaign, or null when the default was returned
                  campaign_name:
                    type:
                    - string
                    - 'null'
                  source:
                    type:
                    - string
                    - 'null'
                  medium:
                    type:
                    - string
                    - 'null'
        '422':
          $ref: ../../components/responses/ValidationError.yaml
        '429':
          $ref: ../../components/responses/TooManyRequests.yaml
        '500':
          $ref: ../../components/responses/ServerError.yaml
