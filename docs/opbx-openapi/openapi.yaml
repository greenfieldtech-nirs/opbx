openapi: 3.0.3
info:
  title: OPBX REST API
  description: |
    OPBX is an open-source business PBX platform built on Laravel and React.
    This API provides complete management of PBX resources including extensions,
    phone numbers, ring groups, IVR menus, AI assistants, call routing, and more.

    ## Authentication
    All API endpoints require Bearer token authentication via Laravel Sanctum.
    Include the token in the Authorization header:
    ```
    Authorization: Bearer {your-sanctum-token}
    ```

    ## Rate Limiting
    API requests are rate-limited. The default limit is 60 requests per minute
    for authenticated users. Check the `X-RateLimit-*` headers in responses.

    ## Pagination
    List endpoints return paginated results with the following structure:
    - `data`: Array of resources
    - `meta`: Pagination metadata (current_page, last_page, per_page, total)
    - `links`: Navigation links (first, last, prev, next)

    ## Multi-Tenancy
    All resources are scoped to the authenticated user's organization.
    The API automatically applies organization filtering based on the authenticated user.

    ## Error Handling
    Errors follow a consistent format:
    ```json
    {
      "message": "Error description",
      "errors": {
        "field_name": ["Error message for this field"]
      }
    }
    ```
  version: 1.0.0
  contact:
    name: OPBX Support
    url: https://developers.cloudonix.com/opbx
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://opbx.cloudonix.cloud/api
    description: OPBX Production Server

security:
  - bearerAuth: []

paths:
  # ==========================================
  # Public Endpoints
  # ==========================================
  /health:
    get:
      tags:
        - Public
      summary: Health Check
      description: Returns the current health status of the API
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"

  /storage/recordings/{path}:
    get:
      tags:
        - Public
      summary: Serve Recording File
      description: Serves audio recording files with HMAC signature verification
      operationId: serveRecording
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: Path to the recording file
          schema:
            type: string
        - name: signature
          in: query
          required: true
          description: HMAC signature for file access
          schema:
            type: string
        - name: expires
          in: query
          required: true
          description: Expiration timestamp for the signed URL
          schema:
            type: integer
      responses:
        '200':
          description: Audio file content
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        '403':
          description: Invalid or expired signature
        '404':
          description: File not found

  # ==========================================
  # Authentication
  # ==========================================
  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticate a user and return access token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                    example: "1|laravel_sanctum_token_xxx"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/register:
    post:
      tags:
        - Authentication
      summary: User Registration
      description: Register a new user and create their organization
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organization_name
                - name
                - email
                - password
              properties:
                organization_name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: "Acme Corporation"
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@acme.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "SecurePass123!"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  organization:
                    $ref: '#/components/schemas/Organization'
                  access_token:
                    type: string
                    example: "1|laravel_sanctum_token_xxx"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/auth/register/validate:
    get:
      tags:
        - Authentication
      summary: Validate Registration Data
      description: Check if email and organization name are available
      operationId: validateRegistration
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: organization_name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_available:
                    type: boolean
                  organization_name_available:
                    type: boolean

  /v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: User Logout
      description: Revoke the current access token
      operationId: logout
      responses:
        '204':
          description: Logout successful
        '401':
          description: Unauthorized

  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Token
      description: Refresh the current access token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string

  /v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User
      description: Get information about the currently authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  # ==========================================
  # Profile
  # ==========================================
  /v1/profile:
    get:
      tags:
        - Profile
      summary: Get Profile
      description: Get the current user's profile
      operationId: getProfile
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

    put:
      tags:
        - Profile
      summary: Update Profile
      description: Update the current user's profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 50
                street_address:
                  type: string
                  maxLength: 255
                city:
                  type: string
                  maxLength: 100
                state_province:
                  type: string
                  maxLength: 100
                postal_code:
                  type: string
                  maxLength: 20
                country:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'

  /v1/profile/password:
    put:
      tags:
        - Profile
      summary: Update Password
      description: Change the current user's password
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password updated successfully"
        '422':
          description: Validation error

  /v1/profile/organization:
    put:
      tags:
        - Profile
      summary: Update Organization
      description: Update organization settings (owner only)
      operationId: updateOrganizationProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                timezone:
                  type: string
                  example: "America/New_York"
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden - requires owner role

  # ==========================================
  # Users
  # ==========================================
  /v1/users:
    get:
      tags:
        - Users
      summary: List Users
      description: Get paginated list of users in the organization
      operationId: listUsers
      parameters:
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role
          schema:
            type: string
            enum: [owner, pbx_admin, pbx_user, reporter]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            default: 15
            maximum: 100
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserResponse'

    post:
      tags:
        - Users
      summary: Create User
      description: Create a new user in the organization
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                role:
                  type: string
                  enum: [owner, pbx_admin, pbx_user, reporter]
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
                phone:
                  type: string
                  maxLength: 50
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          description: Validation error

  /v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer

    get:
      tags:
        - Users
      summary: Get User
      description: Get a specific user by ID
      operationId: getUser
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update User
      description: Update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [owner, pbx_admin, pbx_user, reporter]
                status:
                  type: string
                  enum: [active, inactive]
                phone:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete User
      description: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted
        '403':
          description: Cannot delete owner or self
        '404':
          description: User not found

  /v1/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer

    patch:
      tags:
        - Users
      summary: Update User Password
      description: Change a user's password (admin only)
      operationId: updateUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password updated
        '404':
          description: User not found

  # ==========================================
  # Extensions
  # ==========================================
  /v1/extensions:
    get:
      tags:
        - Extensions
      summary: List Extensions
      description: Get paginated list of extensions
      operationId: listExtensions
      parameters:
        - name: search
          in: query
          description: Search by extension number or name
          schema:
            type: string
        - name: type
          in: query
          description: Filter by type
          schema:
            type: string
            enum: [user, conference, ring_group, ivr, ai_assistant, forward, ai_load_balancer, custom_logic]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive]
        - name: user_id
          in: query
          description: Filter by assigned user
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of extensions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExtensionResponse'

    post:
      tags:
        - Extensions
      summary: Create Extension
      description: Create a new extension
      operationId: createExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionCreateRequest'
      responses:
        '201':
          description: Extension created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Extension'
        '422':
          description: Validation error

  /v1/extensions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Extension ID
        schema:
          type: integer

    get:
      tags:
        - Extensions
      summary: Get Extension
      description: Get a specific extension
      operationId: getExtension
      responses:
        '200':
          description: Extension retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Extension'
        '404':
          description: Extension not found

    put:
      tags:
        - Extensions
      summary: Update Extension
      description: "Update an extension (note: extension_number is immutable)"
      operationId: updateExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionUpdateRequest'
      responses:
        '200':
          description: Extension updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Extension'
        '404':
          description: Extension not found

    delete:
      tags:
        - Extensions
      summary: Delete Extension
      description: Delete an extension
      operationId: deleteExtension
      responses:
        '204':
          description: Extension deleted
        '404':
          description: Extension not found

  /v1/extensions/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        description: Extension ID
        schema:
          type: integer

    get:
      tags:
        - Extensions
      summary: Get SIP Password
      description: Get the SIP password for a user extension
      operationId: getExtensionPassword
      responses:
        '200':
          description: SIP password retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  password:
                    type: string
        '404':
          description: Extension not found

  /v1/extensions/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        description: Extension ID
        schema:
          type: integer

    put:
      tags:
        - Extensions
      summary: Reset SIP Password
      description: Reset the SIP password for a user extension
      operationId: resetExtensionPassword
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  password:
                    type: string
        '404':
          description: Extension not found

  /v1/extensions/sync/compare:
    get:
      tags:
        - Extensions
      summary: Compare Extensions Sync
      description: Compare local extensions with Cloudonix
      operationId: compareExtensionsSync
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                properties:
                  local_only:
                    type: array
                    items:
                      type: object
                  cloudonix_only:
                    type: array
                    items:
                      type: object
                  mismatched:
                    type: array
                    items:
                      type: object

  /v1/extensions/sync:
    post:
      tags:
        - Extensions
      summary: Sync Extensions
      description: Bidirectional sync with Cloudonix
      operationId: syncExtensions
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  deleted:
                    type: integer

  # ==========================================
  # Phone Numbers / DIDs
  # ==========================================
  /v1/phone-numbers:
    get:
      tags:
        - Phone Numbers
      summary: List Phone Numbers
      description: Get paginated list of phone numbers (DIDs)
      operationId: listPhoneNumbers
      parameters:
        - name: search
          in: query
          description: Search by phone number or friendly name
          schema:
            type: string
        - name: routing_type
          in: query
          description: Filter by routing type
          schema:
            type: string
            enum: [extension, ring_group, business_hours, conference_room, ai_assistant, ivr_menu, ai_load_balancer]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of phone numbers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPhoneNumberResponse'

    post:
      tags:
        - Phone Numbers
      summary: Create Phone Number
      description: Create a new phone number (DID)
      operationId: createPhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberCreateRequest'
      responses:
        '201':
          description: Phone number created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumber'
        '422':
          description: Validation error

  /v1/phone-numbers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Phone Number ID
        schema:
          type: integer

    get:
      tags:
        - Phone Numbers
      summary: Get Phone Number
      description: Get a specific phone number
      operationId: getPhoneNumber
      responses:
        '200':
          description: Phone number retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumber'
        '404':
          description: Phone number not found

    put:
      tags:
        - Phone Numbers
      summary: Update Phone Number
      description: "Update a phone number (note: phone_number is immutable)"
      operationId: updatePhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberUpdateRequest'
      responses:
        '200':
          description: Phone number updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PhoneNumber'
        '404':
          description: Phone number not found

    delete:
      tags:
        - Phone Numbers
      summary: Delete Phone Number
      description: Delete a phone number
      operationId: deletePhoneNumber
      responses:
        '204':
          description: Phone number deleted
        '404':
          description: Phone number not found

  # ==========================================
  # Ring Groups
  # ==========================================
  /v1/ring-groups:
    get:
      tags:
        - Ring Groups
      summary: List Ring Groups
      description: Get paginated list of ring groups
      operationId: listRingGroups
      parameters:
        - name: search
          in: query
          description: Search by name
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of ring groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRingGroupResponse'

    post:
      tags:
        - Ring Groups
      summary: Create Ring Group
      description: Create a new ring group
      operationId: createRingGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RingGroupCreateRequest'
      responses:
        '201':
          description: Ring group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RingGroup'
        '422':
          description: Validation error

  /v1/ring-groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Ring Group ID
        schema:
          type: integer

    get:
      tags:
        - Ring Groups
      summary: Get Ring Group
      description: Get a specific ring group
      operationId: getRingGroup
      responses:
        '200':
          description: Ring group retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RingGroup'
        '404':
          description: Ring group not found

    put:
      tags:
        - Ring Groups
      summary: Update Ring Group
      description: Update a ring group
      operationId: updateRingGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RingGroupUpdateRequest'
      responses:
        '200':
          description: Ring group updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RingGroup'
        '404':
          description: Ring group not found

    delete:
      tags:
        - Ring Groups
      summary: Delete Ring Group
      description: Delete a ring group
      operationId: deleteRingGroup
      responses:
        '204':
          description: Ring group deleted
        '404':
          description: Ring group not found

  # ==========================================
  # IVR Menus
  # ==========================================
  /v1/ivr-menus/voices:
    get:
      tags:
        - IVR Menus
      summary: List TTS Voices
      description: Get available TTS voices from Cloudonix
      operationId: listTtsVoices
      responses:
        '200':
          description: List of TTS voices
