          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        strategy:
          type: string
          enum: [simultaneous, round_robin, sequential]
        timeout:
          type: integer
          minimum: 5
          maximum: 300
          description: Ring timeout in seconds
        ring_turns:
          type: integer
          minimum: 1
          maximum: 10
        fallback_action:
          type: string
          enum: [extension, ring_group, ivr_menu, ai_assistant, ai_load_balancer, hangup]
        fallback_extension_id:
          type: integer
        fallback_ring_group_id:
          type: integer
        fallback_ivr_menu_id:
          type: integer
        fallback_ai_assistant_id:
          type: integer
        fallback_ai_load_balancer_id:
          type: integer
        members:
          type: array
          items:
            type: object
            required:
              - extension_id
            properties:
              extension_id:
