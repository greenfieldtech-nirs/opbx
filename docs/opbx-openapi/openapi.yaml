    parameters:
      - name: id
        in: path
        required: true
        description: Recording ID
        schema:
          type: integer

    get:
      tags:
        - Recordings
      summary: Get Recording
      description: Get a specific recording
      operationId: getRecording
      responses:
        '200':
          description: Recording retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Recording'
        '404':
          description: Recording not found

    delete:
      tags:
        - Recordings
      summary: Delete Recording
      description: Delete a recording
      operationId: deleteRecording
      responses:
        '204':
          description: Recording deleted
        '404':
          description: Recording not found

  /v1/recordings/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        description: Recording ID
        schema:
          type: integer

    get:
      tags:
        - Recordings
      summary: Get Recording Download URL
      description: Get a secure download URL for a recording
      operationId: getRecordingDownloadUrl
      responses:
        '200':
          description: Download URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '404':
          description: Recording not found

  /v1/recordings/download:
    get:
      tags:
        - Recordings
      summary: Download Recording
      description: Download a recording using a secure token
      operationId: downloadRecording
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Secure download token
          schema:
            type: string
      responses:
        '200':
          description: Audio file content
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        '403':
          description: Invalid or expired token
        '404':
          description: Recording not found

