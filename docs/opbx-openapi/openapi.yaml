        options_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IvrMenuCreateRequest:
      type: object
      required:
        - name
        - max_timeout
        - inter_digit_timeout
        - max_turns
        - failover_destination_type
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        audio_file_path:
          type: string
        tts_text:
          type: string
        tts_voice:
          type: string
        max_timeout:
          type: integer
          minimum: 1
          maximum: 30
        inter_digit_timeout:
          type: integer
          minimum: 1
          maximum: 30
        max_turns:
          type: integer
          minimum: 1
          maximum: 9
        failover_destination_type:
          type: string
          enum: [extension, ring_group, conference_room, ivr_menu, business_hours, ai_assistant, ai_load_balancer, hangup]
        failover_destination_id:
          type: integer
        options:
          type: array
          items:
            type: object
            required:
              - input_digits
              - destination_type
              - destination_id
            properties:
              input_digits:
                type: string
                pattern: '^[0-9#*]+$'
              description:
                type: string
              destination_type:
                type: string
                enum: [extension, ring_group, conference_room, ivr_menu, business_hours, ai_assistant, ai_load_balancer, hangup]
              destination_id:
