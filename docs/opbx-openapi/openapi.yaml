        organization_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        strategy:
          type: string
          enum: [simultaneous, round_robin, sequential]
        timeout:
          type: integer
          description: Ring timeout in seconds
        ring_turns:
          type: integer
          description: Number of ring cycles before fallback
        fallback_action:
          type: string
          enum: [extension, ring_group, ivr_menu, ai_assistant, ai_load_balancer, hangup]
        fallback_extension_id:
          type: integer
          nullable: true
        fallback_ring_group_id:
          type: integer
          nullable: true
        fallback_ivr_menu_id:
          type: integer
          nullable: true
        fallback_ai_assistant_id:
          type: integer
          nullable: true
        fallback_ai_load_balancer_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              extension_id:
                type: integer
              extension_number:
                type: string
              user_name:
                type: string
              priority:
                type: integer
        members_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

