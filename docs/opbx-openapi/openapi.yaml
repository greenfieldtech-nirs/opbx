      responses:
        '200':
          description: Settings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      domain_uuid:
                        type: string
                      domain_api_key:
                        type: string
                      webhook_base_url:
                        type: string
                      no_answer_timeout:
                        type: integer
                      recording_format:
                        type: string
        '403':
          description: Forbidden - requires owner role

    put:
      tags:
        - Settings
      summary: Update Cloudonix Settings
      description: Update Cloudonix integration settings (owner only)
      operationId: updateCloudonixSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain_uuid:
                  type: string
                domain_api_key:
                  type: string
                webhook_base_url:
                  type: string
                no_answer_timeout:
                  type: integer
                  minimum: 10
                  maximum: 300
                recording_format:
                  type: string
                  enum: [wav, mp3]
      responses:
        '200':
          description: Settings updated
        '403':
