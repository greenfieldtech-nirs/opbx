components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Laravel Sanctum personal access token returned by `POST /v1/auth/login` in token mode
        (also by `POST /v1/auth/refresh` and the Auth0 callback). Login revokes the user's
        previous tokens; a token expires after 24 hours.
    cookieAuth:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Cookie-based SPA authentication. The browser sends the httpOnly session cookie
        automatically (name from `SESSION_COOKIE`, by default the slug of `APP_NAME` plus
        `-session`); the `X-XSRF-TOKEN` header must contain the decoded value of the
        `XSRF-TOKEN` cookie for CSRF protection.
    webhookBearer:
      type: http
      scheme: bearer
      description: |
        Cloudonix webhooks (`VerifyCloudonixSignature`). The organization is identified by the
        payload's `domain` (or `owner.domain.name` / `owner.domain.uuid`); a missing domain
        answers 400 and an unknown domain 401. When the organization has a
        `domain_requests_api_key` (Cloudonix Settings), `Authorization: Bearer <key>` must
        match it, otherwise 401. When no key is configured the request is accepted (and
        logged) unless `CLOUDONIX_WEBHOOK_REQUIRE_AUTH=true`, which answers 401. There is no
        HMAC signature check.
    embedTokenAuth:
      type: http
      scheme: bearer
      description: |
        Per-user Embedded Dialer token (prefix `opbxd_`), issued via
        `POST /v1/users/{user}/embed-token/regenerate`. Used by the embedded
        widget's runtime API (`/v1/embed/*`). Requests carrying a browser
        `Origin` header are additionally checked against the organization's
        `embed_allowed_domains` allowlist.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: opbxk_ API key
      description: |
        Organization API key (prefix `opbxk_`), created by the Owner with
        `POST /v1/api-keys` and sent as `Authorization: Bearer opbxk_...`.
        Deny-by-default: a key reaches only operations whose resource it has
        been granted. Each such operation names the grant it needs in its
        `x-api-key-scope` extension (`<resource>:read` for GET,
        `<resource>:write` for other methods; a `write` grant also allows
        reads). Operations without `x-api-key-scope` answer API keys with 403.
    voiceWebhookAuth:
      type: http
      scheme: bearer
      description: |
        Voice routing and voice callbacks (`VerifyVoiceWebhookAuth`). `Authorization: Bearer <key>`
        must equal the `domain_requests_api_key` of the organization named by the JSON body's
        `Domain` (domain name or UUID). A missing or wrong token, an unknown domain or an
        organization without a key answers 401 with CXML (`<Say>` + `<Hangup/>`); a missing
        `Domain` or destination (`To`) answers 400.
    dialerWorkerAuth:
      type: http
      scheme: bearer
      description: Bearer token for dialer worker authentication (`DIALER_WORKER_API_TOKEN`, or `DIALER_WORKER_API_TOKEN_SECONDARY` during rotation)
    amdWorkerAuth:
      type: http
      scheme: bearer
      description: Bearer token for AMD worker authentication (AMD_WORKER_API_TOKEN). Used by `/voice/amd-action` and `/voice/amd-session`.
  
