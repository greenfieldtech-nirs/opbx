      responses:
        '200':
          description: Status updated
        '403':
          description: Forbidden
        '404':
          description: User not found

  /v1/platform/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer

    patch:
      tags:
        - Platform Management
      summary: Reset User Password
      description: Reset a user's password (platform manager only)
      operationId: resetPlatformUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset
        '403':
          description: Forbidden
        '404':
          description: User not found

  /v1/platform/audit-logs:
    get:
      tags:
        - Platform Management
      summary: List Audit Logs
      description: Get platform audit logs (platform manager only)
      operationId: listAuditLogs
      parameters:
        - name: user_id
          in: query
          description: Filter by user
          schema:
            type: integer
        - name: organization_id
          in: query
          description: Filter by organization
          schema:
            type: integer
        - name: action
          in: query
          description: Filter by action type
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
        '403':
          description: Forbidden - requires platform manager role

  # ==========================================
  # Config
  # ==========================================
  /v1/config/application:
    get:
      tags:
        - Config
      summary: Get Application Config
      description: Get public application configuration
      operationId: getApplicationConfig
      security: []
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_name:
                    type: string
                  app_version:
                    type: string
                  features:
                    type: object
                    properties:
                      ai_assistants:
                        type: boolean
                      auto_dialer:
                        type: boolean
                      conference_rooms:
                        type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum Token"
      description: |
        Bearer token authentication using Laravel Sanctum.
        Obtain a token by calling POST /v1/auth/login.

  schemas:
    # ==========================================
    # Common Schemas
    # ==========================================
    Error:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - "The email field is required."
              - "The email must be a valid email address."

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 73

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true

    # ==========================================
    # User & Organization Schemas
    # ==========================================
    User:
      type: object
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, pbx_admin, pbx_user, reporter]
        status:
          type: string
          enum: [active, inactive]
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        timezone:
          type: string
          example: "America/New_York"
        status:
          type: string
          enum: [active, suspended, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedUserResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    # ==========================================
    # Extension Schemas
    # ==========================================
    Extension:
      type: object
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        ai_assistant_id:
          type: integer
          nullable: true
        extension_number:
          type: string
          description: 3-5 digit extension number
          example: "101"
        name:
          type: string
        type:
          type: string
          enum: [user, conference, ring_group, ivr, ai_assistant, forward, ai_load_balancer, custom_logic]
        status:
          type: string
          enum: [active, inactive]
        voicemail_enabled:
          type: boolean
        configuration:
          type: object
          nullable: true
        sip_config:
          type: object
          nullable: true
          properties:
            username:
              type: string
            password:
              type: string
            server:
              type: string
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExtensionCreateRequest:
      type: object
      required:
        - extension_number
        - type
      properties:
        extension_number:
          type: string
          pattern: '^\d{3,5}$'
          description: 3-5 digit extension number
          example: "101"
        type:
          type: string
          enum: [user, conference, ring_group, ivr, ai_assistant, forward, ai_load_balancer, custom_logic]
        user_id:
          type: integer
          nullable: true
        configuration:
          type: object
          nullable: true
        status:
          type: string
          enum: [active, inactive]
          default: active

    ExtensionUpdateRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [user, conference, ring_group, ivr, ai_assistant, forward, ai_load_balancer, custom_logic]
        user_id:
          type: integer
          nullable: true
        ai_assistant_id:
          type: integer
          nullable: true
        configuration:
          type: object
          nullable: true
        voicemail_enabled:
          type: boolean
        status:
          type: string
          enum: [active, inactive]

    PaginatedExtensionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'

    # ==========================================
