  /v1/recordings:
    get:
      tags:
        - Recordings
      summary: List Recordings
      description: Get paginated list of recordings
      operationId: listRecordings
      parameters:
        - name: search
          in: query
          description: Search by name
          schema:
            type: string
        - name: type
          in: query
          description: Filter by type
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [active, archived, deleted]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Paginated list of recordings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordingResponse'

    post:
      tags:
        - Recordings
      summary: Upload Recording
      description: Upload a new recording file
      operationId: uploadRecording
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (WAV, MP3)
                name:
                  type: string
                  description: Recording name
                type:
                  type: string
                  description: Recording type
      responses:
        '201':
          description: Recording uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Recording'
        '422':
          description: Validation error

