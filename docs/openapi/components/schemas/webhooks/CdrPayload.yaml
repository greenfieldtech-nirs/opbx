type: object
description: Cloudonix CDR (Call Detail Record) webhook payload
properties:
  timestamp:
    type: integer
    description: CDR timestamp (Unix)
    example: 1705312860
  session:
    type: object
    properties:
      token:
        type: string
      id:
        type: integer
      callStartTime:
        type: integer
      callEndTime:
        type: integer
      callAnswerTime:
        type: integer
      status:
        type: string
  from:
    type: string
    description: Caller number
    example: '+1234567890'
  to:
    type: string
    description: Called number
    example: '+1987654321'
  disposition:
    type: string
    description: Call disposition
    example: ANSWERED
  duration:
    type: integer
    description: Call duration in seconds
    example: 120
  billsec:
    type: integer
    description: Billable seconds
    example: 115
  call_id:
    type: string
    description: SIP Call-ID
    example: CA550e8400e29b41d4a716446655440000
  domain:
    type: string
    description: Cloudonix domain
    example: example.cloudonix.io
  subscriber:
    type: string
    description: Subscriber identifier
  cx_trunk_id:
    type: integer
    description: Trunk ID
  application:
    type: string
  route:
    type: string
  rated_cost:
    type: number
    description: Rated call cost
  approx_cost:
    type: number
  sell_cost:
    type: number
  vapp_server:
    type: string
  recording_url:
    type: string
    format: uri
    description: URL to call recording
required:
  - timestamp
  - from
  - to
  - disposition
  - duration
  - billsec
  - call_id
