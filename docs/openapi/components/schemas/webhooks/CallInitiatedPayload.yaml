type: object
description: Cloudonix call-initiated webhook payload
properties:
  call_id:
    type: string
    description: Unique call identifier
    example: CA550e8400e29b41d4a716446655440000
  from:
    type: string
    description: Caller number in E.164 format
    example: '+1234567890'
  to:
    type: string
    description: Called number in E.164 format
    example: '+1987654321'
  did:
    type: string
    description: DID number that received the call
    example: '+1987654321'
  timestamp:
    type: integer
    description: Unix timestamp
    example: 1705312800
  organization_id:
    type: integer
    description: Organization ID (if known)
    example: 1
  direction:
    type: string
    enum: [inbound, outbound]
    example: inbound
  status:
    type: string
    description: Initial call status
    example: initiated
required:
  - call_id
  - from
  - to
  - did
