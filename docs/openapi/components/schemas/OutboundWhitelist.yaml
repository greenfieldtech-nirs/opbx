type: object
description: Outbound Whitelist entry
properties:
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Allowed Destinations
  pattern:
    type: string
    example: '^\+1[0-9]{10}$'
  description:
    type: string
    nullable: true
  priority:
    type: integer
    default: 0
  status:
    type: string
    enum: [active, inactive]
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - pattern
  - status
