type: object
description: AI Assistant
properties:
  id:
    type: integer
  organization_id:
    type: integer
  name:
    type: string
    example: Support Bot
  provider:
    type: string
    example: openai
  configuration:
    type: object
  status:
    type: string
    enum: [active, inactive]
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - name
  - provider
  - status
