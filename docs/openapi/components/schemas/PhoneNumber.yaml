type: object
description: Phone Number (DID)
properties:
  id:
    type: integer
  organization_id:
    type: integer
  phone_number:
    type: string
    example: '+1987654321'
  label:
    type: string
    nullable: true
    example: Main Line
  status:
    type: string
    enum: [active, inactive]
  routing_type:
    type: string
    enum: [extension, ring_group, ivr_menu, ai_assistant]
  routing_target_id:
    type: integer
    nullable: true
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
  - id
  - organization_id
  - phone_number
  - status
