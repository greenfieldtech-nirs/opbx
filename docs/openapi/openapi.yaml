openapi: 3.1.0
info:
  title: OPBX API
  description: |
    OPBX - Open Source Business PBX API
    
    This API provides complete control plane access for managing a multi-tenant business PBX system.
    The API is built on Laravel 12 with Sanctum authentication.
    
    ## Authentication
    
    The API supports two authentication modes:
    
    1. **Bearer Token** (API clients): Include `Authorization: Bearer <token>` header
    2. **Cookie-based** (SPA): Uses httpOnly session cookies + CSRF protection
    
    ## Architecture
    
    - **Control Plane**: REST API for configuration and management
    - **Execution Plane**: Webhooks for real-time call routing (returns CXML)
    
    ## Rate Limiting
    
    Rate limits are applied per organization:
    - API endpoints: 60 requests/minute
    - Webhooks: 100 requests/minute
    - Voice routing: 1000 requests/minute
    - Sensitive operations: 10 requests/minute
    
  version: 1.0.0
  contact:
    name: OPBX Support
    url: https://github.com/opbx-cloudonix
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{host}/api/v1
