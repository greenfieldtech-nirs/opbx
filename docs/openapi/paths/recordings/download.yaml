paths:
  /v1/recordings/download:
    get:
      tags:
        - Recordings
      summary: Download recording with token
      operationId: downloadRecordingWithToken
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Recording downloaded

  /v1/recordings/{recording}/download:
    get:
      tags:
        - Recordings
      summary: Download specific recording
      operationId: downloadRecording
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: recording
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recording downloaded
