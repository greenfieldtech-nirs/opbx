paths:
  /v1/validate-email:
    get:
      tags:
        - Authentication
      summary: Validate email address
      description: |
        Async email validation during registration.
        Uses UserCheck.com API for disposable/blocklisted email detection.
        Rate limited to 10 requests per minute.
      operationId: validateEmail
      security: []
      parameters:
        - name: email
          in: query
          required: true
          description: Email address to validate
          schema:
            type: string
            format: email
          example: user@example.com
      responses:
        '200':
          description: Email validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: Whether the email is valid and allowed
                  message:
                    type: string
                    description: Human-readable validation message
                  checks:
                    type: object
                    properties:
                      disposable:
                        type: boolean
                      blocklisted:
                        type: boolean
                      spam:
                        type: boolean
                      role_account:
                        type: boolean
              examples:
                valid:
                  summary: Valid email
                  value:
                    valid: true
                    message: Email is valid
                    checks:
                      disposable: false
                      blocklisted: false
                      spam: false
                      role_account: false
                disposable:
                  summary: Disposable email
                  value:
                    valid: false
                    message: Disposable email addresses are not allowed
                    checks:
                      disposable: true
                      blocklisted: false
                      spam: false
                      role_account: false
        '400':
          $ref: '../../components/responses/BadRequest.yaml'
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
