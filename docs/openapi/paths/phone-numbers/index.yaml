paths:
  /v1/phone-numbers:
    get:
      tags:
        - Phone Numbers
      summary: List Phone Numbers
      description: Get paginated list of Phone Numbers
      operationId: listPhoneNumbers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of Phone Numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/PhoneNumber.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Phone Numbers
      summary: Create Phone Number
      operationId: createPhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Phone Number created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/phone-numbers/{phone_number}:
    parameters:
      - name: phone_number
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Phone Numbers
      summary: Get Phone Number
      operationId: getPhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Phone Number details
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Phone Numbers
      summary: Update Phone Number
      operationId: updatePhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Phone Number updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Phone Numbers
      summary: Delete Phone Number
      operationId: deletePhoneNumber
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Phone Number deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
