paths:
  /v1/profile/password:
    put:
      tags:
        - Profile
      summary: Update password
      description: |
        Update current user's password.
        
        **Requirements:**
        - Current password must be provided for verification
        - New password must be at least 8 characters
        - New password must contain uppercase, lowercase, numbers, and symbols
        
        **Security:** All authentication tokens are revoked after password change.
        
        Rate limited with `throttle:sensitive` middleware.
      operationId: updatePassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  format: password
                  description: Current password
                  example: OldPass123!
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: |
                    New password requirements:
                    - At least 8 characters
                    - Upper and lowercase letters
                    - At least one number
                    - At least one special character
                  example: NewSecurePass456!
                new_password_confirmation:
                  type: string
                  format: password
                  description: Confirm new password
                  example: NewSecurePass456!
              required:
                - current_password
                - new_password
                - new_password_confirmation
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully. Please log in again with your new password.
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'
        '429':
          $ref: '../../components/responses/TooManyRequests.yaml'
        '500':
          $ref: '../../components/responses/ServerError.yaml'
