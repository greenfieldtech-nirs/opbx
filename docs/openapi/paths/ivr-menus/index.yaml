paths:
  /v1/ivr-menus:
    get:
      tags:
        - IVR Menus
      summary: List IVR Menus
      description: Get paginated list of IVR Menus
      operationId: listIVRMenus
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of IVR Menus
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/IvrMenu.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - IVR Menus
      summary: Create IVR Menu
      operationId: createIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: IVR Menu created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/ivr-menus/{ivr_menu}:
    parameters:
      - name: ivr_menu
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - IVR Menus
      summary: Get IVR Menu
      operationId: getIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: IVR Menu details
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - IVR Menus
      summary: Update IVR Menu
      operationId: updateIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: IVR Menu updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - IVR Menus
      summary: Delete IVR Menu
      operationId: deleteIVRMenu
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: IVR Menu deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
