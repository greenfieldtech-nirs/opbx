paths:
  /v1/call-logs/active:
    get:
      tags:
        - Call Logs
      summary: Get active calls
      description: Get currently active (in-progress) calls
      operationId: getActiveCalls
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Active calls
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallLog.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
