paths:
  /v1/platform/organizations/{organization}/users:
    get:
      tags:
        - Platform
      summary: List users by organization
      operationId: listOrganizationUsers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Users list
    
    post:
      tags:
        - Platform
      summary: Create user in organization
      operationId: createOrganizationUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: User created
