paths:
  /v1/call-detail-records:
    get:
      tags:
        - Call Detail Records
      summary: List Call Detail Records
      description: Get paginated list of Call Detail Records
      operationId: listCallDetailRecords
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '../../components/parameters/query/Page.yaml'
        - $ref: '../../components/parameters/query/PerPage.yaml'
      responses:
        '200':
          description: List of Call Detail Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/CallDetailRecord.yaml'
                  meta:
                    $ref: '../../components/schemas/PaginationMeta.yaml'
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'

    post:
      tags:
        - Call Detail Records
      summary: Create Call Detail Record
      operationId: createCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Call Detail Record created
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

  /v1/call-detail-records/{call_detail_record}:
    parameters:
      - name: call_detail_record
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Call Detail Records
      summary: Get Call Detail Record
      operationId: getCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Call Detail Record details
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'

    put:
      tags:
        - Call Detail Records
      summary: Update Call Detail Record
      operationId: updateCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Call Detail Record updated
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
        '422':
          $ref: '../../components/responses/ValidationError.yaml'

    delete:
      tags:
        - Call Detail Records
      summary: Delete Call Detail Record
      operationId: deleteCallDetailRecord
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Call Detail Record deleted
        '401':
          $ref: '../../components/responses/Unauthorized.yaml'
        '404':
          $ref: '../../components/responses/NotFound.yaml'
