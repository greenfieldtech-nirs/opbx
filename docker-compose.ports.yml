# Opt-in, loopback-only host ports for local tooling (DB client, redis-cli, MinIO UI, MCP clients).
# Never use in production. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
services:
  mysql:
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:3306"
  redis:
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:6379"
  minio:
    ports:
      - "127.0.0.1:${MINIO_EXPOSE_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_EXPOSE_PORT:-9001}:9001"
  dialer-worker:
    ports:
      - "127.0.0.1:${DIALER_WEBHOOK_HOST_PORT:-8181}:8081"
  mcp-server:
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
